        body {

        button { font: inherit; }
        .page { max-width: 1140px; margin: 0 auto; padding: 40px 24px 72px; }
        .card {

            border-radius: 16px;
            background: #fff;
            box-shadow: var(--shadow);
        }
        .kicker {
            margin: 0;
            color: var(--accent);
            font-size: 12px;
            font-weight: 650;
            letter-spacing: 0.08em;
            text-transform: uppercase;

        h1 { margin: 8px 0 0; color: var(--ink); font-size: 30px; line-height: 1.25; }
        .subtitle { margin: 8px 0 0; color: var(--muted); font-size: 14px; line-height: 1.6; }
        .stats { display: flex; flex-wrap: wrap; gap: 8px; margin: 16px 0 0; }
        .stat {

            border: 1px solid var(--line);
            border-radius: 999px;
            background: #fff;
            color: var(--ink);
            font-size: 12px;

        .overview {
            display: grid;
            grid-template-columns: minmax(0, 1fr) 316px;

            margin: 24px 0 0;

        .map-card { overflow: hidden; }

        .side {

            flex-direction: column;
            gap: 12px;
            max-height: 520px;
            padding: 16px;
        }
        .day-tabs {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(84px, 1fr));
            gap: 6px;
        }
        .day-tab {
            border: 1px solid var(--line);
            border-radius: 10px;
            padding: 8px 4px;
            background: #fff;
            color: var(--muted);
            cursor: pointer;
            font-size: 12px;
            line-height: 1.3;
        }
        .day-tab:hover, .day-tab:focus-visible { border-color: var(--accent); outline: none; }
        .day-tab.is-active { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); font-weight: 700; }
        .day-summary {
            padding: 10px 12px;
            border-left: 3px solid var(--accent);
            border-radius: 6px;
            background: #f5f9fb;
        }
        .day-title { margin: 0; color: var(--ink); font-size: 14px; font-weight: 700; }
        .day-meta { margin: 4px 0 0; color: var(--muted); font-size: 12px; line-height: 1.5; }
        .glance {
            flex: 1;
            overflow: auto;
            margin: 0;
            padding: 0;
            list-style: none;
        }
        .glance-item + .glance-item { border-top: 1px solid var(--line); }
        .stop {
            display: grid;
            grid-template-columns: 26px 1fr;
            gap: 10px;
            align-items: center;
            width: 100%;
            padding: 8px 6px;
            border: 0;
            border-radius: 8px;
            background: transparent;
            color: inherit;
            text-align: left;
            cursor: pointer;

        .stop:hover, .stop:focus-visible, .stop.is-active { background: var(--accent-soft); outline: none; }
        .route-stat {
            margin: 0;
            padding-top: 10px;
            border-top: 1px solid var(--line);
            color: var(--muted);
            font-size: 12px;
            line-height: 1.5;

        .badge, .num-marker {
            display: grid;
            place-items: center;
            border-radius: 50%;
            background: var(--accent);
            color: #fff;
            font-weight: 700;
        }
        .badge { width: 26px; height: 26px; margin-top: 1px; font-size: 12px; }
        .num-marker {
            width: 29px;
            height: 29px;
            border: 2px solid #fff;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.27);
            font-size: 12px;
        }

        .badge.is-highlight, .num-marker.is-highlight { background: var(--warm); }
        .stop-title { color: var(--ink); font-size: 14px; font-weight: 650; }
        .stop-meta { display: block; margin-top: 2px; color: var(--muted); font-size: 12px; line-height: 1.4; }
        .tag {
            display: inline-block;
            margin-left: 6px;
            padding: 1px 6px;
            border-radius: 999px;
            background: var(--warm-soft);
            color: var(--warm);
            font-size: 10px;
            font-weight: 700;
            vertical-align: 1px;

        .detail { margin: 32px 0 0; }

            align-items: baseline;
            gap: 4px 12px;
            padding-bottom: 10px;

        .timeline { display: grid; gap: 10px; margin: 18px 0 0; padding: 0; list-style: none; }
        .timeline-item { display: grid; gap: 10px; }
        .leg-row {
            display: flex;
            align-items: center;
            gap: 9px;
            padding-left: 18px;
            color: var(--muted);
            font-size: 12px;
        }

            content: "";
            width: 2px;
            height: 20px;
            border-radius: 2px;
            background: var(--line);
        }
        .stop-card {
            padding: 16px 18px;
            border: 1px solid var(--line);
            border-radius: 16px;
            background: #fff;
            box-shadow: var(--shadow);
            scroll-margin-top: 16px;

            align-items: start;
            padding: 0;

        .stop-card .stop-title { font-size: 17px; font-weight: 700; }
        .stop-card .stop-meta { margin-top: 4px; font-size: 13px; }
        .activities {
            display: grid;
            gap: 8px;
            margin: 12px 0 0;
            padding: 12px 0 0;
            border-top: 1px dashed var(--line);
            list-style: none;
        }
        .activity {
            display: grid;
            grid-template-columns: 96px 1fr;
            gap: 12px;
            font-size: 13.5px;
            line-height: 1.6;

        .activity-time { color: var(--accent); font-weight: 650; font-variant-numeric: tabular-nums; }
        .activity-text { color: var(--ink); }
        .note {
            display: block;
            margin-top: 10px;
            padding: 8px 10px;
            border-radius: 8px;
            background: var(--warm-soft);
            color: var(--warm);
            font-size: 12.5px;
            line-height: 1.5;
        }

        .popup-title { margin: 0 0 4px; color: var(--ink); font-size: 14px; font-weight: 700; }
        .popup-meta { margin: 0; color: var(--muted); font-size: 12px; }
        .activities--popup { gap: 5px; margin-top: 8px; font-size: 12px; }

</head>

                        note: "Umeda Sky Building 空中庭园展望台"
                    }
                ]
            },
            {
                date: "09/26",
                weekday: "周三",
                title: "整理行李，关西机场返程",
                meta: "退房后前往关西机场飞回上海",
                color: "#4f6d7a",
                flightStat: "Haruka / 机场线 + 返程航班示意线",
                stops: [
                    {
                        name: "大阪入住",
                        time: "上午",
                        kind: "stay",
                        lat: 34.6659, lng: 135.5004,
                        activities: [
                            { time: "上午", text: "整理行李，办理退房" }
                        ]
                    },
                    {
                        name: "关西国际机场",
                        time: "送机",
                        drive: "Haruka / 机场线约 50–75 分钟",
                        leg: "flight",
                        lat: 34.4342, lng: 135.2443,
                        activities: [
                            { time: "出发前", text: "前往关西机场，搭乘航班返程" }
                        ]
                    },
                    {
                        name: "上海浦东国际机场",
                        time: "抵达",
                        drive: "飞行约 2 小时",
                        leg: "flight",
                        lat: 31.1443, lng: 121.8083,
                        activities: [
                            { time: "抵达后", text: "回到上海，行程结束" }
                        ]
                    }
                ]
            }
        ];

        const map = L.map("map", { zoomControl: true }).setView([34.85, 135.55], 9);
        L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
            maxZoom: 19,
            attribution: "&copy; OpenStreetMap contributors"
        }).addTo(map);

        const tabsEl = document.getElementById("dayTabs");
        const summaryEl = document.getElementById("daySummary");
        const glanceEl = document.getElementById("glance");
        const itineraryEl = document.getElementById("itinerary");
        const detailTitleEl = document.getElementById("detailTitle");
        const detailNoteEl = document.getElementById("detailNote");
        const routeStatEl = document.getElementById("routeStat");
        let routeLines = [];
        let markers = [];
        let activeDay = 0;

        days.forEach((day, index) => {
            const button = document.createElement("button");
            button.type = "button";
            button.className = "day-tab";
            button.innerHTML = `${escapeHtml(day.date)}<br>${escapeHtml(day.weekday)}`;
            button.addEventListener("click", () => renderDay(index));
            tabsEl.appendChild(button);
        });

        function highlightStop(index) {
            document.querySelectorAll(".stop").forEach((el) => {
                el.classList.toggle("is-active", Number(el.dataset.index) === index);
            });
            document.querySelectorAll(".stop-card").forEach((card, i) => {
                card.classList.toggle("is-active", i === index);
            });
        }

        function focusStop(index, { scroll = false } = {}) {
            highlightStop(index);
            const zoom = days[activeDay].zoom || 12;
            map.flyTo(markers[index].getLatLng(), zoom, { duration: 0.7 });
            markers[index].openPopup();
            if (scroll) {
                itineraryEl.children[index].scrollIntoView({ behavior: "smooth", block: "center" });
            }
        }

        [glanceEl, itineraryEl].forEach((container) => {
            container.addEventListener("click", (event) => {
                const button = event.target.closest(".stop");
                if (!button) return;
                focusStop(Number(button.dataset.index), { scroll: container === glanceEl });
            });
        });

        function splitLegs(day, coords) {
            const groups = [];
            let current = { type: "drive", points: [coords[0]] };
            for (let i = 1; i < day.stops.length; i++) {
                const type = day.stops[i].leg === "flight" ? "flight" : "drive";
                if (type === current.type) {
                    current.points.push(coords[i]);
                } else {
                    groups.push(current);
                    current = { type, points: [coords[i - 1], coords[i]] };
                }
            }
            groups.push(current);
            return groups.filter((group) => group.points.length > 1);
        }

        async function renderDay(dayIndex) {
            activeDay = dayIndex;
            const day = days[dayIndex];
            document.querySelectorAll(".day-tab").forEach((tab, index) => {
                tab.classList.toggle("is-active", index === dayIndex);
            });
            summaryEl.innerHTML = `
                <p class="day-title">${escapeHtml(day.date)} ${escapeHtml(day.weekday)}</p>
                <p class="day-meta">${escapeHtml(day.title)}</p>`;
            detailTitleEl.textContent = [`${day.date} ${day.weekday}`, day.title].filter(Boolean).join(" · ");
            detailNoteEl.textContent = [`${day.stops.length} 个地点`, day.meta].filter(Boolean).join(" · ");
            glanceEl.innerHTML = "";
            itineraryEl.innerHTML = "";
            markers.forEach((marker) => marker.remove());
            markers = [];
            routeLines.forEach((line) => line.remove());
            routeLines = [];

            const coords = day.stops.map((stop) => [stop.lat, stop.lng]);

            day.stops.forEach((stop, index) => {
                const number = index + 1;
                const kindClass = stop.kind ? ` is-${stop.kind}` : "";
                const label = stop.kind === "stay"
                    ? '<span class="tag tag--stay">住宿</span>'
                    : stop.kind === "highlight"
                        ? '<span class="tag">重点</span>'
                        : "";
                const activityRows = stop.activities.map((activity) => `
                    <li class="activity">
                        <span class="activity-time">${escapeHtml(activity.time)}</span>
                        <span class="activity-text">${escapeHtml(activity.text)}</span>
                    </li>`).join("");
                const meta = [stop.drive, stop.time].filter(Boolean).join(" · ");
                const note = stop.note ? `<span class="note">${escapeHtml(stop.note)}</span>` : "";

                const marker = L.marker([stop.lat, stop.lng], {
                    icon: L.divIcon({
                        className: "",
                        html: `<div class="num-marker${kindClass}" style="background:${kindClass ? "" : day.color}">${number}</div>`,
                        iconSize: [29, 29],
                        iconAnchor: [14, 14],
                        popupAnchor: [0, -16]
                    })
                }).addTo(map);
                marker.bindPopup(`
                    <p class="popup-title">${number}. ${escapeHtml(stop.name)}${label}</p>
                    <p class="popup-meta">${escapeHtml(meta)}</p>
                    ${note}
                    <ul class="activities activities--popup">${activityRows}</ul>`);
                marker.on("click", () => highlightStop(index));
                markers.push(marker);

                const badgeStyle = kindClass ? "" : ` style="background:${day.color}"`;
                const glanceItem = document.createElement("li");
                glanceItem.className = "glance-item";
                glanceItem.innerHTML = `
                    <button class="stop" type="button" data-index="${index}">
                        <span class="badge${kindClass}"${badgeStyle}>${number}</span>
                        <span>
                            <span class="stop-title">${escapeHtml(stop.name)}${label}</span>
                            <span class="stop-meta">${escapeHtml(stop.time || "")}</span>
                        </span>
                    </button>`;
                glanceEl.appendChild(glanceItem);

                const item = document.createElement("li");
                item.className = "timeline-item";
                item.innerHTML = `
                    ${stop.drive ? `<p class="leg-row">${escapeHtml(stop.drive)}</p>` : ""}
                    <article class="stop-card">
                        <button class="stop" type="button" data-index="${index}">
                            <span class="badge${kindClass}"${badgeStyle}>${number}</span>
                            <span>
                                <span class="stop-title">${escapeHtml(stop.name)}${label}</span>
                                <span class="stop-meta">${escapeHtml(stop.time || "")}</span>
                            </span>
                        </button>
                        <ul class="activities">${activityRows}</ul>
                        ${note}
                    </article>`;
                itineraryEl.appendChild(item);
            });

            const fallback = L.polyline(coords, {
                color: day.color,
                weight: 4,
                opacity: 0.82,
                dashArray: "8, 8"
            }).addTo(map);
            routeLines.push(fallback);
            map.fitBounds(fallback.getBounds().pad(0.18));
            await loadRoute(day, coords, dayIndex, fallback);
        }

        async function loadRoute(day, coords, expectedDay, fallback) {
            const groups = splitLegs(day, coords);
            const profile = day.mode === "foot" ? "foot" : "driving";
            const waiting = day.mode === "foot" ? "正在规划步行路线…" : "正在规划当日路线…";
            routeStatEl.textContent = waiting;

            let driveKm = 0;
            let driveMin = 0;
            let hasFlight = false;
            let routed = false;

            for (const group of groups) {
                if (group.type === "flight") {
                    hasFlight = true;
                    const line = L.polyline(group.points, {
                        color: day.color,
                        weight: 3,
                        opacity: 0.75,
                        dashArray: "8, 8"
                    }).addTo(map);
                    routeLines.push(line);
                    continue;
                }
                const path = group.points.map(([lat, lng]) => `${lng},${lat}`).join(";");
                const url = `https://router.project-osrm.org/route/v1/${profile}/${path}?overview=full&geometries=geojson`;
                try {
                    const response = await fetch(url);
                    if (!response.ok) throw new Error("route request failed");
                    const data = await response.json();
                    if (activeDay !== expectedDay) return;
                    const route = data.routes && data.routes[0];
                    if (!route) throw new Error("no route returned");
                    const line = L.polyline(
                        route.geometry.coordinates.map(([lng, lat]) => [lat, lng]),
                        { color: day.color, weight: 4, opacity: 0.85 }
                    ).addTo(map);
                    routeLines.push(line);
                    driveKm += route.distance / 1000;
                    driveMin += route.duration / 60;
                    routed = true;
                } catch (error) {
                    const line = L.polyline(group.points, {
                        color: day.color,
                        weight: 4,
                        opacity: 0.82,
                        dashArray: "8, 8"
                    }).addTo(map);
                    routeLines.push(line);
                }
            }

            if (activeDay !== expectedDay) return;
            if (fallback) {
                fallback.remove();
                routeLines = routeLines.filter((line) => line !== fallback);
            }

            const parts = [];
            if (hasFlight) parts.push(day.flightStat || "航班示意线");
            if (routed) {
                const km = profile === "foot" ? driveKm.toFixed(1) : Math.round(driveKm);
                const minutes = Math.round(driveMin);
                const time = minutes >= 60
                    ? `${Math.floor(minutes / 60)} 小时 ${minutes % 60} 分`
                    : `${minutes} 分`;
                const label = profile === "foot" ? "步行" : "自驾";
                parts.push(`${label}约 ${km} km · ${time}`);
            } else if (!hasFlight) {
                parts.push(profile === "foot" ? "步行路线暂不可用，显示直线示意" : "路线暂不可用，显示直线示意");
            }
            routeStatEl.textContent = parts.join(" · ");

            const bounds = routeLines.reduce((acc, line) => acc.extend(line.getBounds()), routeLines[0].getBounds());
            map.fitBounds(bounds.pad(0.15));
        }

        function escapeHtml(value) {
            return String(value)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;");
        }

        renderDay(0);
    </script>
</body>
</html>
