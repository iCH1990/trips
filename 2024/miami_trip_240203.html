<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <title>美国 Miami / Key West 2024/02/03</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        :root {
            --ink: #164e63;
            --muted: #4a6672;
            --line: #dce5ec;
            --accent: #0e7490;
            --accent-soft: #e0f4f8;
            --warm: #b45f24;
            --warm-soft: #fff0df;
            --stay: #6b4ea0;
            --stay-soft: #f0eafa;
            --bg: #f4f7f9;
            --shadow: 0 1px 2px rgba(15, 35, 55, 0.05);
            --shadow-lift: 0 10px 28px rgba(15, 35, 55, 0.1);
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            background: var(--bg);
            color: var(--ink);
            font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
        }
        button { font: inherit; }
        .page { max-width: 1140px; margin: 0 auto; padding: 40px 24px 72px; }
        .card {
            border: 1px solid var(--line);
            border-radius: 16px;
            background: #fff;
            box-shadow: var(--shadow);
        }
        .kicker {
            margin: 0;
            color: var(--accent);
            font-size: 12px;
            font-weight: 650;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }
        h1 { margin: 8px 0 0; color: var(--ink); font-size: 30px; line-height: 1.25; }
        .subtitle { margin: 8px 0 0; color: var(--muted); font-size: 14px; line-height: 1.6; }
        .stats { display: flex; flex-wrap: wrap; gap: 8px; margin: 16px 0 0; }
        .stat {
            padding: 5px 11px;
            border: 1px solid var(--line);
            border-radius: 999px;
            background: #fff;
            color: var(--ink);
            font-size: 12px;
        }
        .overview {
            display: grid;
            grid-template-columns: minmax(0, 1fr) 316px;
            gap: 16px;
            margin: 24px 0 0;
        }
        .map-card { overflow: hidden; }
        #map { width: 100%; height: 100%; min-height: 520px; }
        .side {
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-height: 520px;
            padding: 16px;
        }
        .day-tabs {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(84px, 1fr));
            gap: 6px;
        }
        .day-tab {
            border: 1px solid var(--line);
            border-radius: 10px;
            padding: 8px 4px;
            background: #fff;
            color: var(--muted);
            cursor: pointer;
            font-size: 12px;
            line-height: 1.3;
        }
        .day-tab:hover, .day-tab:focus-visible { border-color: var(--accent); outline: none; }
        .day-tab.is-active { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); font-weight: 700; }
        .day-summary {
            padding: 10px 12px;
            border-left: 3px solid var(--accent);
            border-radius: 6px;
            background: #f5f9fb;
        }
        .day-title { margin: 0; color: var(--ink); font-size: 14px; font-weight: 700; }
        .day-meta { margin: 4px 0 0; color: var(--muted); font-size: 12px; line-height: 1.5; }
        .glance {
            flex: 1;
            overflow: auto;
            margin: 0;
            padding: 0;
            list-style: none;
        }
        .glance-item + .glance-item { border-top: 1px solid var(--line); }
        .stop {
            display: grid;
            grid-template-columns: 26px 1fr;
            gap: 10px;
            align-items: center;
            width: 100%;
            padding: 8px 6px;
            border: 0;
            border-radius: 8px;
            background: transparent;
            color: inherit;
            text-align: left;
            cursor: pointer;
        }
        .stop:hover, .stop:focus-visible, .stop.is-active { background: var(--accent-soft); outline: none; }
        .route-stat {
            margin: 0;
            padding-top: 10px;
            border-top: 1px solid var(--line);
            color: var(--muted);
            font-size: 12px;
            line-height: 1.5;
        }
        .badge, .num-marker {
            display: grid;
            place-items: center;
            border-radius: 50%;
            background: var(--accent);
            color: #fff;
            font-weight: 700;
        }
        .badge { width: 26px; height: 26px; margin-top: 1px; font-size: 12px; }
        .num-marker {
            width: 29px;
            height: 29px;
            border: 2px solid #fff;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.27);
            font-size: 12px;
        }
        .badge.is-stay, .num-marker.is-stay { background: var(--stay); }
        .badge.is-highlight, .num-marker.is-highlight { background: var(--warm); }
        .stop-title { color: var(--ink); font-size: 14px; font-weight: 650; }
        .stop-meta { display: block; margin-top: 2px; color: var(--muted); font-size: 12px; line-height: 1.4; }
        .tag {
            display: inline-block;
            margin-left: 6px;
            padding: 1px 6px;
            border-radius: 999px;
            background: var(--warm-soft);
            color: var(--warm);
            font-size: 10px;
            font-weight: 700;
            vertical-align: 1px;
        }
        .tag--stay { background: var(--stay-soft); color: var(--stay); }
        .detail { margin: 32px 0 0; }
        .detail-head {
            display: flex;
            flex-wrap: wrap;
            align-items: baseline;
            gap: 4px 12px;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--line);
        }
        .detail-head h2 { margin: 0; font-size: 20px; }
        .detail-note { margin: 0; color: var(--muted); font-size: 13px; }
        .timeline { display: grid; gap: 10px; margin: 18px 0 0; padding: 0; list-style: none; }
        .timeline-item { display: grid; gap: 10px; }
        .leg-row {
            display: flex;
            align-items: center;
            gap: 9px;
            padding-left: 18px;
            color: var(--muted);
            font-size: 12px;
        }
        .leg-row::before {
            content: "";
            width: 2px;
            height: 20px;
            border-radius: 2px;
            background: var(--line);
        }
        .stop-card {
            padding: 16px 18px;
            border: 1px solid var(--line);
            border-radius: 16px;
            background: #fff;
            box-shadow: var(--shadow);
            scroll-margin-top: 16px;
            transition: border-color 0.18s ease, box-shadow 0.18s ease;
        }
        .stop-card.is-active { border-color: var(--accent); box-shadow: var(--shadow-lift); }
        .stop-card .stop {
            grid-template-columns: 32px 1fr;
            gap: 12px;
            align-items: start;
            padding: 0;
        }
        .stop-card .stop:hover, .stop-card .stop:focus-visible, .stop-card .stop.is-active { background: transparent; }
        .stop-card .badge { width: 32px; height: 32px; margin-top: 0; font-size: 14px; }
        .stop-card .stop-title { font-size: 17px; font-weight: 700; }
        .stop-card .stop-meta { margin-top: 4px; font-size: 13px; }
        .activities {
            display: grid;
            gap: 8px;
            margin: 12px 0 0;
            padding: 12px 0 0;
            border-top: 1px dashed var(--line);
            list-style: none;
        }
        .activity {
            display: grid;
            grid-template-columns: 96px 1fr;
            gap: 12px;
            font-size: 13.5px;
            line-height: 1.6;
        }
        .activity-time { color: var(--accent); font-weight: 650; font-variant-numeric: tabular-nums; }
        .activity-text { color: var(--ink); }
        .note {
            display: block;
            margin-top: 10px;
            padding: 8px 10px;
            border-radius: 8px;
            background: var(--warm-soft);
            color: var(--warm);
            font-size: 12.5px;
            line-height: 1.5;
        }
        .hint { margin: 28px 0 0; color: #6c7d8e; font-size: 12px; line-height: 1.6; }
        .popup-title { margin: 0 0 4px; color: var(--ink); font-size: 14px; font-weight: 700; }
        .popup-meta { margin: 0; color: var(--muted); font-size: 12px; }
        .activities--popup { gap: 5px; margin-top: 8px; font-size: 12px; }
        .activities--popup .activity { grid-template-columns: 72px 1fr; gap: 8px; font-size: 12px; }
        .leaflet-popup-content { margin: 10px 13px; min-width: 235px; }
        @media (max-width: 880px) {
            .overview { grid-template-columns: minmax(0, 1fr); }
            #map { min-height: 380px; }
            .side { max-height: none; }
            .glance { overflow: visible; }
        }
        @media (max-width: 560px) {
            .page { padding: 28px 16px 56px; }
            h1 { font-size: 23px; }
            .stop-card { padding: 14px 15px; }
            .stop-card .stop-title { font-size: 16px; }
            .activity { grid-template-columns: 72px 1fr; gap: 8px; font-size: 13px; }
        }
    </style>
</head>
<body>
    <div class="page">
        <header class="trip-head">
            <p class="kicker">United States · 2024</p>
            <h1>美国 Miami / Key West 2024/02/03</h1>
            <p class="subtitle">🇺🇸 · 一天 · 自驾 · Overseas Highway 往返 Key West</p>
            <div class="stats">
                <span class="stat">1 天</span>
                <span class="stat">Brickell 出发</span>
                <span class="stat">Key West</span>
            </div>
        </header>
        <section class="overview" aria-label="行程总览">
            <div class="card map-card">
                <div id="map" role="application" aria-label="Miami 至 Key West 一日自驾地图"></div>
            </div>
            <div class="card side">
                <nav class="day-tabs" id="dayTabs" aria-label="选择日期"></nav>
                <div class="day-summary" id="daySummary"></div>
                <ol class="glance" id="glance"></ol>
                <p class="route-stat" id="routeStat">正在规划当日路线…</p>
            </div>
        </section>
        <section class="detail" aria-label="当日详细安排">
            <div class="detail-head">
                <h2 id="detailTitle"></h2>
                <p class="detail-note" id="detailNote"></p>
            </div>
            <ol class="timeline" id="itinerary"></ol>
        </section>
        <p class="hint">Overseas Highway 桥上不能停车拍照，观景请用指定停车区。Vista Point 车位少，停一下就走。海明威故居约 17:00 关门，需提前入馆。当天 Key West 日落约 18:17。Bobalu's 周六开到 21:30。驾驶时间按 OSRM 常规路况估算。</p>
    </div>

    <script>
        const days = [
            {
                date: "2/3",
                weekday: "周六",
                title: "Brickell 出发，沿 Overseas Highway 到 Key West，日落后再回",
                meta: "Mrs. Mac's brunch · 途中观景 · 最南端与海明威故居 · Mallory Square 日落 · Big Coppitt 晚饭",
                color: "#0e7490",
                stops: [
                    {
                        name: "Brickell",
                        time: "09:00 出发",
                        kind: "stay",
                        lat: 25.7664, lng: -80.1920,
                        activities: [
                            { time: "09:00", text: "出发前往 Key Largo，走 US-1，车程约 1 小时 20 分" }
                        ]
                    },
                    {
                        name: "Mrs. Mac's Kitchen (Original)",
                        time: "10:20–11:35",
                        drive: "开车约 1 小时 20 分",
                        lat: 25.0920, lng: -80.4440,
                        activities: [
                            { time: "10:20–11:35", text: "在 Original / Little 店吃 brunch，再继续南下" }
                        ],
                        note: "99336 Overseas Hwy, Key Largo, FL 33037 · 不要去 Big 店"
                    },
                    {
                        name: "Anne's Beach",
                        time: "12:15–12:40",
                        drive: "开车约 40 分钟",
                        lat: 24.8467, lng: -80.7443,
                        activities: [
                            { time: "12:15–12:40", text: "Islamorada 浅滩观景拍照，之后继续南下" }
                        ],
                        note: "MM 73.5 US-1 Oceanside, Islamorada"
                    },
                    {
                        name: "7 Mile Bridge - Vista Point",
                        time: "13:25–13:50",
                        drive: "开车约 45 分钟",
                        kind: "highlight",
                        lat: 24.7116, lng: -81.1230,
                        activities: [
                            { time: "13:25–13:50", text: "在 Knights Key 指定停车区停留拍照，可走一小段旧桥" }
                        ],
                        note: "Marathon / Knights Key，MM 47 附近。桥上车道上不要停车"
                    },
                    {
                        name: "Bahia Honda State Park",
                        time: "14:05–14:25",
                        drive: "开车约 15 分钟",
                        lat: 24.6642, lng: -81.2745,
                        activities: [
                            { time: "14:05–14:25", text: "看 Old Bahia Honda Bridge 与水色，短停后直奔 Key West" }
                        ],
                        note: "36850 Overseas Hwy, Big Pine Key, FL 33043 · 进园可能收费"
                    },
                    {
                        name: "Southernmost Point of the Continental U.S.A.",
                        time: "15:10–15:35",
                        drive: "开车约 45 分钟",
                        kind: "highlight",
                        lat: 24.5465, lng: -81.7977,
                        activities: [
                            { time: "15:10–15:35", text: "南端浮标打卡，人多就快速拍完去海明威故居" }
                        ],
                        note: "Whitehead St & South St, Key West, FL 33040"
                    },
                    {
                        name: "The Ernest Hemingway Home & Museum",
                        time: "15:45–16:50",
                        drive: "开车约 5 分钟",
                        kind: "highlight",
                        lat: 24.5512, lng: -81.8006,
                        activities: [
                            { time: "15:45–16:50", text: "参观故居与多趾猫，关门前离开" }
                        ],
                        note: "907 Whitehead St, Key West, FL 33040 · 约 17:00 关门，尽量 16:30 前入馆"
                    },
                    {
                        name: "Mallory Square",
                        time: "17:40–18:50",
                        drive: "开车约 8 分钟",
                        kind: "highlight",
                        lat: 24.5597, lng: -81.8074,
                        activities: [
                            { time: "17:40–18:17", text: "日落前到广场占位置，看街头表演与落日（约 18:17）" },
                            { time: "18:20–18:50", text: "日落后再在 Old Town / Duval Street 逛一下" }
                        ],
                        note: "400 Wall St, Key West, FL 33040"
                    },
                    {
                        name: "Bobalu's Southern Cafe",
                        time: "19:20–20:40",
                        drive: "开车约 20 分钟",
                        lat: 24.5987, lng: -81.6573,
                        activities: [
                            { time: "19:20–20:40", text: "路过 Big Coppitt Key 吃晚饭，吃完直接回 Brickell" }
                        ],
                        note: "301 US-1, Big Coppitt Key, FL 33040 · 周六约 21:30 关门"
                    },
                    {
                        name: "Brickell",
                        time: "23:50 行程结束",
                        drive: "开车约 3 小时",
                        kind: "stay",
                        lat: 25.7664, lng: -80.1920,
                        activities: [
                            { time: "20:50", text: "从 Big Coppitt 上 US-1 直接返回" },
                            { time: "23:50", text: "回到 Brickell，行程结束" }
                        ]
                    }
                ]
            }
        ];

        const map = L.map("map", { zoomControl: true }).setView([24.9, -81.0], 8);
        L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
            maxZoom: 19,
            attribution: "&copy; OpenStreetMap contributors"
        }).addTo(map);

        const tabsEl = document.getElementById("dayTabs");
        const summaryEl = document.getElementById("daySummary");
        const glanceEl = document.getElementById("glance");
        const itineraryEl = document.getElementById("itinerary");
        const detailTitleEl = document.getElementById("detailTitle");
        const detailNoteEl = document.getElementById("detailNote");
        const routeStatEl = document.getElementById("routeStat");
        let routeLines = [];
        let markers = [];
        let activeDay = 0;

        days.forEach((day, index) => {
            const button = document.createElement("button");
            button.type = "button";
            button.className = "day-tab";
            button.innerHTML = `${escapeHtml(day.date)}<br>${escapeHtml(day.weekday)}`;
            button.addEventListener("click", () => renderDay(index));
            tabsEl.appendChild(button);
        });

        function highlightStop(index) {
            document.querySelectorAll(".stop").forEach((el) => {
                el.classList.toggle("is-active", Number(el.dataset.index) === index);
            });
            document.querySelectorAll(".stop-card").forEach((card, i) => {
                card.classList.toggle("is-active", i === index);
            });
        }

        function focusStop(index, { scroll = false } = {}) {
            highlightStop(index);
            const zoom = days[activeDay].zoom || 12;
            map.flyTo(markers[index].getLatLng(), zoom, { duration: 0.7 });
            markers[index].openPopup();
            if (scroll) {
                itineraryEl.children[index].scrollIntoView({ behavior: "smooth", block: "center" });
            }
        }

        [glanceEl, itineraryEl].forEach((container) => {
            container.addEventListener("click", (event) => {
                const button = event.target.closest(".stop");
                if (!button) return;
                focusStop(Number(button.dataset.index), { scroll: container === glanceEl });
            });
        });

        function splitLegs(day, coords) {
            const groups = [];
            let current = { type: "drive", points: [coords[0]] };
            for (let i = 1; i < day.stops.length; i++) {
                const type = day.stops[i].leg === "flight" ? "flight" : "drive";
                if (type === current.type) {
                    current.points.push(coords[i]);
                } else {
                    groups.push(current);
                    current = { type, points: [coords[i - 1], coords[i]] };
                }
            }
            groups.push(current);
            return groups.filter((group) => group.points.length > 1);
        }

        async function renderDay(dayIndex) {
            activeDay = dayIndex;
            const day = days[dayIndex];
            document.querySelectorAll(".day-tab").forEach((tab, index) => {
                tab.classList.toggle("is-active", index === dayIndex);
            });
            summaryEl.innerHTML = `
                <p class="day-title">${escapeHtml(day.date)} ${escapeHtml(day.weekday)}</p>
                <p class="day-meta">${escapeHtml(day.title)}</p>`;
            detailTitleEl.textContent = [`${day.date} ${day.weekday}`, day.title].filter(Boolean).join(" · ");
            detailNoteEl.textContent = [`${day.stops.length} 个地点`, day.meta].filter(Boolean).join(" · ");
            glanceEl.innerHTML = "";
            itineraryEl.innerHTML = "";
            markers.forEach((marker) => marker.remove());
            markers = [];
            routeLines.forEach((line) => line.remove());
            routeLines = [];

            const coords = day.stops.map((stop) => [stop.lat, stop.lng]);

            day.stops.forEach((stop, index) => {
                const number = index + 1;
                const kindClass = stop.kind ? ` is-${stop.kind}` : "";
                const label = stop.kind === "stay"
                    ? '<span class="tag tag--stay">住宿</span>'
                    : stop.kind === "highlight"
                        ? '<span class="tag">重点</span>'
                        : "";
                const activityRows = stop.activities.map((activity) => `
                    <li class="activity">
                        <span class="activity-time">${escapeHtml(activity.time)}</span>
                        <span class="activity-text">${escapeHtml(activity.text)}</span>
                    </li>`).join("");
                const meta = [stop.drive, stop.time].filter(Boolean).join(" · ");
                const note = stop.note ? `<span class="note">${escapeHtml(stop.note)}</span>` : "";

                const marker = L.marker([stop.lat, stop.lng], {
                    icon: L.divIcon({
                        className: "",
                        html: `<div class="num-marker${kindClass}" style="background:${kindClass ? "" : day.color}">${number}</div>`,
                        iconSize: [29, 29],
                        iconAnchor: [14, 14],
                        popupAnchor: [0, -16]
                    })
                }).addTo(map);
                marker.bindPopup(`
                    <p class="popup-title">${number}. ${escapeHtml(stop.name)}${label}</p>
                    <p class="popup-meta">${escapeHtml(meta)}</p>
                    ${note}
                    <ul class="activities activities--popup">${activityRows}</ul>`);
                marker.on("click", () => highlightStop(index));
                markers.push(marker);

                const badgeStyle = kindClass ? "" : ` style="background:${day.color}"`;
                const glanceItem = document.createElement("li");
                glanceItem.className = "glance-item";
                glanceItem.innerHTML = `
                    <button class="stop" type="button" data-index="${index}">
                        <span class="badge${kindClass}"${badgeStyle}>${number}</span>
                        <span>
                            <span class="stop-title">${escapeHtml(stop.name)}${label}</span>
                            <span class="stop-meta">${escapeHtml(stop.time || "")}</span>
                        </span>
                    </button>`;
                glanceEl.appendChild(glanceItem);

                const item = document.createElement("li");
                item.className = "timeline-item";
                item.innerHTML = `
                    ${stop.drive ? `<p class="leg-row">${escapeHtml(stop.drive)}</p>` : ""}
                    <article class="stop-card">
                        <button class="stop" type="button" data-index="${index}">
                            <span class="badge${kindClass}"${badgeStyle}>${number}</span>
                            <span>
                                <span class="stop-title">${escapeHtml(stop.name)}${label}</span>
                                <span class="stop-meta">${escapeHtml(stop.time || "")}</span>
                            </span>
                        </button>
                        <ul class="activities">${activityRows}</ul>
                        ${note}
                    </article>`;
                itineraryEl.appendChild(item);
            });

            const fallback = L.polyline(coords, {
                color: day.color,
                weight: 4,
                opacity: 0.82,
                dashArray: "8, 8"
            }).addTo(map);
            routeLines.push(fallback);
            map.fitBounds(fallback.getBounds().pad(0.18));
            await loadRoute(day, coords, dayIndex, fallback);
        }

        async function loadRoute(day, coords, expectedDay, fallback) {
            const groups = splitLegs(day, coords);
            const profile = day.mode === "foot" ? "foot" : "driving";
            const waiting = day.mode === "foot" ? "正在规划步行路线…" : "正在规划当日路线…";
            routeStatEl.textContent = waiting;

            let driveKm = 0;
            let driveMin = 0;
            let hasFlight = false;
            let routed = false;

            for (const group of groups) {
                if (group.type === "flight") {
                    hasFlight = true;
                    const line = L.polyline(group.points, {
                        color: day.color,
                        weight: 3,
                        opacity: 0.75,
                        dashArray: "8, 8"
                    }).addTo(map);
                    routeLines.push(line);
                    continue;
                }
                const path = group.points.map(([lat, lng]) => `${lng},${lat}`).join(";");
                const url = `https://router.project-osrm.org/route/v1/${profile}/${path}?overview=full&geometries=geojson`;
                try {
                    const response = await fetch(url);
                    if (!response.ok) throw new Error("route request failed");
                    const data = await response.json();
                    if (activeDay !== expectedDay) return;
                    const route = data.routes && data.routes[0];
                    if (!route) throw new Error("no route returned");
                    const line = L.polyline(
                        route.geometry.coordinates.map(([lng, lat]) => [lat, lng]),
                        { color: day.color, weight: 4, opacity: 0.85 }
                    ).addTo(map);
                    routeLines.push(line);
                    driveKm += route.distance / 1000;
                    driveMin += route.duration / 60;
                    routed = true;
                } catch (error) {
                    const line = L.polyline(group.points, {
                        color: day.color,
                        weight: 4,
                        opacity: 0.82,
                        dashArray: "8, 8"
                    }).addTo(map);
                    routeLines.push(line);
                }
            }

            if (activeDay !== expectedDay) return;
            if (fallback) {
                fallback.remove();
                routeLines = routeLines.filter((line) => line !== fallback);
            }

            const parts = [];
            if (hasFlight) parts.push(day.flightStat || "航班示意线");
            if (routed) {
                const km = profile === "foot" ? driveKm.toFixed(1) : Math.round(driveKm);
                const minutes = Math.round(driveMin);
                const time = minutes >= 60
                    ? `${Math.floor(minutes / 60)} 小时 ${minutes % 60} 分`
                    : `${minutes} 分`;
                const label = profile === "foot" ? "步行" : "自驾";
                parts.push(`${label}约 ${km} km · ${time}`);
            } else if (!hasFlight) {
                parts.push(profile === "foot" ? "步行路线暂不可用，显示直线示意" : "路线暂不可用，显示直线示意");
            }
            routeStatEl.textContent = parts.join(" · ");

            const bounds = routeLines.reduce((acc, line) => acc.extend(line.getBounds()), routeLines[0].getBounds());
            map.fitBounds(bounds.pad(0.15));
        }

        function escapeHtml(value) {
            return String(value)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;");
        }

        renderDay(0);
    </script>
</body>
</html>
