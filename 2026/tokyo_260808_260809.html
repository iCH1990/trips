<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <title>日本 Tokyo 2026/08/08–2026/08/09</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        :root {
            --ink: #1a2744;
            --muted: #5a6a7a;
            --line: #dce5ec;
            --accent: #c23b3b;
            --accent-soft: #fdeaea;
            --warm: #b45f24;
            --warm-soft: #fff0df;
            --stay: #6b4ea0;
            --stay-soft: #f0eafa;
            --bg: #f4f7f9;
            --shadow: 0 1px 2px rgba(15, 35, 55, 0.05);
            --shadow-lift: 0 10px 28px rgba(15, 35, 55, 0.1);
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            background: var(--bg);
            color: var(--ink);
            font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
        }
        button { font: inherit; }
        .page { max-width: 1140px; margin: 0 auto; padding: 40px 24px 72px; }
        .card {
            border: 1px solid var(--line);
            border-radius: 16px;
            background: #fff;
            box-shadow: var(--shadow);
        }
        .kicker {
            margin: 0;
            color: var(--accent);
            font-size: 12px;
            font-weight: 650;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }
        h1 { margin: 8px 0 0; color: var(--ink); font-size: 30px; line-height: 1.25; }
        .subtitle { margin: 8px 0 0; color: var(--muted); font-size: 14px; line-height: 1.6; }
        .stats { display: flex; flex-wrap: wrap; gap: 8px; margin: 16px 0 0; }
        .stat {
            padding: 5px 11px;
            border: 1px solid var(--line);
            border-radius: 999px;
            background: #fff;
            color: var(--ink);
            font-size: 12px;
        }
        .overview {
            display: grid;
            grid-template-columns: minmax(0, 1fr) 316px;
            gap: 16px;
            margin: 24px 0 0;
        }
        .map-card { overflow: hidden; }
        #map { width: 100%; height: 100%; min-height: 520px; }
        .side {
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-height: 520px;
            padding: 16px;
        }
        .day-tabs {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(84px, 1fr));
            gap: 6px;
        }
        .day-tab {
            border: 1px solid var(--line);
            border-radius: 10px;
            padding: 8px 4px;
            background: #fff;
            color: var(--muted);
            cursor: pointer;
            font-size: 12px;
            line-height: 1.3;
        }
        .day-tab:hover, .day-tab:focus-visible { border-color: var(--accent); outline: none; }
        .day-tab.is-active { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); font-weight: 700; }
        .day-summary {
            padding: 10px 12px;
            border-left: 3px solid var(--accent);
            border-radius: 6px;
            background: #f5f9fb;
        }
        .day-title { margin: 0; color: var(--ink); font-size: 14px; font-weight: 700; }
        .day-meta { margin: 4px 0 0; color: var(--muted); font-size: 12px; line-height: 1.5; }
        .glance {
            flex: 1;
            overflow: auto;
            margin: 0;
            padding: 0;
            list-style: none;
        }
        .glance-item + .glance-item { border-top: 1px solid var(--line); }
        .stop {
            display: grid;
            grid-template-columns: 26px 1fr;
            gap: 10px;
            align-items: center;
            width: 100%;
            padding: 8px 6px;
            border: 0;
            border-radius: 8px;
            background: transparent;
            color: inherit;
            text-align: left;
            cursor: pointer;
        }
        .stop:hover, .stop:focus-visible, .stop.is-active { background: var(--accent-soft); outline: none; }
        .route-stat {
            margin: 0;
            padding-top: 10px;
            border-top: 1px solid var(--line);
            color: var(--muted);
            font-size: 12px;
            line-height: 1.5;
        }
        .badge, .num-marker {
            display: grid;
            place-items: center;
            border-radius: 50%;
            background: var(--accent);
            color: #fff;
            font-weight: 700;
        }
        .badge { width: 26px; height: 26px; margin-top: 1px; font-size: 12px; }
        .num-marker {
            width: 29px;
            height: 29px;
            border: 2px solid #fff;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.27);
            font-size: 12px;
        }
        .badge.is-stay, .num-marker.is-stay { background: var(--stay); }
        .badge.is-highlight, .num-marker.is-highlight { background: var(--warm); }
        .stop-title { color: var(--ink); font-size: 14px; font-weight: 650; }
        .stop-meta { display: block; margin-top: 2px; color: var(--muted); font-size: 12px; line-height: 1.4; }
        .tag {
            display: inline-block;
            margin-left: 6px;
            padding: 1px 6px;
            border-radius: 999px;
            background: var(--warm-soft);
            color: var(--warm);
            font-size: 10px;
            font-weight: 700;
            vertical-align: 1px;
        }
        .tag--stay { background: var(--stay-soft); color: var(--stay); }
        .detail { margin: 32px 0 0; }
        .detail-head {
            display: flex;
            flex-wrap: wrap;
            align-items: baseline;
            gap: 4px 12px;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--line);
        }
        .detail-head h2 { margin: 0; font-size: 20px; }
        .detail-note { margin: 0; color: var(--muted); font-size: 13px; }
        .timeline { display: grid; gap: 10px; margin: 18px 0 0; padding: 0; list-style: none; }
        .timeline-item { display: grid; gap: 10px; }
        .leg-row {
            display: flex;
            align-items: center;
            gap: 9px;
            padding-left: 18px;
            color: var(--muted);
            font-size: 12px;
        }
        .leg-row::before {
            content: "";
            width: 2px;
            height: 20px;
            border-radius: 2px;
            background: var(--line);
        }
        .stop-card {
            padding: 16px 18px;
            border: 1px solid var(--line);
            border-radius: 16px;
            background: #fff;
            box-shadow: var(--shadow);
            scroll-margin-top: 16px;
            transition: border-color 0.18s ease, box-shadow 0.18s ease;
        }
        .stop-card.is-active { border-color: var(--accent); box-shadow: var(--shadow-lift); }
        .stop-card .stop {
            grid-template-columns: 32px 1fr;
            gap: 12px;
            align-items: start;
            padding: 0;
        }
        .stop-card .stop:hover, .stop-card .stop:focus-visible, .stop-card .stop.is-active { background: transparent; }
        .stop-card .badge { width: 32px; height: 32px; margin-top: 0; font-size: 14px; }
        .stop-card .stop-title { font-size: 17px; font-weight: 700; }
        .stop-card .stop-meta { margin-top: 4px; font-size: 13px; }
        .activities {
            display: grid;
            gap: 8px;
            margin: 12px 0 0;
            padding: 12px 0 0;
            border-top: 1px dashed var(--line);
            list-style: none;
        }
        .activity {
            display: grid;
            grid-template-columns: 96px 1fr;
            gap: 12px;
            font-size: 13.5px;
            line-height: 1.6;
        }
        .activity-time { color: var(--accent); font-weight: 650; font-variant-numeric: tabular-nums; }
        .activity-text { color: var(--ink); }
        .note {
            display: block;
            margin-top: 10px;
            padding: 8px 10px;
            border-radius: 8px;
            background: var(--warm-soft);
            color: var(--warm);
            font-size: 12.5px;
            line-height: 1.5;
        }
        .hint { margin: 28px 0 0; color: #6c7d8e; font-size: 12px; line-height: 1.6; }
        .popup-title { margin: 0 0 4px; color: var(--ink); font-size: 14px; font-weight: 700; }
        .popup-meta { margin: 0; color: var(--muted); font-size: 12px; }
        .activities--popup { gap: 5px; margin-top: 8px; font-size: 12px; }
        .activities--popup .activity { grid-template-columns: 72px 1fr; gap: 8px; font-size: 12px; }
        .leaflet-popup-content { margin: 10px 13px; min-width: 235px; }
        @media (max-width: 880px) {
            .overview { grid-template-columns: minmax(0, 1fr); }
            #map { min-height: 380px; }
            .side { max-height: none; }
            .glance { overflow: visible; }
        }
        @media (max-width: 560px) {
            .page { padding: 28px 16px 56px; }
            h1 { font-size: 23px; }
            .stop-card { padding: 14px 15px; }
            .stop-card .stop-title { font-size: 16px; }
            .activity { grid-template-columns: 72px 1fr; gap: 8px; font-size: 13px; }
        }
    </style>
</head>
<body>
    <div class="page">
        <header class="trip-head">
            <p class="kicker">Japan · 2026</p>
            <h1>日本 Tokyo 2026/08/08–2026/08/09</h1>
            <p class="subtitle">🇯🇵 · 两天 · 步行 + 地铁</p>
            <div class="stats">
                <span class="stat">2 天 · 住 Shibuya</span>
                <span class="stat">Omotesando · Ginza · Ueno · Akihabara</span>
            </div>
        </header>
        <section class="overview" aria-label="行程总览">
            <div class="card map-card">
                <div id="map" role="application" aria-label="Tokyo 行程地图"></div>
            </div>
            <div class="card side">
                <nav class="day-tabs" id="dayTabs" aria-label="选择日期"></nav>
                <div class="day-summary" id="daySummary"></div>
                <ol class="glance" id="glance"></ol>
                <p class="route-stat" id="routeStat">正在规划当日路线…</p>
            </div>
        </section>
        <section class="detail" aria-label="当日详细安排">
            <div class="detail-head">
                <h2 id="detailTitle"></h2>
                <p class="detail-note" id="detailNote"></p>
            </div>
            <ol class="timeline" id="itinerary"></ol>
        </section>
        <p class="hint">实线为步行（OSRM）。虚线为地铁或打车示意。Tokyo National Museum 周日通常 17:00 闭馆、16:30 停止入场，浮世绘体验需提前确认场次。Yakitori Tsukada 建议预约。</p>
    </div>

    <script>
        const days = [
            {
                date: "8/8",
                weekday: "周六",
                title: "Shibuya 出发：Omotesando 逛街，Ginza，晚上回 Shibuya",
                meta: "步行 Omotesando → 地铁 Ginza → 地铁回 Shibuya 吃牛排、逛 MEGA Don Quijote",
                color: "#c23b3b",
                zoom: 14,
                stops: [
                    {
                        name: "Shibuya Hotel",
                        time: "10:00 出发",
                        kind: "stay",
                        lat: 35.65838, lng: 139.70222,
                        activities: [
                            { time: "10:00", text: "从 Shibuya 步行出发，往 Omotesando 走" }
                        ],
                        note: "标在 Shibuya Scramble Square 附近，店名未写"
                    },
                    {
                        name: "Omotesando Hills",
                        time: "10:25–11:20",
                        drive: "步行约 20 分",
                        kind: "highlight",
                        lat: 35.66721, lng: 139.70890,
                        activities: [
                            { time: "10:25–11:20", text: "从 Omotesando Hills 开始沿 Omotesando 逛" }
                        ],
                        note: "Jingumae 4-12-10"
                    },
                    {
                        name: "BEAMS / Cat Street",
                        time: "11:20–12:30",
                        drive: "沿 Omotesando 走到 Cat Street",
                        kind: "highlight",
                        lat: 35.66855, lng: 139.70580,
                        activities: [
                            { time: "11:20–12:30", text: "BEAMS 及附近潮牌，从 Hills 一路逛过来" }
                        ],
                        note: "BEAMS Harajuku · Jingumae 3-24-7 一带"
                    },
                    {
                        name: "Red Rock Harajuku",
                        time: "12:40–13:45",
                        drive: "步行约 5 分",
                        kind: "highlight",
                        lat: 35.66840, lng: 139.70670,
                        activities: [
                            { time: "12:40–13:45", text: "在 Omotesando 吃 Red Rock，烤牛肉丼" }
                        ],
                        note: "Jingumae 3-25-12 Fuji Building B1 · 11:30 开"
                    },
                    {
                        name: "Ginza",
                        time: "14:10–17:30",
                        drive: "地铁约 20 分",
                        leg: "metro",
                        kind: "highlight",
                        lat: 35.66953, lng: 139.76405,
                        activities: [
                            { time: "14:10–17:30", text: "GINZA SIX 与 Chuo-dori 逛街" }
                        ],
                        note: "Omotesando / Meiji-jingumae → Ginza"
                    },
                    {
                        name: "Steak Lodge Shibuya Dogenzaka",
                        time: "18:00–19:30",
                        drive: "地铁约 20 分回 Shibuya",
                        leg: "metro",
                        kind: "highlight",
                        lat: 35.65835, lng: 139.69850,
                        activities: [
                            { time: "18:00–19:30", text: "回 Shibuya 吃 Steak Lodge" }
                        ],
                        note: "Dogenzaka 2-6-3 · 不接受订座"
                    },
                    {
                        name: "MEGA Don Quijote Shibuya",
                        time: "19:45–20:45",
                        drive: "步行约 8 分",
                        lat: 35.66051, lng: 139.69788,
                        activities: [
                            { time: "19:45–20:45", text: "MEGA 买东西" }
                        ],
                        note: "Udagawacho 28-6 · 24 小时"
                    },
                    {
                        name: "Shibuya Hotel",
                        time: "21:00 休息",
                        kind: "stay",
                        lat: 35.65838, lng: 139.70222,
                        activities: [
                            { time: "21:00", text: "回酒店休息" }
                        ]
                    }
                ]
            },
            {
                date: "8/9",
                weekday: "周日",
                title: "Ueno 节庆与博物馆，Akihabara，晚上烧鸟",
                meta: "酒店早餐后去 Ueno · 下午博物馆 · 打车 Akihabara · 地铁回 Shibuya 吃烧鸟",
                color: "#2b6cb0",
                zoom: 13,
                stops: [
                    {
                        name: "Shibuya Hotel",
                        time: "08:00–08:45 早餐",
                        kind: "stay",
                        lat: 35.65838, lng: 139.70222,
                        activities: [
                            { time: "08:00–08:45", text: "酒店吃早餐后出发" }
                        ]
                    },
                    {
                        name: "Ueno Park Fountain Plaza",
                        time: "09:50–12:30",
                        drive: "Yamanote Line 约 30 分",
                        leg: "metro",
                        kind: "highlight",
                        lat: 35.71083, lng: 139.77444,
                        activities: [
                            { time: "09:50–12:30", text: "逛 Ueno Park，看 Pakistan Japan Friendship Festival 2026" }
                        ],
                        note: "Takenodai / Fountain Plaza · 8/6–8/9 约 10:00–19:00"
                    },
                    {
                        name: "Tokyo National Museum",
                        time: "13:00–16:30",
                        drive: "公园内步行约 10 分",
                        kind: "highlight",
                        lat: 35.71904, lng: 139.77597,
                        activities: [
                            { time: "13:00–15:00", text: "先逛一圈 Honkan 与 Toyokan" },
                            { time: "15:00–16:30", text: "馆内打卡集章，并做浮世绘体验" }
                        ],
                        note: "周日多 17:00 闭馆、16:30 停入场；体验场次出发前确认"
                    },
                    {
                        name: "Akihabara Radio Kaikan",
                        time: "17:00–18:30",
                        drive: "打车约 15 分",
                        leg: "taxi",
                        kind: "highlight",
                        lat: 35.69788, lng: 139.77195,
                        activities: [
                            { time: "17:00–18:30", text: "逛手办、模型店" }
                        ],
                        note: "Soto-Kanda 1-15-16 一带"
                    },
                    {
                        name: "Cafe near Akihabara",
                        time: "18:30–19:15",
                        drive: "步行",
                        lat: 35.69840, lng: 139.77380,
                        activities: [
                            { time: "18:30–19:15", text: "手办逛完，在附近喝咖啡歇脚" }
                        ]
                    },
                    {
                        name: "Yakitori Tsukada Shibuya",
                        time: "20:15–22:00",
                        drive: "地铁约 25 分回 Shibuya",
                        leg: "metro",
                        kind: "highlight",
                        lat: 35.65770, lng: 139.69920,
                        activities: [
                            { time: "20:15–22:00", text: "Yakitori Omakase / course" }
                        ],
                        note: "Dogenzaka 1-6-8 Kusumoto No. 2 Building 2F · 土日 16:00 开，建议预约"
                    },
                    {
                        name: "Shibuya Hotel",
                        time: "22:20 休息",
                        kind: "stay",
                        lat: 35.65838, lng: 139.70222,
                        activities: [
                            { time: "22:20", text: "结束，回酒店休息" }
                        ]
                    }
                ]
            }
        ];

        const map = L.map("map", { zoomControl: true }).setView([35.68, 139.74], 13);
        L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
            maxZoom: 19,
            attribution: "&copy; OpenStreetMap contributors"
        }).addTo(map);

        const tabsEl = document.getElementById("dayTabs");
        const summaryEl = document.getElementById("daySummary");
        const glanceEl = document.getElementById("glance");
        const itineraryEl = document.getElementById("itinerary");
        const detailTitleEl = document.getElementById("detailTitle");
        const detailNoteEl = document.getElementById("detailNote");
        const routeStatEl = document.getElementById("routeStat");
        let routeLines = [];
        let markers = [];
        let activeDay = 0;

        days.forEach((day, index) => {
            const button = document.createElement("button");
            button.type = "button";
            button.className = "day-tab";
            button.innerHTML = `${escapeHtml(day.date)}<br>${escapeHtml(day.weekday)}`;
            button.addEventListener("click", () => renderDay(index));
            tabsEl.appendChild(button);
        });

        function highlightStop(index) {
            document.querySelectorAll(".stop").forEach((el) => {
                el.classList.toggle("is-active", Number(el.dataset.index) === index);
            });
            document.querySelectorAll(".stop-card").forEach((card, i) => {
                card.classList.toggle("is-active", i === index);
            });
        }

        function focusStop(index, { scroll = false } = {}) {
            highlightStop(index);
            const zoom = days[activeDay].zoom || 14;
            map.flyTo(markers[index].getLatLng(), zoom, { duration: 0.7 });
            markers[index].openPopup();
            if (scroll) {
                itineraryEl.children[index].scrollIntoView({ behavior: "smooth", block: "center" });
            }
        }

        [glanceEl, itineraryEl].forEach((container) => {
            container.addEventListener("click", (event) => {
                const button = event.target.closest(".stop");
                if (!button) return;
                focusStop(Number(button.dataset.index), { scroll: container === glanceEl });
            });
        });

        function stopLeg(stop) {
            return stop.leg || "walk";
        }

        function splitLegs(day, coords) {
            const groups = [];
            let current = { type: "walk", points: [coords[0]] };
            for (let i = 1; i < day.stops.length; i++) {
                const type = stopLeg(day.stops[i]);
                if (type === current.type) {
                    current.points.push(coords[i]);
                } else {
                    groups.push(current);
                    current = { type, points: [coords[i - 1], coords[i]] };
                }
            }
            groups.push(current);
            return groups.filter((group) => group.points.length > 1);
        }

        async function renderDay(dayIndex) {
            activeDay = dayIndex;
            const day = days[dayIndex];
            document.querySelectorAll(".day-tab").forEach((tab, index) => {
                tab.classList.toggle("is-active", index === dayIndex);
            });
            summaryEl.innerHTML = `
                <p class="day-title">${escapeHtml(day.date)} ${escapeHtml(day.weekday)}</p>
                <p class="day-meta">${escapeHtml(day.title)}</p>`;
            detailTitleEl.textContent = [`${day.date} ${day.weekday}`, day.title].filter(Boolean).join(" · ");
            detailNoteEl.textContent = [`${day.stops.length} 个地点`, day.meta].filter(Boolean).join(" · ");
            glanceEl.innerHTML = "";
            itineraryEl.innerHTML = "";
            markers.forEach((marker) => marker.remove());
            markers = [];
            routeLines.forEach((line) => line.remove());
            routeLines = [];

            const coords = day.stops.map((stop) => [stop.lat, stop.lng]);

            day.stops.forEach((stop, index) => {
                const number = index + 1;
                const kindClass = stop.kind ? ` is-${stop.kind}` : "";
                const label = stop.kind === "stay"
                    ? '<span class="tag tag--stay">住宿</span>'
                    : stop.kind === "highlight"
                        ? '<span class="tag">重点</span>'
                        : "";
                const activityRows = stop.activities.map((activity) => `
                    <li class="activity">
                        <span class="activity-time">${escapeHtml(activity.time)}</span>
                        <span class="activity-text">${escapeHtml(activity.text)}</span>
                    </li>`).join("");
                const meta = [stop.drive, stop.time].filter(Boolean).join(" · ");
                const note = stop.note ? `<span class="note">${escapeHtml(stop.note)}</span>` : "";

                const marker = L.marker([stop.lat, stop.lng], {
                    icon: L.divIcon({
                        className: "",
                        html: `<div class="num-marker${kindClass}" style="background:${kindClass ? "" : day.color}">${number}</div>`,
                        iconSize: [29, 29],
                        iconAnchor: [14, 14],
                        popupAnchor: [0, -16]
                    })
                }).addTo(map);
                marker.bindPopup(`
                    <p class="popup-title">${number}. ${escapeHtml(stop.name)}${label}</p>
                    <p class="popup-meta">${escapeHtml(meta)}</p>
                    ${note}
                    <ul class="activities activities--popup">${activityRows}</ul>`);
                marker.on("click", () => highlightStop(index));
                markers.push(marker);

                const badgeStyle = kindClass ? "" : ` style="background:${day.color}"`;
                const glanceItem = document.createElement("li");
                glanceItem.className = "glance-item";
                glanceItem.innerHTML = `
                    <button class="stop" type="button" data-index="${index}">
                        <span class="badge${kindClass}"${badgeStyle}>${number}</span>
                        <span>
                            <span class="stop-title">${escapeHtml(stop.name)}${label}</span>
                            <span class="stop-meta">${escapeHtml(stop.time || "")}</span>
                        </span>
                    </button>`;
                glanceEl.appendChild(glanceItem);

                const item = document.createElement("li");
                item.className = "timeline-item";
                item.innerHTML = `
                    ${stop.drive ? `<p class="leg-row">${escapeHtml(stop.drive)}</p>` : ""}
                    <article class="stop-card">
                        <button class="stop" type="button" data-index="${index}">
                            <span class="badge${kindClass}"${badgeStyle}>${number}</span>
                            <span>
                                <span class="stop-title">${escapeHtml(stop.name)}${label}</span>
                                <span class="stop-meta">${escapeHtml(stop.time || "")}</span>
                            </span>
                        </button>
                        <ul class="activities">${activityRows}</ul>
                        ${note}
                    </article>`;
                itineraryEl.appendChild(item);
            });

            const fallback = L.polyline(coords, {
                color: day.color,
                weight: 4,
                opacity: 0.82,
                dashArray: "8, 8"
            }).addTo(map);
            routeLines.push(fallback);
            map.fitBounds(fallback.getBounds().pad(0.18));
            await loadRoute(day, coords, dayIndex, fallback);
        }

        async function loadRoute(day, coords, expectedDay, fallback) {
            routeStatEl.textContent = "正在规划当日路线…";
            const groups = splitLegs(day, coords);
            let walkKm = 0;
            let walkMin = 0;
            let walked = false;
            let transit = false;

            for (const group of groups) {
                if (group.type === "metro" || group.type === "taxi") {
                    transit = true;
                    const line = L.polyline(group.points, {
                        color: day.color,
                        weight: 3,
                        opacity: 0.75,
                        dashArray: "8, 8"
                    }).addTo(map);
                    routeLines.push(line);
                    continue;
                }
                const path = group.points.map(([lat, lng]) => `${lng},${lat}`).join(";");
                const url = `https://router.project-osrm.org/route/v1/foot/${path}?overview=full&geometries=geojson`;
                try {
                    const response = await fetch(url);
                    if (!response.ok) throw new Error("route request failed");
                    const data = await response.json();
                    if (activeDay !== expectedDay) return;
                    const route = data.routes && data.routes[0];
                    if (!route) throw new Error("no route returned");
                    const line = L.polyline(
                        route.geometry.coordinates.map(([lng, lat]) => [lat, lng]),
                        { color: day.color, weight: 4, opacity: 0.85 }
                    ).addTo(map);
                    routeLines.push(line);
                    walkKm += route.distance / 1000;
                    walkMin += route.duration / 60;
                    walked = true;
                } catch (error) {
                    const line = L.polyline(group.points, {
                        color: day.color,
                        weight: 4,
                        opacity: 0.82,
                        dashArray: "8, 8"
                    }).addTo(map);
                    routeLines.push(line);
                }
            }

            if (activeDay !== expectedDay) return;
            if (fallback) {
                fallback.remove();
                routeLines = routeLines.filter((line) => line !== fallback);
            }

            const parts = [];
            if (walked) {
                const minutes = Math.round(walkMin);
                const time = minutes >= 60
                    ? `${Math.floor(minutes / 60)} 小时 ${minutes % 60} 分`
                    : `${minutes} 分`;
                parts.push(`步行约 ${walkKm.toFixed(1)} km · ${time}`);
            }
            if (transit) parts.push("地铁 / 打车为示意线");
            if (!parts.length) parts.push("路线暂不可用，显示直线示意");
            routeStatEl.textContent = parts.join(" · ");

            const bounds = routeLines.reduce((acc, line) => acc.extend(line.getBounds()), routeLines[0].getBounds());
            map.fitBounds(bounds.pad(0.15));
        }

        function escapeHtml(value) {
            return String(value)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;");
        }

        renderDay(0);
    </script>
</body>
</html>
