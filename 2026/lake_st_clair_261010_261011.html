<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <title>澳大利亚 Lake St Clair 2026/10/10–2026/10/11</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        :root {
            --ink: #1a365d;
            --muted: #4a5568;
            --line: #e2e8f0;
            --accent: #2b6cb0;
            --accent-soft: #ebf5ff;
            --warm: #c05621;
            --warm-soft: #feebc8;
            --stay: #6b4ea0;
            --stay-soft: #f0eafa;
            --bg: #f7fafc;
            --shadow: 0 1px 2px rgba(15, 35, 55, 0.05);
            --shadow-lift: 0 10px 28px rgba(15, 35, 55, 0.1);
        }
        * { box-sizing: border-box; }
        html, body { height: 100%; }
        body {
            margin: 0;
            overflow: hidden;
            background: var(--bg);
            color: var(--ink);
            font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
        }
        button { font: inherit; }
        .page {
            display: flex;
            flex-direction: column;
            height: 100%;
            max-width: 1140px;
            margin: 0 auto;
            padding: 20px 24px 16px;
            overflow: hidden;
        }
        .site-nav { flex: none; margin: 0 0 12px; }
        .trip-head { flex: none; }
        .back-home {
            display: inline-flex;
            align-items: center;
            color: var(--accent);
            font-size: 13px;
            font-weight: 650;
            text-decoration: none;
        }
        .back-home:hover, .back-home:focus-visible { text-decoration: underline; outline: none; }
        .card {
            border: 1px solid var(--line);
            border-radius: 16px;
            background: #fff;
            box-shadow: var(--shadow);
        }
        .kicker {
            margin: 0;
            color: var(--accent);
            font-size: 12px;
            font-weight: 650;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }
        h1 { margin: 8px 0 0; color: var(--ink); font-size: 30px; line-height: 1.25; }
        .subtitle { margin: 8px 0 0; color: var(--muted); font-size: 14px; line-height: 1.6; }
        .stats { display: flex; flex-wrap: wrap; gap: 8px; margin: 16px 0 0; }
        .stat {
            padding: 5px 11px;
            border: 1px solid var(--line);
            border-radius: 999px;
            background: #fff;
            color: var(--ink);
            font-size: 12px;
        }
        .overview {
            display: grid;
            grid-template-columns: minmax(0, 1fr) 316px;
            gap: 16px;
            flex: none;
            margin: 16px 0 0;
        }
        .map-card { overflow: hidden; }
        #map { width: 100%; height: min(380px, 36vh); min-height: 260px; }
        .side {
            display: flex;
            flex-direction: column;
            gap: 12px;
            height: min(380px, 36vh);
            min-height: 260px;
            padding: 16px;
        }
        .overview:has(.day-scroller) { grid-template-columns: minmax(0, 1fr) 400px; }
        .overview:has(.day-scroller) #map,
        .overview:has(.day-scroller) .side {
            height: min(340px, 32vh);
            min-height: 240px;
        }
        .day-scroller {
            display: flex;
            align-items: center;
            gap: 4px;
            flex: none;
        }
        .day-scroller:not(:has(.day-tab)) { display: none; }
        .day-tabs {
            display: flex;
            flex: 1;
            gap: 6px;
            min-width: 0;
            overflow-x: auto;
            overscroll-behavior-x: contain;
            scrollbar-width: none;
        }
        .day-tabs::-webkit-scrollbar { display: none; }
        .day-tabs:empty { display: none; }
        .day-arrow {
            display: grid;
            flex: none;
            place-items: center;
            width: 26px;
            height: 26px;
            padding: 0;
            border: 1px solid var(--line);
            border-radius: 50%;
            background: #fff;
            color: var(--accent);
            cursor: pointer;
        }
        .day-arrow svg { width: 12px; height: 12px; }
        .day-arrow:hover, .day-arrow:focus-visible { border-color: var(--accent); background: var(--accent-soft); outline: none; }
        .day-arrow:disabled { opacity: 0.35; cursor: default; }
        .day-arrow[hidden] { display: none; }
        .day-tab {
            flex: 0 0 auto;
            min-width: 68px;
            border: 1px solid var(--line);
            border-radius: 10px;
            padding: 6px 8px;
            background: #fff;
            color: var(--muted);
            cursor: pointer;
            font-size: 12px;
            line-height: 1.3;
        }
        .day-tab:hover, .day-tab:focus-visible { border-color: var(--accent); outline: none; }
        .day-tab.is-active { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); font-weight: 700; }
        .day-summary:empty { display: none; }
        .day-summary { padding: 0 2px; }
        .day-title { margin: 0; color: var(--muted); font-size: 12px; font-weight: 650; line-height: 1.45; }
        .day-meta { margin: 2px 0 0; color: var(--muted); font-size: 12px; line-height: 1.45; }
        .glance {
            flex: 1;
            overflow: auto;
            margin: 0;
            padding: 0;
            list-style: none;
        }
        .glance-item + .glance-item { border-top: 1px solid var(--line); }
        .stop {
            display: grid;
            grid-template-columns: 26px 1fr;
            gap: 10px;
            align-items: center;
            width: 100%;
            padding: 8px 6px;
            border: 0;
            border-radius: 8px;
            background: transparent;
            color: inherit;
            text-align: left;
            cursor: pointer;
        }
        .stop:hover, .stop:focus-visible, .stop.is-active { background: var(--accent-soft); outline: none; }
        .route-stat {
            margin: 0;
            padding-top: 10px;
            border-top: 1px solid var(--line);
            color: var(--muted);
            font-size: 12px;
            line-height: 1.5;
        }
        .badge, .num-marker {
            display: grid;
            place-items: center;
            border-radius: 50%;
            background: var(--accent);
            color: #fff;
            font-weight: 700;
        }
        .badge { width: 26px; height: 26px; margin-top: 1px; font-size: 12px; }
        .num-marker {
            width: 29px;
            height: 29px;
            border: 2px solid #fff;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.27);
            font-size: 12px;
        }
        .badge.is-stay, .num-marker.is-stay { background: var(--stay); }
        .badge.is-highlight, .num-marker.is-highlight { background: var(--warm); }
        .stop-title { color: var(--ink); font-size: 14px; font-weight: 650; }
        .stop-meta { display: block; margin-top: 2px; color: var(--muted); font-size: 12px; line-height: 1.4; }
        .tag {
            display: inline-block;
            margin-left: 6px;
            padding: 1px 6px;
            border-radius: 999px;
            background: var(--warm-soft);
            color: var(--warm);
            font-size: 10px;
            font-weight: 700;
            vertical-align: 1px;
        }
        .tag--stay { background: var(--stay-soft); color: var(--stay); }
        .detail {
            display: flex;
            flex-direction: column;
            flex: 1 1 auto;
            min-height: 0;
            margin: 16px 0 0;
            padding: 14px 16px 8px;
            border: 1px solid var(--line);
            border-radius: 16px;
            background: #fff;
            box-shadow: var(--shadow);
            overflow: hidden;
        }
        .detail-head {
            display: flex;
            flex: none;
            align-items: center;
            gap: 8px;
            padding-bottom: 0;
        }
        .detail-heading {
            display: flex;
            flex: 1 1 auto;
            flex-wrap: wrap;
            align-items: baseline;
            gap: 2px 8px;
            min-width: 0;
        }
        .detail-head h2 { margin: 0; color: var(--muted); font-size: 12px; font-weight: 650; line-height: 1.45; }
        .detail-head h2:empty, .detail-note:empty { display: none; }
        .detail-note { margin: 0; color: var(--muted); font-size: 12px; line-height: 1.45; }
        .detail-expand {
            flex: none;
            margin-top: 1px;
            padding: 5px 12px;
            border: 1px solid var(--line);
            border-radius: 999px;
            background: #fff;
            color: var(--accent);
            font-size: 12px;
            font-weight: 650;
            line-height: 1.3;
            cursor: pointer;
        }
        .detail-expand:hover, .detail-expand:focus-visible {
            border-color: var(--accent);
            background: var(--accent-soft);
            outline: none;
        }
        .detail-scroll {
            flex: 1 1 auto;
            min-height: 0;
            margin-top: 8px;
            overflow: auto;
            overscroll-behavior: contain;
        }
        .timeline {
            display: grid;
            gap: 10px;
            margin: 0;
            padding: 0 6px 4px 0;
            list-style: none;
        }
        .timeline-item { display: grid; gap: 10px; }
        .leg-row {
            display: flex;
            align-items: center;
            gap: 9px;
            padding-left: 18px;
            color: var(--muted);
            font-size: 12px;
        }
        .leg-row::before {
            content: "";
            width: 2px;
            height: 20px;
            border-radius: 2px;
            background: var(--line);
        }
        .stop-card {
            padding: 16px 18px;
            border: 1px solid var(--line);
            border-radius: 16px;
            background: #fff;
            box-shadow: var(--shadow);
            scroll-margin-top: 16px;
            transition: border-color 0.18s ease, box-shadow 0.18s ease;
        }
        .stop-card.is-active { border-color: var(--accent); box-shadow: var(--shadow-lift); }
        .stop-card .stop {
            grid-template-columns: 32px 1fr;
            gap: 12px;
            align-items: start;
            padding: 0;
        }
        .stop-card .stop:hover, .stop-card .stop:focus-visible, .stop-card .stop.is-active { background: transparent; }
        .stop-card .badge { width: 32px; height: 32px; margin-top: 0; font-size: 14px; }
        .stop-card .stop-title { font-size: 17px; font-weight: 700; }
        .stop-card .stop-meta { margin-top: 4px; font-size: 13px; }
        .activities {
            display: grid;
            gap: 8px;
            margin: 12px 0 0;
            padding: 12px 0 0;
            border-top: 1px dashed var(--line);
            list-style: none;
        }
        .activity {
            display: grid;
            grid-template-columns: 96px 1fr;
            gap: 12px;
            font-size: 13.5px;
            line-height: 1.6;
        }
        .activity-time { color: var(--accent); font-weight: 650; font-variant-numeric: tabular-nums; }
        .activity-text { color: var(--ink); }
        .note {
            display: block;
            margin-top: 10px;
            padding: 8px 10px;
            border-radius: 8px;
            background: var(--warm-soft);
            color: var(--warm);
            font-size: 12.5px;
            line-height: 1.5;
        }
        .hint {
            margin: 12px 2px 4px 0;
            padding-top: 10px;
            border-top: 1px solid var(--line);
            color: var(--muted);
            font-size: 12px;
            line-height: 1.5;
        }
        .popup-title { margin: 0 0 4px; color: var(--ink); font-size: 14px; font-weight: 700; }
        .popup-meta { margin: 0; color: var(--muted); font-size: 12px; }
        .activities--popup { gap: 5px; margin-top: 8px; font-size: 12px; }
        .activities--popup .activity { grid-template-columns: 72px 1fr; gap: 8px; font-size: 12px; }
        .leaflet-popup-content { margin: 10px 13px; min-width: 235px; }
        @media (max-width: 880px) {
            .page { padding: 12px 12px 10px; }
            h1 { margin-top: 4px; font-size: 22px; }
            .subtitle { margin-top: 4px; }
            .stats { flex-wrap: nowrap; margin-top: 8px; overflow-x: auto; }
            .stat { flex: none; }
            .overview,
            .overview:has(.day-scroller) { grid-template-columns: minmax(0, 1fr); gap: 8px; margin-top: 10px; }
            #map,
            .overview:has(.day-scroller) #map { height: 180px; min-height: 180px; }
            .side,
            .overview:has(.day-scroller) .side { height: auto; min-height: 0; max-height: none; gap: 8px; padding: 10px 12px; }
            .glance { display: none; }
            .side:has(.day-tab) { gap: 8px; padding: 8px; }
            .side:has(.day-tab) .route-stat { display: none; }
            .detail { margin-top: 8px; padding: 10px 12px 6px; }
        }
        @media (max-width: 560px) {
            .page { padding: 12px 12px 10px; }
            h1 { font-size: 22px; }
            .stop-card { padding: 14px 15px; }
            .stop-card .stop-title { font-size: 16px; }
            .activity { grid-template-columns: 72px 1fr; gap: 8px; font-size: 13px; }
        }

        html.is-page-scroll,
        html.is-page-scroll body {
            height: auto;
            min-height: 100%;
            overflow: visible;
        }
        html.is-page-scroll .page {
            height: auto;
            overflow: visible;
            padding-bottom: 72px;
        }
        html.is-page-scroll .detail {
            flex: none;
            overflow: visible;
            scroll-margin-top: 12px;
        }
        html.is-page-scroll .detail-scroll,
        html.is-page-scroll .timeline {
            flex: none;
            min-height: auto;
            overflow: visible;
        }
    </style>
</head>
<body>
    <div class="page">
        <nav class="site-nav" aria-label="站点导航">

            }
        ];

        const map = L.map("map", { zoomControl: true }).setView([-33.05, 151.22], 8);
        L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
            maxZoom: 19,
            attribution: "&copy; OpenStreetMap contributors"
        }).addTo(map);

        const tabsEl = document.getElementById("dayTabs");
        const summaryEl = document.getElementById("daySummary");
        const glanceEl = document.getElementById("glance");
        const itineraryEl = document.getElementById("itinerary");
        const detailTitleEl = document.getElementById("detailTitle");
        const detailNoteEl = document.getElementById("detailNote");
        const routeStatEl = document.getElementById("routeStat");
        let routeLine = null;
        let markers = [];
        let activeDay = 0;

        days.forEach((day, index) => {
            const button = document.createElement("button");
            button.type = "button";
            button.className = "day-tab";
            button.innerHTML = `${escapeHtml(day.date)}<br>${escapeHtml(day.weekday)}`;
            button.addEventListener("click", () => renderDay(index));
            tabsEl.appendChild(button);
        });

        function highlightStop(index) {
            document.querySelectorAll(".stop").forEach((el) => {
                el.classList.toggle("is-active", Number(el.dataset.index) === index);
            });
            document.querySelectorAll(".stop-card").forEach((card, i) => {
                card.classList.toggle("is-active", i === index);
            });
        }

        function focusStop(index, { scroll = false } = {}) {
            highlightStop(index);
            map.flyTo(markers[index].getLatLng(), 11, { duration: 0.7 });
            markers[index].openPopup();
            if (scroll) {
                itineraryEl.children[index].scrollIntoView({ behavior: "smooth", block: "center" });
            }
        }

        [glanceEl, itineraryEl].forEach((container) => {
            container.addEventListener("click", (event) => {
                const button = event.target.closest(".stop");
                if (!button) return;
                focusStop(Number(button.dataset.index), { scroll: container === glanceEl });
            });
        });

        async function renderDay(dayIndex) {
            activeDay = dayIndex;
            const day = days[dayIndex];
            document.querySelectorAll(".day-tab").forEach((tab, index) => {
                tab.classList.toggle("is-active", index === dayIndex);
                if (index === dayIndex) {
                    const tabsRect = tabsEl.getBoundingClientRect();
                    const tabRect = tab.getBoundingClientRect();
                    if (tabRect.left < tabsRect.left) {
                        tabsEl.scrollLeft -= tabsRect.left - tabRect.left;
                    } else if (tabRect.right > tabsRect.right) {
                        tabsEl.scrollLeft += tabRect.right - tabsRect.right;
                    }
                }
            });
            summaryEl.innerHTML = "";
            detailTitleEl.textContent = day.title || "";
            detailNoteEl.textContent = "";
            glanceEl.innerHTML = "";
            itineraryEl.innerHTML = "";
            markers.forEach((marker) => marker.remove());
            markers = [];
            if (routeLine) routeLine.remove();

            const coords = day.stops.map((stop) => [stop.lat, stop.lng]);
            routeLine = L.polyline(coords, {
                color: day.color,
                weight: 4,
                opacity: 0.82,
                dashArray: "8, 8"
            }).addTo(map);

            day.stops.forEach((stop, index) => {
                const number = index + 1;
                const kindClass = stop.kind ? ` is-${stop.kind}` : "";
                const label = stop.kind === "stay"
                    ? '<span class="tag tag--stay">住宿</span>'
                    : stop.kind === "highlight"
                        ? '<span class="tag">重点</span>'
                        : "";
                const activityRows = stop.activities.map((activity) => `
                    <li class="activity">
                        <span class="activity-time">${escapeHtml(activity.time)}</span>
                        <span class="activity-text">${escapeHtml(activity.text)}</span>
                    </li>`).join("");
                const meta = [stop.drive, stop.time].filter(Boolean).join(" · ");
                const note = stop.note ? `<span class="note">${escapeHtml(stop.note)}</span>` : "";

                const marker = L.marker([stop.lat, stop.lng], {
                    icon: L.divIcon({
                        className: "",
                        html: `<div class="num-marker${kindClass}" style="background:${kindClass ? "" : day.color}">${number}</div>`,
                        iconSize: [29, 29],
                        iconAnchor: [14, 14],
                        popupAnchor: [0, -16]
                    })
                }).addTo(map);
                marker.bindPopup(`
                    <p class="popup-title">${number}. ${escapeHtml(stop.name)}${label}</p>
                    <p class="popup-meta">${escapeHtml(meta)}</p>
                    ${note}
                    <ul class="activities activities--popup">${activityRows}</ul>`);
                marker.on("click", () => highlightStop(index));
                markers.push(marker);

                const badgeStyle = kindClass ? "" : ` style="background:${day.color}"`;
                const glanceItem = document.createElement("li");
                glanceItem.className = "glance-item";
                glanceItem.innerHTML = `
                    <button class="stop" type="button" data-index="${index}">
                        <span class="badge${kindClass}"${badgeStyle}>${number}</span>
                        <span>
                            <span class="stop-title">${escapeHtml(stop.name)}${label}</span>
                            <span class="stop-meta">${escapeHtml(stop.time || "")}</span>
                        </span>
                    </button>`;
                glanceEl.appendChild(glanceItem);

                const item = document.createElement("li");
                item.className = "timeline-item";
                item.innerHTML = `
                    ${stop.drive ? `<p class="leg-row">${escapeHtml(stop.drive)}</p>` : ""}
                    <article class="stop-card">
                        <button class="stop" type="button" data-index="${index}">
                            <span class="badge${kindClass}"${badgeStyle}>${number}</span>
                            <span>
                                <span class="stop-title">${escapeHtml(stop.name)}${label}</span>
                                <span class="stop-meta">${escapeHtml(stop.time || "")}</span>
                            </span>
                        </button>
                        <ul class="activities">${activityRows}</ul>
                        ${note}
                    </article>`;
                itineraryEl.appendChild(item);
            });

            map.fitBounds(routeLine.getBounds().pad(0.18));
            await loadRoute(day, coords, dayIndex);
        }

        async function loadRoute(day, coords, expectedDay) {
            routeStatEl.textContent = "正在规划当日路线…";
            const path = coords.map(([lat, lng]) => `${lng},${lat}`).join(";");
            const url = `https://router.project-osrm.org/route/v1/driving/${path}?overview=full&geometries=geojson`;
            try {
                const response = await fetch(url);
                if (!response.ok) throw new Error("route request failed");
                const data = await response.json();
                if (activeDay !== expectedDay) return;
                const route = data.routes && data.routes[0];
                if (!route) throw new Error("no route returned");
                routeLine.setLatLngs(route.geometry.coordinates.map(([lng, lat]) => [lat, lng]));
                routeLine.setStyle({ dashArray: null });
                const km = Math.round(route.distance / 1000);
                const minutes = Math.round(route.duration / 60);
                const time = minutes >= 60
                    ? `${Math.floor(minutes / 60)} 小时 ${minutes % 60} 分`
                    : `${minutes} 分`;
                routeStatEl.textContent = `当日 ${km} km · ${time}`;
                map.fitBounds(routeLine.getBounds().pad(0.15));
            } catch (error) {
                if (activeDay === expectedDay) routeStatEl.textContent = "路线暂不可用，显示直线示意";
            }
        }

        function escapeHtml(value) {
            return String(value)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;");
        }

        renderDay(0);
    </script>
    <script>
        (function () {
            const tabs = document.getElementById("dayTabs");
            const arrows = document.querySelectorAll(".day-arrow");
            if (tabs && arrows.length) {
                const updateArrows = function () {
                    const max = tabs.scrollWidth - tabs.clientWidth;
                    const overflow = max > 4;
                    arrows.forEach(function (arrow) {
                        arrow.hidden = !overflow;
                        const dir = Number(arrow.dataset.dir);
                        arrow.disabled = dir < 0 ? tabs.scrollLeft <= 2 : tabs.scrollLeft >= max - 2;
                    });
                };
                arrows.forEach(function (arrow) {
                    arrow.addEventListener("click", function () {
                        const amount = Math.max(tabs.clientWidth * 0.72, 96);
                        tabs.scrollBy({ left: Number(arrow.dataset.dir) * amount, behavior: "smooth" });
                    });
                });
                tabs.addEventListener("scroll", updateArrows, { passive: true });
                window.addEventListener("resize", updateArrows);
                updateArrows();
            }
            const root = document.documentElement;
            const button = document.getElementById("detailExpand");
            const detail = document.querySelector(".detail");
            if (!button || !detail) return;
            button.addEventListener("click", function () {
                const expanded = !root.classList.contains("is-page-scroll");
                root.classList.toggle("is-page-scroll", expanded);
                button.setAttribute("aria-expanded", expanded ? "true" : "false");
                button.textContent = expanded ? "收起" : "展开";
                if (expanded) {
                    requestAnimationFrame(function () {
                        detail.scrollIntoView({ behavior: "smooth", block: "start" });
                    });
                } else {
                    const timeline = document.querySelector(".timeline");
                    if (timeline) timeline.scrollTop = 0;
                    window.scrollTo(0, 0);
                }
                window.dispatchEvent(new Event("resize"));
            });
        })();
    </script>
</body>
</html>
