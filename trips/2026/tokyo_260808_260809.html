<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <title>日本 Tokyo 2026/08/08–2026/08/09</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <link rel="stylesheet" href="../../css/tokens.css">
    <link rel="stylesheet" href="../../css/trip.css">
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="../../js/color.js"></script>
    <script src="../../js/trip-model.js"></script>
    <script src="../../js/trip-render.js"></script>
    <script src="../../js/trip-routing.js"></script>
</head>
<body>
    <div class="page">
        <nav class="site-nav" aria-label="站点导航">
            <a class="back-home" href="../../index.html">← 返回主页</a>
        </nav>
        <header class="trip-head">
            <p class="kicker">Japan · 2026</p>
            <h1>日本 Tokyo 2026/08/08–2026/08/09</h1>
            <p class="subtitle">🇯🇵 · 两天 · 步行 + 地铁</p>
            <div class="stats">
                <span class="stat">2 天 · 住 Shibuya</span>
                <span class="stat">Omotesando · Ginza · Ueno · Akihabara</span>
            </div>
        </header>
        <section class="overview" aria-label="行程总览">
            <div class="card map-card">
                <div id="map" role="application" aria-label="Tokyo 行程地图"></div>
            </div>
            <div class="card side">
                <div class="day-scroller">
                    <button type="button" class="day-arrow" data-dir="-1" aria-label="更早的日期" hidden>
                        <svg viewBox="0 0 12 12" aria-hidden="true"><path d="M7.6 2.2 4 6l3.6 3.8" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
                    </button>
                    <nav class="day-tabs" id="dayTabs" aria-label="选择日期"></nav>
                    <button type="button" class="day-arrow" data-dir="1" aria-label="更晚的日期" hidden>
                        <svg viewBox="0 0 12 12" aria-hidden="true"><path d="M4.4 2.2 8 6l-3.6 3.8" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
                    </button>
                </div>
                <div class="day-summary" id="daySummary"></div>
                <ol class="glance" id="glance"></ol>
                <p class="route-stat" id="routeStat">正在规划当日路线…</p>
            </div>
        </section>
        <section class="detail" aria-label="当日详细安排">
            <div class="detail-head">
                <div class="detail-heading">
                    <h2 id="detailTitle"></h2>
                    <p class="detail-note" id="detailNote"></p>
                </div>
                <button type="button" class="detail-expand" id="detailExpand" aria-expanded="false">展开</button>
            </div>
            <div class="detail-scroll">
                <ol class="timeline" id="itinerary"></ol>
                <p class="hint">实线为步行（OSRM）。虚线为地铁或打车示意。Tokyo National Museum 周日通常 17:00 闭馆、16:30 停止入场，浮世绘体验需提前确认场次。Yakitori Tsukada 建议预约。</p>
            </div>
        </section>
    </div>

    <script>
        const days = TripModel.prepareDays([
            {
                date: "8/8",
                weekday: "周六",
                title: "Shibuya 出发：Omotesando 逛街，Ginza，晚上回 Shibuya",
                meta: "步行 Omotesando → 地铁 Ginza → 地铁回 Shibuya 吃牛排、逛 MEGA Don Quijote",
                color: "var(--route-1)",
                zoom: 14,
                stops: [
                    {
                        name: "Shibuya Hotel",
                        time: "10:00 出发",
                        kind: "stay",
                        lat: 35.65838, lng: 139.70222,
                        activities: [
                            { time: "10:00", text: "从 Shibuya 步行出发，往 Omotesando 走" }
                        ],
                        note: "标在 Shibuya Scramble Square 附近，店名未写"
                    },
                    {
                        name: "Omotesando Hills",
                        time: "10:25–11:20",
                        drive: "步行约 20 分",
                        kind: "highlight",
                        lat: 35.66721, lng: 139.70890,
                        activities: [
                            { time: "10:25–11:20", text: "从 Omotesando Hills 开始沿 Omotesando 逛" }
                        ],
                        note: "Jingumae 4-12-10"
                    },
                    {
                        name: "BEAMS / Cat Street",
                        time: "11:20–12:30",
                        drive: "沿 Omotesando 走到 Cat Street",
                        kind: "highlight",
                        lat: 35.66855, lng: 139.70580,
                        activities: [
                            { time: "11:20–12:30", text: "BEAMS 及附近潮牌，从 Hills 一路逛过来" }
                        ],
                        note: "BEAMS Harajuku · Jingumae 3-24-7 一带"
                    },
                    {
                        name: "Red Rock Harajuku",
                        time: "12:40–13:45",
                        drive: "步行约 5 分",
                        kind: "highlight",
                        lat: 35.66840, lng: 139.70670,
                        activities: [
                            { time: "12:40–13:45", text: "在 Omotesando 吃 Red Rock，烤牛肉丼" }
                        ],
                        note: "Jingumae 3-25-12 Fuji Building B1 · 11:30 开"
                    },
                    {
                        name: "Ginza",
                        time: "14:10–17:30",
                        drive: "地铁约 20 分",
                        leg: "metro",
                        kind: "highlight",
                        lat: 35.66953, lng: 139.76405,
                        activities: [
                            { time: "14:10–17:30", text: "GINZA SIX 与 Chuo-dori 逛街" }
                        ],
                        note: "Omotesando / Meiji-jingumae → Ginza"
                    },
                    {
                        name: "Steak Lodge Shibuya Dogenzaka",
                        time: "18:00–19:30",
                        drive: "地铁约 20 分回 Shibuya",
                        leg: "metro",
                        kind: "highlight",
                        lat: 35.65835, lng: 139.69850,
                        activities: [
                            { time: "18:00–19:30", text: "回 Shibuya 吃 Steak Lodge" }
                        ],
                        note: "Dogenzaka 2-6-3 · 不接受订座"
                    },
                    {
                        name: "MEGA Don Quijote Shibuya",
                        time: "19:45–20:45",
                        drive: "步行约 8 分",
                        lat: 35.66051, lng: 139.69788,
                        activities: [
                            { time: "19:45–20:45", text: "MEGA 买东西" }
                        ],
                        note: "Udagawacho 28-6 · 24 小时"
                    },
                    {
                        name: "Shibuya Hotel",
                        time: "21:00 休息",
                        kind: "stay",
                        lat: 35.65838, lng: 139.70222,
                        activities: [
                            { time: "21:00", text: "回酒店休息" }
                        ]
                    }
                ]
            },
            {
                date: "8/9",
                weekday: "周日",
                title: "Ueno 节庆与博物馆，Akihabara，晚上烧鸟",
                meta: "酒店早餐后去 Ueno · 下午博物馆 · 打车 Akihabara · 地铁回 Shibuya 吃烧鸟",
                color: "var(--route-2)",
                zoom: 13,
                stops: [
                    {
                        name: "Shibuya Hotel",
                        time: "08:00–08:45 早餐",
                        kind: "stay",
                        lat: 35.65838, lng: 139.70222,
                        activities: [
                            { time: "08:00–08:45", text: "酒店吃早餐后出发" }
                        ]
                    },
                    {
                        name: "Ueno Park Fountain Plaza",
                        time: "09:50–12:30",
                        drive: "Yamanote Line 约 30 分",
                        leg: "metro",
                        kind: "highlight",
                        lat: 35.71083, lng: 139.77444,
                        activities: [
                            { time: "09:50–12:30", text: "逛 Ueno Park，看 Pakistan Japan Friendship Festival 2026" }
                        ],
                        note: "Takenodai / Fountain Plaza · 8/6–8/9 约 10:00–19:00"
                    },
                    {
                        name: "Tokyo National Museum",
                        time: "13:00–16:30",
                        drive: "公园内步行约 10 分",
                        kind: "highlight",
                        lat: 35.71904, lng: 139.77597,
                        activities: [
                            { time: "13:00–15:00", text: "先逛一圈 Honkan 与 Toyokan" },
                            { time: "15:00–16:30", text: "馆内打卡集章，并做浮世绘体验" }
                        ],
                        note: "周日多 17:00 闭馆、16:30 停入场；体验场次出发前确认"
                    },
                    {
                        name: "Akihabara Radio Kaikan",
                        time: "17:00–18:30",
                        drive: "打车约 15 分",
                        leg: "taxi",
                        kind: "highlight",
                        lat: 35.69788, lng: 139.77195,
                        activities: [
                            { time: "17:00–18:30", text: "逛手办、模型店" }
                        ],
                        note: "Soto-Kanda 1-15-16 一带"
                    },
                    {
                        name: "Cafe near Akihabara",
                        time: "18:30–19:15",
                        drive: "步行",
                        lat: 35.69840, lng: 139.77380,
                        activities: [
                            { time: "18:30–19:15", text: "手办逛完，在附近喝咖啡歇脚" }
                        ]
                    },
                    {
                        name: "Yakitori Tsukada Shibuya",
                        time: "20:15–22:00",
                        drive: "地铁约 25 分回 Shibuya",
                        leg: "metro",
                        kind: "highlight",
                        lat: 35.65770, lng: 139.69920,
                        activities: [
                            { time: "20:15–22:00", text: "Yakitori Omakase / course" }
                        ],
                        note: "Dogenzaka 1-6-8 Kusumoto No. 2 Building 2F · 土日 16:00 开，建议预约"
                    },
                    {
                        name: "Shibuya Hotel",
                        time: "22:20 休息",
                        kind: "stay",
                        lat: 35.65838, lng: 139.70222,
                        activities: [
                            { time: "22:20", text: "结束，回酒店休息" }
                        ]
                    }
                ]
            }
        ]);

        const map = TripRender.createMap("map", [35.68, 139.74], 13);

        const tabsEl = document.getElementById("dayTabs");
        const summaryEl = document.getElementById("daySummary");
        const glanceEl = document.getElementById("glance");
        const itineraryEl = document.getElementById("itinerary");
        const detailTitleEl = document.getElementById("detailTitle");
        const detailNoteEl = document.getElementById("detailNote");
        const routeStatEl = document.getElementById("routeStat");
        let routeLines = [];
        let markers = [];
        let activeDay = 0;

        TripRender.createDayTabs(tabsEl, days, renderDay);

        function focusStop(index, { scroll = false } = {}) {
            TripRender.focusStop({
                map,
                markers,
                itineraryEl,
                index,
                zoom: days[activeDay].zoom || 14,
                scroll
            });
        }

        TripRender.bindStopClicks([glanceEl, itineraryEl], focusStop);

        async function renderDay(dayIndex) {
            activeDay = dayIndex;
            const day = days[dayIndex];
            TripRender.selectDayTab(tabsEl, dayIndex);
            summaryEl.innerHTML = "";
            detailTitleEl.textContent = day.title || "";
            detailNoteEl.textContent = "";
            glanceEl.innerHTML = "";
            itineraryEl.innerHTML = "";
            markers.forEach((marker) => marker.remove());
            markers = [];
            routeLines.forEach((line) => line.remove());
            routeLines = [];

            const coords = day.stops.map((stop) => [stop.lat, stop.lng]);

            markers = TripRender.renderStops({
                map,
                stops: day.stops,
                color: day.color,
                glanceEl,
                itineraryEl
            });

            const fallback = L.polyline(coords, {
                color: day.color,
                weight: 4,
                opacity: 0.82,
                dashArray: "8, 8"
            }).addTo(map);
            routeLines.push(fallback);
            map.fitBounds(fallback.getBounds().pad(0.18));
            await TripRouting.walk({
                map,
                day,
                coords,
                lines: routeLines,
                fallback,
                isCurrent: () => activeDay === dayIndex,
                statEl: routeStatEl
            });
        }


        renderDay(0);
    </script>
    <script src="../../js/trip-chrome.js"></script>
</body>
</html>
