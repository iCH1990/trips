<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <title>澳大利亚 Lake St Clair 2026/10/10–2026/10/11</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <link rel="stylesheet" href="../../css/tokens.css">
    <link rel="stylesheet" href="../../css/trip.css">
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="../../js/color.js"></script>
    <script src="../../js/trip-model.js"></script>
    <script src="../../js/trip-render.js"></script>
    <script src="../../js/trip-routing.js"></script>
</head>
<body>
    <div class="page">
        <nav class="site-nav" aria-label="站点导航">
            <a class="back-home" href="../../index.html">← 返回主页</a>
        </nav>
        <header class="trip-head">
            <p class="kicker">Australia · 2026</p>
            <h1>澳大利亚 Lake St Clair 2026/10/10–2026/10/11</h1>
            <p class="subtitle">🇦🇺 · 两天 · 自驾</p>
            <div class="stats">
                <span class="stat">2 天 1 晚</span>
                <span class="stat">约 430 km</span>
                <span class="stat">车内过夜</span>
            </div>
        </header>
        <section class="overview" aria-label="行程总览">
            <div class="card map-card">
                <div id="map" role="application" aria-label="Chatswood 至 Lake St Clair 两日自驾地图"></div>
            </div>
            <div class="card side">
                <div class="day-scroller">
                    <button type="button" class="day-arrow" data-dir="-1" aria-label="更早的日期" hidden>
                        <svg viewBox="0 0 12 12" aria-hidden="true"><path d="M7.6 2.2 4 6l3.6 3.8" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
                    </button>
                    <nav class="day-tabs" id="dayTabs" aria-label="选择日期"></nav>
                    <button type="button" class="day-arrow" data-dir="1" aria-label="更晚的日期" hidden>
                        <svg viewBox="0 0 12 12" aria-hidden="true"><path d="M4.4 2.2 8 6l-3.6 3.8" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
                    </button>
                </div>
                <div class="day-summary" id="daySummary"></div>
                <ol class="glance" id="glance"></ol>
                <p class="route-stat" id="routeStat">正在规划当日路线…</p>
            </div>
        </section>
        <section class="detail" aria-label="当日详细安排">
            <div class="detail-head">
                <div class="detail-heading">
                    <h2 id="detailTitle"></h2>
                    <p class="detail-note" id="detailNote"></p>
                </div>
                <button type="button" class="detail-expand" id="detailExpand" aria-expanded="false">展开</button>
            </div>
            <div class="detail-scroll">
                <ol class="timeline" id="itinerary"></ol>
                <p class="hint">驾驶时间按 OSRM 常规路况估算，不含停车与拥堵。营位必须提前在 Singleton Council 网站预订，办公室 17:00 下班且不收现金。想早到家就从 Singleton 直接上高速。</p>
            </div>
        </section>
    </div>

    <script>
        const days = TripModel.prepareDays([
            {
                date: "10/10",
                weekday: "周六",
                title: "Pie in the Sky → Kurri Kurri → Singleton",
                meta: "约 220 km · 驾驶约 3 小时 10 分 · 车内过夜",
                color: "var(--route-1)",
                stops: [
                    {
                        name: "Chatswood",
                        time: "10:30 出发",
                        lat: -33.7969, lng: 151.1833,
                        activities: [
                            { time: "10:00–10:25", text: "收拾睡袋、防潮垫、手电、碳火烤炉、木炭、卡式炉、锅和今晚的食材；十月夜里大约十几度" },
                            { time: "10:30", text: "加满油，经 Pacific Highway / M1 北上" }
                        ]
                    },
                    {
                        name: "Pie in the Sky",
                        time: "11:10–12:10",
                        drive: "驾驶约 40 分钟",
                        kind: "highlight",
                        lat: -33.5739, lng: 151.1925,
                        activities: [
                            { time: "11:10–12:00", text: "肉饼当午饭，咖啡，在店外观景台坐一会儿" },
                            { time: "12:10", text: "上 M1，下一站在 Kurri Kurri 下高速" }
                        ],
                        note: "1296 Pacific Hwy, Cowan；周六 8:00–17:00。"
                    },
                    {
                        name: "Kurri Kurri",
                        time: "13:30–13:50",
                        drive: "驾驶约 1 小时 20 分",
                        lat: -32.8152, lng: 151.4890,
                        activities: [
                            { time: "13:30–13:50", text: "Lang Street 主街壁画，下来走一圈" },
                            { time: "13:50", text: "回到 Hunter Expressway，继续去 Singleton" }
                        ],
                        note: "壁画沿 Lang Street 露天排开，不用买票。出口就在镇边，停 20 分钟就够。"
                    },
                    {
                        name: "Singleton",
                        time: "14:30–15:20",
                        drive: "驾驶约 40 分钟",
                        kind: "highlight",
                        lat: -32.5653, lng: 151.1690,
                        activities: [
                            { time: "14:30–15:05", text: "The Coffee Club 下午茶（Gowrie 与 John 街口，周六大约开到 17:00）" },
                            { time: "15:05–15:20", text: "Burdekin Park 短走，进营地前最后歇一下" }
                        ],
                        note: "走完经 Bridgman Road / Carrowbrook Road。"
                    },
                    {
                        name: "Lake St Clair Campgrounds",
                        time: "15:55 入住",
                        drive: "驾驶约 35 分钟",
                        kind: "stay",
                        lat: -32.3344, lng: 151.2917,
                        activities: [
                            { time: "15:55", text: "办公室登记。没有预订不能进营位" },
                            { time: "16:15–16:45", text: "选高处、地面硬的非动力营位，车里铺好过夜" },
                            { time: "16:45–17:15", text: "沿 Carrowbrook Road 看东岸，或在船坡附近走走" },
                            { time: "17:15–17:45", text: "回营位生火，木炭预热" },
                            { time: "17:45–18:15", text: "处理肉和菜，炭火继续烧透，卡式炉就位" },
                            { time: "18:15–21:20", text: "碳火烤炉加热锅，慢慢吃，看着天黑" },
                            { time: "21:20–22:10", text: "收餐具、淋浴" },
                            { time: "22:15", text: "上床休息" }
                        ],
                        note: "1719 Carrowbrook Rd, St Clair；电话 (02) 5522 4010。办公室 8:00–17:00，只收卡。轿车避开近水软地。十月湖水偏凉，下水随意。"
                    }
                ]
            },
            {
                date: "10/11",
                weekday: "周日",
                title: "Wollombi 午饭 → Saddles → Chatswood",
                meta: "约 212 km · 驾驶约 3 小时 25 分 · 下午到家",
                color: "var(--route-2)",
                stops: [
                    {
                        name: "Lake St Clair Campgrounds",
                        time: "07:30–10:15",
                        kind: "stay",
                        lat: -32.3344, lng: 151.2917,
                        activities: [
                            { time: "07:30–09:20", text: "营厨房咖啡，沿湖岸再走一圈" },
                            { time: "09:20–10:05", text: "淋浴、收拾车辆，去办公室确认离场" },
                            { time: "10:15", text: "经 Singleton 不上高速，转去 Wollombi" }
                        ],
                        note: "离场时间以办公室说明为准。想多待一上午，就把 Wollombi 改成外带，或直接上 M1 回家。"
                    },
                    {
                        name: "Wollombi Tavern",
                        time: "11:45–13:15",
                        drive: "驾驶约 1 小时 30 分",
                        kind: "highlight",
                        lat: -32.9388, lng: 151.1406,
                        activities: [
                            { time: "11:45–13:15", text: "村子里午饭，木火披萨；Great North Road 两侧可以慢慢看" },
                            { time: "13:15", text: "沿 Tourist Drive 33 往 Mount White" }
                        ],
                        note: "2994 Great North Rd, Wollombi；大约 10:00 开门。出村 8 分钟会过 Laguna，刚吃完午饭不用下。山路弯多。想赶路就从 Singleton 直接上 Hunter Expressway。"
                    },
                    {
                        name: "Saddles",
                        time: "14:30–15:00",
                        drive: "驾驶约 1 小时 10 分",
                        lat: -33.4527, lng: 151.1951,
                        activities: [
                            { time: "14:30–15:00", text: "坝边喝咖啡、伸展一下。山路开完再上高速" }
                        ],
                        note: "20 Ashbrookes Rd, Mount White；苗圃里的咖啡馆，每天大约 8:00–17:00。"
                    },
                    {
                        name: "Chatswood",
                        time: "15:50 抵达",
                        drive: "驾驶约 50 分钟",
                        lat: -33.7969, lng: 151.1833,
                        activities: [
                            { time: "15:50", text: "回到 Chatswood，行程结束" }
                        ]
                    }
                ]
            }
        ]);

        const map = TripRender.createMap("map", [-33.05, 151.22], 8);

        const tabsEl = document.getElementById("dayTabs");
        const summaryEl = document.getElementById("daySummary");
        const glanceEl = document.getElementById("glance");
        const itineraryEl = document.getElementById("itinerary");
        const detailTitleEl = document.getElementById("detailTitle");
        const detailNoteEl = document.getElementById("detailNote");
        const routeStatEl = document.getElementById("routeStat");
        let routeLine = null;
        let markers = [];
        let activeDay = 0;

        TripRender.createDayTabs(tabsEl, days, renderDay);

        function focusStop(index, { scroll = false } = {}) {
            TripRender.focusStop({
                map,
                markers,
                itineraryEl,
                index,
                zoom: 11,
                scroll
            });
        }

        TripRender.bindStopClicks([glanceEl, itineraryEl], focusStop);

        async function renderDay(dayIndex) {
            activeDay = dayIndex;
            const day = days[dayIndex];
            TripRender.selectDayTab(tabsEl, dayIndex);
            summaryEl.innerHTML = "";
            detailTitleEl.textContent = day.title || "";
            detailNoteEl.textContent = "";
            glanceEl.innerHTML = "";
            itineraryEl.innerHTML = "";
            markers.forEach((marker) => marker.remove());
            markers = [];
            if (routeLine) routeLine.remove();

            const coords = day.stops.map((stop) => [stop.lat, stop.lng]);
            routeLine = L.polyline(coords, {
                color: day.color,
                weight: 4,
                opacity: 0.82,
                dashArray: "8, 8"
            }).addTo(map);

            markers = TripRender.renderStops({
                map,
                stops: day.stops,
                color: day.color,
                glanceEl,
                itineraryEl
            });

            map.fitBounds(routeLine.getBounds().pad(0.18));
            await TripRouting.drive({
                map,
                coords,
                line: routeLine,
                isCurrent: () => activeDay === dayIndex,
                statEl: routeStatEl
            });
        }


        renderDay(0);
    </script>
    <script src="../../js/trip-chrome.js"></script>
</body>
</html>
