            <div class="card side">

                    </button>

                        <svg viewBox="0 0 12 12" aria-hidden="true"><path d="M4.4 2.2 8 6l-3.6 3.8" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
                    </button>
                </div>

                <p class="route-stat" id="routeStat">正在规划当日路线…</p>
            </div>
        </section>
        <section class="detail" aria-label="当日详细安排">
            <div class="detail-head">

                    <h2 id="detailTitle"></h2>

                </div>
                <button type="button" class="detail-expand" id="detailExpand" aria-expanded="false">展开</button>
            </div>
            <div class="detail-scroll">
                <ol class="timeline" id="itinerary"></ol>
                <p class="hint">驾驶时间按 OSRM 常规路况估算，不含停车与拥堵。Zoofari Lodge 的专属导览时间以入住当天发放的行程为准；洞穴、住宿及热门餐厅建议提前预订。</p>
            </div>
        </section>
    </div>

                        ],

                        activities: [

                            { time: "12:00–13:15", text: "市中心午餐" }
                        ]
                    },
                    {
                        name: "Royal Flying Doctor Visitor Experience",
                        time: "13:30–15:15",
                        drive: "驾驶约 10 分钟",
                        kind: "highlight",
                        lat: -32.2157, lng: 148.5748,
                        activities: [

                        ],
                        note: "地址：21 Judy Jakins Dr；周一通常 09:00–17:00。"
                    },
                    {

                        lat: -32.2526, lng: 148.5947,
                        activities: [

                            { time: "18:00", text: "晚餐后早休息，为次日动物园留体力" }

                    }
                ]
            },
            {
                date: "11/3",
                weekday: "周二",
                title: "动物园全天 + Zoofari Lodge",
                meta: "Taronga Western Plains Zoo · 14:00–15:00 入住园内",
                color: "var(--route-4)",
                stops: [
                    {
                        name: "Dubbo CBD",
                        time: "08:00–08:45",
                        lat: -32.2569, lng: 148.6011,
                        activities: [
                            { time: "08:00–08:45", text: "早餐、退房；行李直接放车内" }
                        ]
                    },
                    {
                        name: "Taronga Western Plains Zoo",
                        time: "09:00–13:30",

                        kind: "highlight",
                        lat: -32.2725, lng: 148.5800,
                        activities: [

                    },
                    {
                        name: "Zoofari Lodge",
                        time: "14:00 入住–翌日 10:00",
                        drive: "从主园入口约 10 分钟",
                        kind: "stay",
                        lat: -32.2815, lng: 148.5915,
                        activities: [
                            { time: "14:00–15:00", text: "Main House 办理入住，领取专属行程" },
                            { time: "下午", text: "专属 safari 导览 / 动物体验（以现场安排为准）" },
                            { time: "晚上", text: "住宿套餐所含晚餐及夜间体验" }
                        ],
                        note: "Zoofari 包含 1 晚住宿、2 日动物园门票、专属导览、晚餐、早餐及次日自行车。专用入口在 Obley Rd，需使用邮件中的闸门 PIN。"
                    }
                ]
            },
            {
                date: "11/4",
                weekday: "周三",
                title: "晨间 Safari → Orange → Bathurst → Chatswood",
                meta: "约 400 km · 驾驶约 6 小时 · 预计 20:30–21:00 到家",
                color: "var(--route-5)",
                stops: [
                    {
                        name: "Zoofari Lodge",
                        time: "清晨–10:00",
                        kind: "stay",
                        lat: -32.2815, lng: 148.5915,
                        activities: [
                            { time: "清晨", text: "专属 sunrise safari（准确时间入住时确认）" },
                            { time: "早餐", text: "Main House 早餐" },
                            { time: "10:00", text: "退房" }
                        ]
                    },
                    {
                        name: "Taronga Western Plains Zoo",
                        time: "10:00–11:30",
                        kind: "highlight",
                        lat: -32.2725, lng: 148.5800,
                        activities: [
                            { time: "10:00–11:30", text: "使用套餐所含自行车，补看喜欢的动物展区" },

                        ],
                        note: "返程较长；若当天疲劳，可取消骑行并提前出发。"
                    },
                    {
                        name: "Orange",
                        time: "13:35–14:35",
                        drive: "驾驶约 2 小时",
                        lat: -33.2830, lng: 149.1000,
                        activities: [
                            { time: "13:35–14:20", text: "市中心午餐" },
                            { time: "14:20–14:35", text: "Cook Park 短走、加油" }
                        ]
                    },
                    {
                        name: "Mount Panorama · Bathurst",
                        time: "15:30–16:10",
                        drive: "驾驶约 55 分钟",
                        kind: "highlight",
                        lat: -33.4456, lng: 149.5561,
                        activities: [
                            { time: "15:30–16:10", text: "按限速自驾赛道一圈，在观景处短停" }
                        ]
                    },
                    {
                        name: "Chatswood",
                        time: "20:30–21:00 抵达",
                        drive: "驾驶约 3 小时 10 分，另留晚餐与休息",
                        lat: -33.7969, lng: 151.1833,
                        activities: [
                            { time: "途中", text: "Blue Mountains 或 Penrith 安排 30–40 分钟晚餐 / 休息" },
                            { time: "约 21:00", text: "回到 Chatswood，行程结束" }
                        ]
                    }
                ]
            }
        ]);

        const map = TripRender.createMap("map", [-33.2, 149.7], 7);

        const tabsEl = document.getElementById("dayTabs");
        const summaryEl = document.getElementById("daySummary");
        const glanceEl = document.getElementById("glance");
        const itineraryEl = document.getElementById("itinerary");
        const detailTitleEl = document.getElementById("detailTitle");
        const detailNoteEl = document.getElementById("detailNote");
        const routeStatEl = document.getElementById("routeStat");
        let routeLine = null;
        let markers = [];
        let activeDay = 0;

        TripRender.createDayTabs(tabsEl, days, renderDay);

        function focusStop(index, { scroll = false } = {}) {
            TripRender.focusStop({
                map,
                markers,
                itineraryEl,
                index,
                zoom: 11,
                scroll
            });
        }

        TripRender.bindStopClicks([glanceEl, itineraryEl], focusStop);

        async function renderDay(dayIndex) {
            activeDay = dayIndex;
            const day = days[dayIndex];
            TripRender.selectDayTab(tabsEl, dayIndex);
            summaryEl.innerHTML = "";
            detailTitleEl.textContent = day.title || "";
            detailNoteEl.textContent = "";
            glanceEl.innerHTML = "";
            itineraryEl.innerHTML = "";
            markers.forEach((marker) => marker.remove());
            markers = [];
            if (routeLine) routeLine.remove();

            const coords = day.stops.map((stop) => [stop.lat, stop.lng]);
            routeLine = L.polyline(coords, {
                color: day.color,
                weight: 4,
                opacity: 0.82,
                dashArray: "8, 8"
            }).addTo(map);

            markers = TripRender.renderStops({
                map,
                stops: day.stops,
                color: day.color,
                glanceEl,
                itineraryEl
            });

            map.fitBounds(routeLine.getBounds().pad(0.18));
            await TripRouting.drive({
                map,
                coords,
                line: routeLine,
                isCurrent: () => activeDay === dayIndex,
                statEl: routeStatEl
            });
        }


        renderDay(0);
    </script>
    <script src="../../js/trip-chrome.js"></script>
</body>
</html>
