<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <title>澳大利亚 Hunter Valley 2026/09/25–2026/09/27</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <link rel="stylesheet" href="../css/tokens.css">
    <link rel="stylesheet" href="../css/trip.css">
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="../js/color.js"></script>
</head>
<body>
    <div class="page">
        <nav class="site-nav" aria-label="站点导航">
            <a class="back-home" href="../index.html">← 返回主页</a>
        </nav>
        <header class="trip-head">
            <p class="kicker">Australia · 2026</p>
            <h1>澳大利亚 Hunter Valley 2026/09/25–2026/09/27</h1>
            <p class="subtitle">🇦🇺 · 三天 · 自驾</p>
            <div class="stats">
                <span class="stat">3 天 2 晚</span>
                <span class="stat">约 520 km</span>
                <span class="stat">voco + Terrigal</span>
            </div>
        </header>
        <section class="overview" aria-label="行程总览">
            <div class="card map-card">
                <div id="map" role="application" aria-label="Chatswood 至 Hunter Valley、Terrigal 三日自驾地图"></div>
            </div>
            <div class="card side">
                <div class="day-scroller">
                    <button type="button" class="day-arrow" data-dir="-1" aria-label="更早的日期" hidden>
                        <svg viewBox="0 0 12 12" aria-hidden="true"><path d="M7.6 2.2 4 6l3.6 3.8" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
                    </button>
                    <nav class="day-tabs" id="dayTabs" aria-label="选择日期"></nav>
                    <button type="button" class="day-arrow" data-dir="1" aria-label="更晚的日期" hidden>
                        <svg viewBox="0 0 12 12" aria-hidden="true"><path d="M4.4 2.2 8 6l-3.6 3.8" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
                    </button>
                </div>
                <div class="day-summary" id="daySummary"></div>
                <ol class="glance" id="glance"></ol>
                <p class="route-stat" id="routeStat">正在规划当日路线…</p>
            </div>
        </section>
        <section class="detail" aria-label="当日详细安排">
            <div class="detail-head">
                <div class="detail-heading">
                    <h2 id="detailTitle"></h2>
                    <p class="detail-note" id="detailNote"></p>
                </div>
                <button type="button" class="detail-expand" id="detailExpand" aria-expanded="false">展开</button>
            </div>
            <div class="detail-scroll">
                <ol class="timeline" id="itinerary"></ol>
                <p class="hint">驾驶时间按 OSRM 常规路况估算，不含停车与拥堵。品酒请留指定司机。Glenworth 骑马周末常满，须提前订。</p>
            </div>
        </section>
    </div>

    <script>
        const days = [
            {
                date: "9/25",
                weekday: "周五",
                title: "Chatswood → voco Kirkton Park",
                meta: "约 165 km · 驾驶约 2 小时 20 分 · 宿 Pokolbin",
                color: tokenColor("var(--route-1)"),
                stops: [
                    {
                        name: "Chatswood",
                        time: "20:30 出发",
                        lat: -33.7969, lng: 151.1833,
                        activities: [
                            { time: "19:00–20:15", text: "在家吃晚饭，收拾沙滩与骑马的衣物、帽子、防晒" },
                            { time: "20:30", text: "加满油出发，经 M1 北上 Hunter Valley" }
                        ]
                    },
                    {
                        name: "voco Kirkton Park",
                        time: "22:50 入住",
                        drive: "驾驶约 2 小时 20 分",
                        kind: "stay",
                        lat: -32.7751, lng: 151.2668,
                        activities: [
                            { time: "22:50", text: "办理入住，行李直接放房间" },
                            { time: "23:00", text: "早休息；次日上午品酒、酒庄午餐后再去 Anna Bay" }
                        ],
                        note: "336 Oakey Creek Rd, Pokolbin；电话 +61 2 4998 7680。只住 9/25 一晚。夜间抵达请确认 late check-in。"
                    }
                ]
            },
            {
                date: "9/26",
                weekday: "周六",
                title: "酒庄午餐 → Anna Bay → Terrigal",
                meta: "约 255 km · 驾驶约 3 小时 20 分 · 宿 Terrigal",
                color: tokenColor("var(--route-2)"),
                stops: [
                    {
                        name: "voco Kirkton Park",
                        time: "08:30–09:40",
                        kind: "stay",
                        lat: -32.7751, lng: 151.2668,
                        activities: [
                            { time: "08:30–09:30", text: "酒店早餐后退房，行李放车上" },
                            { time: "09:40", text: "就近去 cellar door，不必赶路" }
                        ]
                    },
                    {
                        name: "Audrey Wilkinson",
                        time: "10:00–11:45",
                        drive: "驾驶约 10 分钟",
                        kind: "highlight",
                        lat: -32.7825, lng: 151.2758,
                        activities: [
                            { time: "10:00–10:15", text: "观景台俯瞰葡萄园" },
                            { time: "10:15–11:45", text: "Cellar door 品鉴，指定司机不喝酒" }
                        ],
                        note: "750 De Beyers Rd, Pokolbin；cellar door 约 10:00 开。离 voco 很近。"
                    },
                    {
                        name: "Restaurant Botanica",
                        time: "12:00–14:00",
                        drive: "驾驶约 12 分钟",
                        kind: "highlight",
                        lat: -32.7709, lng: 151.2884,
                        activities: [
                            { time: "12:00–14:00", text: "Spicers Vineyards Estate 周六午餐，预订 12:00" },
                            { time: "14:00", text: "开车往 Port Stephens，Terrigal 不赶入住" }
                        ],
                        note: "555 Hermitage Rd, Pokolbin；周六午餐约 12:00–14:30。订不上可改 Muse Kitchen（Keith Tulloch，周三至周日午餐）。想赶 14:30 沙丘四驱，午餐需 12:45 前结束。"
                    },
                    {
                        name: "Birubi Point · Anna Bay",
                        time: "15:30–17:30",
                        drive: "驾驶约 1 小时 20 分",
                        kind: "highlight",
                        lat: -32.7706, lng: 152.0836,
                        activities: [
                            { time: "15:30–17:00", text: "Birubi Beach 看沙丘入海，短走或沙板" },
                            { time: "17:00–17:30", text: "One Mile Beach 一带歇脚、喝咖啡" },
                            { time: "17:30", text: "沿 M1 南下 Terrigal，不回 Hunter Valley" }
                        ],
                        note: "九月海水仍凉，以沙丘与沙滩为主。不赶定点四驱；想开四驱把午餐收短，订 Sand Dune Adventures 14:30 场（须提前 30 分钟报到）。"
                    },
                    {
                        name: "Crowne Plaza Terrigal Pacific",
                        time: "19:15 入住",
                        drive: "驾驶约 1 小时 40 分",
                        kind: "stay",
                        lat: -33.4485, lng: 151.4451,
                        activities: [
                            { time: "19:15", text: "办理入住，行李进房" },
                            { time: "19:45–21:15", text: "酒店 Meribella 或海滨餐厅晚餐" }
                        ],
                        note: "Pine Tree Lane, Terrigal；入住通常 15:00 起，晚到没问题。只住 9/26 一晚。周日 Glenworth 约 40 分钟。"
                    }
                ]
            },
            {
                date: "9/27",
                weekday: "周日",
                title: "Terrigal → Glenworth Valley → Chatswood",
                meta: "约 115 km · 驾驶约 1 小时 50 分 · 下午到家",
                color: tokenColor("var(--route-3)"),
                stops: [
                    {
                        name: "Crowne Plaza Terrigal Pacific",
                        time: "08:00–09:50",
                        kind: "stay",
                        lat: -33.4485, lng: 151.4451,
                        activities: [
                            { time: "08:00–09:00", text: "酒店早餐" },
                            { time: "09:00–09:40", text: "Terrigal Beach 短走后退房" },
                            { time: "09:50", text: "出发前往 Glenworth Valley" }
                        ],
                        note: "退房通常 11:00；为赶 11:00 骑马请 09:50 前离开。"
                    },
                    {
                        name: "Glenworth Valley",
                        time: "10:30–13:15",
                        drive: "驾驶约 40 分钟",
                        kind: "highlight",
                        lat: -33.4167, lng: 151.1833,
                        activities: [
                            { time: "10:30–11:00", text: "接待处报到、分配马匹与讲解" },
                            { time: "11:00–13:00", text: "山谷骑马，约 2 小时体验" },
                            { time: "13:00–13:15", text: "园内 Cafe 简单垫一下再上路" }
                        ],
                        note: "地址 69 Cooks Rd, Glenworth Valley，电话 (02) 4375 1222；周末场次 09:00 / 11:00 / 14:00。住 Terrigal 后订 11:00 仍能下午到家，比从 Hunter Valley 出发宽裕。"
                    },
                    {
                        name: "Chatswood",
                        time: "14:30 抵达",
                        drive: "驾驶约 1 小时 10 分",
                        lat: -33.7969, lng: 151.1833,
                        activities: [
                            { time: "13:20", text: "从 Glenworth 上 M1 南返" },
                            { time: "14:30", text: "回到 Chatswood，行程结束" }
                        ]
                    }
                ]
            }
        ];

        const map = L.map("map", { zoomControl: true }).setView([-33.1, 151.5], 8);
        L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
            maxZoom: 19,
            attribution: "&copy; OpenStreetMap contributors"
        }).addTo(map);

        const tabsEl = document.getElementById("dayTabs");
        const summaryEl = document.getElementById("daySummary");
        const glanceEl = document.getElementById("glance");
        const itineraryEl = document.getElementById("itinerary");
        const detailTitleEl = document.getElementById("detailTitle");
        const detailNoteEl = document.getElementById("detailNote");
        const routeStatEl = document.getElementById("routeStat");
        let routeLine = null;
        let markers = [];
        let activeDay = 0;

        days.forEach((day, index) => {
            const button = document.createElement("button");
            button.type = "button";
            button.className = "day-tab";
            button.innerHTML = `${escapeHtml(day.date)}<br>${escapeHtml(day.weekday)}`;
            button.addEventListener("click", () => renderDay(index));
            tabsEl.appendChild(button);
        });

        function highlightStop(index) {
            document.querySelectorAll(".stop").forEach((el) => {
                el.classList.toggle("is-active", Number(el.dataset.index) === index);
            });
            document.querySelectorAll(".stop-card").forEach((card, i) => {
                card.classList.toggle("is-active", i === index);
            });
        }

        function focusStop(index, { scroll = false } = {}) {
            highlightStop(index);
            map.flyTo(markers[index].getLatLng(), 11, { duration: 0.7 });
            markers[index].openPopup();
            if (scroll) {
                itineraryEl.children[index].scrollIntoView({ behavior: "smooth", block: "center" });
            }
        }

        [glanceEl, itineraryEl].forEach((container) => {
            container.addEventListener("click", (event) => {
                const button = event.target.closest(".stop");
                if (!button) return;
                focusStop(Number(button.dataset.index), { scroll: container === glanceEl });
            });
        });

        async function renderDay(dayIndex) {
            activeDay = dayIndex;
            const day = days[dayIndex];
            document.querySelectorAll(".day-tab").forEach((tab, index) => {
                tab.classList.toggle("is-active", index === dayIndex);
                if (index === dayIndex) {
                    const tabsRect = tabsEl.getBoundingClientRect();
                    const tabRect = tab.getBoundingClientRect();
                    if (tabRect.left < tabsRect.left) {
                        tabsEl.scrollLeft -= tabsRect.left - tabRect.left;
                    } else if (tabRect.right > tabsRect.right) {
                        tabsEl.scrollLeft += tabRect.right - tabsRect.right;
                    }
                }
            });
            summaryEl.innerHTML = "";
            detailTitleEl.textContent = day.title || "";
            detailNoteEl.textContent = "";
            glanceEl.innerHTML = "";
            itineraryEl.innerHTML = "";
            markers.forEach((marker) => marker.remove());
            markers = [];
            if (routeLine) routeLine.remove();

            const coords = day.stops.map((stop) => [stop.lat, stop.lng]);
            routeLine = L.polyline(coords, {
                color: day.color,
                weight: 4,
                opacity: 0.82,
                dashArray: "8, 8"
            }).addTo(map);

            day.stops.forEach((stop, index) => {
                const number = index + 1;
                const kindClass = stop.kind ? ` is-${stop.kind}` : "";
                const label = stop.kind === "stay"
                    ? '<span class="tag tag--stay">住宿</span>'
                    : stop.kind === "highlight"
                        ? '<span class="tag">重点</span>'
                        : "";
                const activityRows = stop.activities.map((activity) => `
                    <li class="activity">
                        <span class="activity-time">${escapeHtml(activity.time)}</span>
                        <span class="activity-text">${escapeHtml(activity.text)}</span>
                    </li>`).join("");
                const meta = [stop.drive, stop.time].filter(Boolean).join(" · ");
                const note = stop.note ? `<span class="note">${escapeHtml(stop.note)}</span>` : "";

                const marker = L.marker([stop.lat, stop.lng], {
                    icon: L.divIcon({
                        className: "",
                        html: `<div class="num-marker${kindClass}" style="background:${kindClass ? "" : day.color}">${number}</div>`,
                        iconSize: [29, 29],
                        iconAnchor: [14, 14],
                        popupAnchor: [0, -16]
                    })
                }).addTo(map);
                marker.bindPopup(`
                    <p class="popup-title">${number}. ${escapeHtml(stop.name)}${label}</p>
                    <p class="popup-meta">${escapeHtml(meta)}</p>
                    ${note}
                    <ul class="activities activities--popup">${activityRows}</ul>`);
                marker.on("click", () => highlightStop(index));
                markers.push(marker);

                const badgeStyle = kindClass ? "" : ` style="background:${day.color}"`;
                const glanceItem = document.createElement("li");
                glanceItem.className = "glance-item";
                glanceItem.innerHTML = `
                    <button class="stop" type="button" data-index="${index}">
                        <span class="badge${kindClass}"${badgeStyle}>${number}</span>
                        <span>
                            <span class="stop-title">${escapeHtml(stop.name)}${label}</span>
                            <span class="stop-meta">${escapeHtml(stop.time || "")}</span>
                        </span>
                    </button>`;
                glanceEl.appendChild(glanceItem);

                const item = document.createElement("li");
                item.className = "timeline-item";
                item.innerHTML = `
                    ${stop.drive ? `<p class="leg-row">${escapeHtml(stop.drive)}</p>` : ""}
                    <article class="stop-card">
                        <button class="stop" type="button" data-index="${index}">
                            <span class="badge${kindClass}"${badgeStyle}>${number}</span>
                            <span>
                                <span class="stop-title">${escapeHtml(stop.name)}${label}</span>
                                <span class="stop-meta">${escapeHtml(stop.time || "")}</span>
                            </span>
                        </button>
                        <ul class="activities">${activityRows}</ul>
                        ${note}
                    </article>`;
                itineraryEl.appendChild(item);
            });

            map.fitBounds(routeLine.getBounds().pad(0.18));
            await loadRoute(day, coords, dayIndex);
        }

        async function loadRoute(day, coords, expectedDay) {
            routeStatEl.textContent = "正在规划当日路线…";
            const path = coords.map(([lat, lng]) => `${lng},${lat}`).join(";");
            const url = `https://router.project-osrm.org/route/v1/driving/${path}?overview=full&geometries=geojson`;
            try {
                const response = await fetch(url);
                if (!response.ok) throw new Error("route request failed");
                const data = await response.json();
                if (activeDay !== expectedDay) return;
                const route = data.routes && data.routes[0];
                if (!route) throw new Error("no route returned");
                routeLine.setLatLngs(route.geometry.coordinates.map(([lng, lat]) => [lat, lng]));
                routeLine.setStyle({ dashArray: null });
                const km = Math.round(route.distance / 1000);
                const minutes = Math.round(route.duration / 60);
                const time = minutes >= 60
                    ? `${Math.floor(minutes / 60)} 小时 ${minutes % 60} 分`
                    : `${minutes} 分`;
                routeStatEl.textContent = `当日 ${km} km · ${time}`;
                map.fitBounds(routeLine.getBounds().pad(0.15));
            } catch (error) {
                if (activeDay === expectedDay) routeStatEl.textContent = "路线暂不可用，显示直线示意";
            }
        }

        function escapeHtml(value) {
            return String(value)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;");
        }

        renderDay(0);
    </script>
    <script>
        (function () {
            const tabs = document.getElementById("dayTabs");
            const arrows = document.querySelectorAll(".day-arrow");
            if (tabs && arrows.length) {
                const updateArrows = function () {
                    const max = tabs.scrollWidth - tabs.clientWidth;
                    const overflow = max > 4;
                    arrows.forEach(function (arrow) {
                        arrow.hidden = !overflow;
                        const dir = Number(arrow.dataset.dir);
                        arrow.disabled = dir < 0 ? tabs.scrollLeft <= 2 : tabs.scrollLeft >= max - 2;
                    });
                };
                arrows.forEach(function (arrow) {
                    arrow.addEventListener("click", function () {
                        const amount = Math.max(tabs.clientWidth * 0.72, 96);
                        tabs.scrollBy({ left: Number(arrow.dataset.dir) * amount, behavior: "smooth" });
                    });
                });
                tabs.addEventListener("scroll", updateArrows, { passive: true });
                window.addEventListener("resize", updateArrows);
                updateArrows();
            }
            const root = document.documentElement;
            const button = document.getElementById("detailExpand");
            const detail = document.querySelector(".detail");
            if (!button || !detail) return;
            button.addEventListener("click", function () {
                const expanded = !root.classList.contains("is-page-scroll");
                root.classList.toggle("is-page-scroll", expanded);
                button.setAttribute("aria-expanded", expanded ? "true" : "false");
                button.textContent = expanded ? "收起" : "展开";
                if (expanded) {
                    requestAnimationFrame(function () {
                        detail.scrollIntoView({ behavior: "smooth", block: "start" });
                    });
                } else {
                    const timeline = document.querySelector(".timeline");
                    if (timeline) timeline.scrollTop = 0;
                    window.scrollTo(0, 0);
                }
                window.dispatchEvent(new Event("resize"));
            });
        })();
    </script>
</body>
</html>
