<body>

        <header class="trip-head">

            <div class="card side">

                    <nav class="day-tabs" id="dayTabs" aria-label="选择日期"></nav>
                    <button type="button" class="day-arrow" data-dir="1" aria-label="更晚的日期" hidden>
                        <svg viewBox="0 0 12 12" aria-hidden="true"><path d="M4.4 2.2 8 6l-3.6 3.8" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
                    </button>
                </div>
                <div class="day-summary" id="daySummary"></div>
                <ol class="glance" id="glance"></ol>
                <p class="route-stat" id="routeStat">正在规划当日路线…</p>
            </div>
        </section>
        <section class="detail" aria-label="当日详细安排">

                    <p class="detail-note" id="detailNote"></p>

            </div>
            <div class="detail-scroll">

            </div>
        </section>
    </div>

            {

                title: "Mt Coot-tha 后返程 Sydney",
                meta: "Botanic Gardens 与观景咖啡 · 下午去机场 · JQ823 回 Sydney",

                flightStat: "JQ823 Brisbane → Sydney",
                stops: [
                    {
                        name: "Four Points by Sheraton Brisbane",
                        time: "早晨",
                        kind: "stay",
                        lat: -27.4718, lng: 153.0281,
                        activities: [

                        ]
                    },
                    {
                        name: "Brisbane Botanic Gardens Mt Coot-tha",
                        time: "上午–下午",
                        kind: "highlight",
                        lat: -27.4779, lng: 152.9746,
                        activities: [

                        ]
                    },
                    {

                    {

                        ]

                    {
                        name: "Sydney Airport",
                        time: "抵达",
                        drive: "飞行约 1 小时 35 分",
                        leg: "flight",
                        lat: -33.9499, lng: 151.1820,

                        ]
                    }
                ]
            }
        ]);

        const map = TripRender.createMap("map", [-28.0, 153.4], 10);

        const tabsEl = document.getElementById("dayTabs");
        const summaryEl = document.getElementById("daySummary");
        const glanceEl = document.getElementById("glance");
        const itineraryEl = document.getElementById("itinerary");
        const detailTitleEl = document.getElementById("detailTitle");
        const detailNoteEl = document.getElementById("detailNote");
        const routeStatEl = document.getElementById("routeStat");
        let routeLines = [];
        let markers = [];
        let activeDay = 0;

        TripRender.createDayTabs(tabsEl, days, renderDay);

        function focusStop(index, { scroll = false } = {}) {
            TripRender.focusStop({
                map,
                markers,
                itineraryEl,
                index,
                zoom: days[activeDay].zoom || 12,
                scroll
            });
        }

        TripRender.bindStopClicks([glanceEl, itineraryEl], focusStop);

        async function renderDay(dayIndex) {
            activeDay = dayIndex;
            const day = days[dayIndex];
            TripRender.selectDayTab(tabsEl, dayIndex);
            summaryEl.innerHTML = "";
            detailTitleEl.textContent = day.title || "";
            detailNoteEl.textContent = "";
            glanceEl.innerHTML = "";
            itineraryEl.innerHTML = "";
            markers.forEach((marker) => marker.remove());
            markers = [];
            routeLines.forEach((line) => line.remove());
            routeLines = [];

            const coords = day.stops.map((stop) => [stop.lat, stop.lng]);

            markers = TripRender.renderStops({
                map,
                stops: day.stops,
                color: day.color,
                glanceEl,
                itineraryEl
            });

            const fallback = L.polyline(coords, {
                color: day.color,
                weight: 4,
                opacity: 0.82,
                dashArray: "8, 8"
            }).addTo(map);
            routeLines.push(fallback);
            map.fitBounds(fallback.getBounds().pad(0.18));
            await TripRouting.road({
                map,
                day,
                coords,
                lines: routeLines,
                fallback,
                isCurrent: () => activeDay === dayIndex,
                statEl: routeStatEl
            });
        }


        renderDay(0);
    </script>
    <script src="../../js/trip-chrome.js"></script>
</body>
</html>
