<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <title>美国 Los Angeles 2024/01/27–2024/01/28</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <link rel="stylesheet" href="../../css/tokens.css">
    <link rel="stylesheet" href="../../css/trip.css">
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="../../js/color.js"></script>
    <script src="../../js/trip-model.js"></script>
    <script src="../../js/trip-render.js"></script>
    <script src="../../js/trip-routing.js"></script>
</head>
<body>
    <div class="page">
        <nav class="site-nav" aria-label="站点导航">
            <a class="back-home" href="../../index.html">← 返回主页</a>
        </nav>
        <header class="trip-head">
            <p class="kicker">United States · 2024</p>
            <h1>美国 Los Angeles 2024/01/27–2024/01/28</h1>
            <p class="subtitle">🇺🇸 · 两天 · 自驾 · Joshua Tree 与环球影城</p>
            <div class="stats">
                <span class="stat">2 天 1 晚</span>
                <span class="stat">住 Marina del Rey</span>
                <span class="stat">Joshua Tree</span>
            </div>
        </header>
        <section class="overview" aria-label="行程总览">
            <div class="card map-card">
                <div id="map" role="application" aria-label="Los Angeles 两日自驾地图"></div>
            </div>
            <div class="card side">
                <div class="day-scroller">
                    <button type="button" class="day-arrow" data-dir="-1" aria-label="更早的日期" hidden>
                        <svg viewBox="0 0 12 12" aria-hidden="true"><path d="M7.6 2.2 4 6l3.6 3.8" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
                    </button>
                    <nav class="day-tabs" id="dayTabs" aria-label="选择日期"></nav>
                    <button type="button" class="day-arrow" data-dir="1" aria-label="更晚的日期" hidden>
                        <svg viewBox="0 0 12 12" aria-hidden="true"><path d="M4.4 2.2 8 6l-3.6 3.8" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
                    </button>
                </div>
                <div class="day-summary" id="daySummary"></div>
                <ol class="glance" id="glance"></ol>
                <p class="route-stat" id="routeStat">正在规划当日路线…</p>
            </div>
        </section>
        <section class="detail" aria-label="当日详细安排">
            <div class="detail-head">
                <div class="detail-heading">
                    <h2 id="detailTitle"></h2>
                    <p class="detail-note" id="detailNote"></p>
                </div>
                <button type="button" class="detail-expand" id="detailExpand" aria-expanded="false">展开</button>
            </div>
            <div class="detail-scroll">
                <ol class="timeline" id="itinerary"></ol>
                <p class="hint">靶场需带实体护照或驾照，现场订位后由教练带枪和弹药；靶场本身不提供。一月沙漠夜晚很冷，观星看当晚天气。驾驶时间按 OSRM 常规路况估算。</p>
            </div>
        </section>
    </div>

    <script>
        const days = TripModel.prepareDays([
            {
                date: "1/27",
                weekday: "周六",
                title: "Alhambra、打靶、Joshua Tree 观星，回 Koreatown 吃晚饭",
                meta: "Marina del Rey 出发 · 99 Ranch · Bangkok Soul · 打靶 · Joshua Tree 观景 · 观星后回 Koreatown",
                color: "var(--route-1)",
                stops: [
                    {
                        name: "Marina del Rey",
                        time: "09:00 出发",
                        kind: "stay",
                        lat: 33.9776848, lng: -118.4486470,
                        activities: [
                            { time: "09:00", text: "出发前往 Alhambra，车程约 45–60 分钟" }
                        ]
                    },
                    {
                        name: "99 Ranch Market",
                        time: "10:00–10:40",
                        drive: "开车约 50 分钟",
                        lat: 34.0977955, lng: -118.1236212,
                        activities: [
                            { time: "10:00–10:40", text: "买零食和水，备下午去沙漠路上喝" }
                        ],
                        note: "345 E Main St, Alhambra, CA 91801"
                    },
                    {
                        name: "Bangkok Soul",
                        time: "12:00–13:15",
                        drive: "开车约 3 分钟",
                        lat: 34.0990767, lng: -118.1200348,
                        activities: [
                            { time: "12:00–13:15", text: "泰餐午餐，之后出发去靶场" }
                        ],
                        note: "707 E Main St, Alhambra, CA 91801"
                    },
                    {
                        name: "Raahauge's Shooting Range",
                        time: "14:15–15:15",
                        drive: "开车约 50 分钟",
                        kind: "highlight",
                        lat: 33.9234538, lng: -117.6199143,
                        activities: [
                            { time: "14:15", text: "现场预订靶位，出示实体护照或驾照" },
                            { time: "14:20–15:15", text: "教练带枪和弹药过来打，靶场不提供枪弹" }
                        ],
                        note: "14995 River Rd, Eastvale, CA 92880"
                    },
                    {
                        name: "Hidden Valley",
                        time: "17:15–17:40",
                        drive: "开车约 1 小时 50 分",
                        kind: "highlight",
                        lat: 34.0124, lng: -116.1680,
                        activities: [
                            { time: "17:15–17:40", text: "西门进园后第一站，岩石堆观景" }
                        ]
                    },
                    {
                        name: "Keys View",
                        time: "17:55–18:15",
                        drive: "开车约 15 分钟",
                        kind: "highlight",
                        lat: 33.9256, lng: -116.1869,
                        activities: [
                            { time: "17:55–18:15", text: "俯瞰 Coachella Valley，一月接近日落" }
                        ]
                    },
                    {
                        name: "Skull Rock",
                        time: "18:30–18:45",
                        drive: "开车约 20 分钟",
                        lat: 33.9978, lng: -116.0594,
                        activities: [
                            { time: "18:30–18:45", text: "Park Blvd 路边骷髅石，之后出北门" }
                        ]
                    },
                    {
                        name: "Sky's The Limit Observatory and Nature Center",
                        time: "19:00–19:30",
                        drive: "开车约 15 分钟",
                        kind: "highlight",
                        lat: 34.0788761, lng: -116.0348237,
                        activities: [
                            { time: "19:00–19:30", text: "观星约半小时，结束后返程去 Koreatown" }
                        ],
                        note: "9697 Utah Trail, Twentynine Palms, CA 92277"
                    },
                    {
                        name: "Sun Nong Dan",
                        time: "22:00–23:15",
                        drive: "开车约 2 小时 20 分",
                        lat: 34.0629108, lng: -118.2975183,
                        activities: [
                            { time: "22:00–23:15", text: "Koreatown 韩式牛骨汤晚餐" }
                        ],
                        note: "3470 W 6th St, Los Angeles, CA 90020"
                    },
                    {
                        name: "Marina del Rey",
                        time: "23:50 回住地",
                        drive: "开车约 25 分钟",
                        kind: "stay",
                        lat: 33.9776848, lng: -118.4486470,
                        activities: [
                            { time: "23:50", text: "回到 Marina del Rey" }
                        ]
                    }
                ]
            },
            {
                date: "1/28",
                weekday: "周日",
                title: "一整天在环球影城",
                meta: "Marina del Rey 出发 · Universal Studios Hollywood · 晚上 7 点返程",
                color: "var(--route-2)",
                zoom: 13,
                stops: [
                    {
                        name: "Marina del Rey",
                        time: "09:00 出发",
                        kind: "stay",
                        lat: 33.9776848, lng: -118.4486470,
                        activities: [
                            { time: "09:00", text: "出发前往环球影城，车程约 35–45 分钟" }
                        ]
                    },
                    {
                        name: "Universal Studios Hollywood",
                        time: "09:45–19:00",
                        drive: "开车约 40 分钟",
                        kind: "highlight",
                        lat: 34.1392322, lng: -118.3543834,
                        activities: [
                            { time: "09:45–19:00", text: "一整天都在园内" },
                            { time: "19:00", text: "出园，返回 Marina del Rey" }
                        ],
                        note: "100 Universal Hollywood Drive, Universal City, CA 91608"
                    },
                    {
                        name: "Marina del Rey",
                        time: "19:40 行程结束",
                        drive: "开车约 40 分钟",
                        kind: "stay",
                        lat: 33.9776848, lng: -118.4486470,
                        activities: [
                            { time: "19:40", text: "回到 Marina del Rey，行程结束" }
                        ]
                    }
                ]
            }
        ]);

        const map = TripRender.createMap("map", [34.0, -117.5], 8);

        const tabsEl = document.getElementById("dayTabs");
        const summaryEl = document.getElementById("daySummary");
        const glanceEl = document.getElementById("glance");
        const itineraryEl = document.getElementById("itinerary");
        const detailTitleEl = document.getElementById("detailTitle");
        const detailNoteEl = document.getElementById("detailNote");
        const routeStatEl = document.getElementById("routeStat");
        let routeLines = [];
        let markers = [];
        let activeDay = 0;

        TripRender.createDayTabs(tabsEl, days, renderDay);

        function focusStop(index, { scroll = false } = {}) {
            TripRender.focusStop({
                map,
                markers,
                itineraryEl,
                index,
                zoom: days[activeDay].zoom || 12,
                scroll
            });
        }

        TripRender.bindStopClicks([glanceEl, itineraryEl], focusStop);

        async function renderDay(dayIndex) {
            activeDay = dayIndex;
            const day = days[dayIndex];
            TripRender.selectDayTab(tabsEl, dayIndex);
            summaryEl.innerHTML = "";
            detailTitleEl.textContent = day.title || "";
            detailNoteEl.textContent = "";
            glanceEl.innerHTML = "";
            itineraryEl.innerHTML = "";
            markers.forEach((marker) => marker.remove());
            markers = [];
            routeLines.forEach((line) => line.remove());
            routeLines = [];

            const coords = day.stops.map((stop) => [stop.lat, stop.lng]);

            markers = TripRender.renderStops({
                map,
                stops: day.stops,
                color: day.color,
                glanceEl,
                itineraryEl
            });

            const fallback = L.polyline(coords, {
                color: day.color,
                weight: 4,
                opacity: 0.82,
                dashArray: "8, 8"
            }).addTo(map);
            routeLines.push(fallback);
            map.fitBounds(fallback.getBounds().pad(0.18));
            await TripRouting.road({
                map,
                day,
                coords,
                lines: routeLines,
                fallback,
                isCurrent: () => activeDay === dayIndex,
                statEl: routeStatEl
            });
        }


        renderDay(0);
    </script>
    <script src="../../js/trip-chrome.js"></script>
</body>
</html>
