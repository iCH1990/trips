        </header>
        <section class="overview" aria-label="行程总览">
            <div class="card map-card">

            </div>
            <div class="card side">
                <div class="day-scroller">

        </section>
        <section class="detail" aria-label="当日详细安排">
            <div class="detail-head">
                <div class="detail-heading">
                    <h2 id="detailTitle"></h2>
                    <p class="detail-note" id="detailNote"></p>
                </div>
                <button type="button" class="detail-expand" id="detailExpand" aria-expanded="false">展开</button>
            </div>
            <div class="detail-scroll">
                <ol class="timeline" id="itinerary"></ol>
                <p class="hint">30 日景点按顺路排：先大皇宫和玉佛寺，步行到卧佛寺，从贴贴码头坐船到郑王庙，回来在码头一带路上吃。航班时刻没有按当年班表填写。虚线为航班、BTS、打车或渡船，实线为步行。</p>
            </div>
        </section>
    </div>

                        lat: 13.72868, lng: 100.53183,

                    }
                ]
            },
            {

                weekday: "周五",
                title: "大皇宫、玉佛寺、卧佛寺和郑王庙，出来路上吃",
                meta: "打车去大皇宫和玉佛寺 · 步行卧佛寺 · 坐船郑王庙 · 贴贴码头路上吃",
                color: "var(--route-2)",
                zoom: 15,
                stops: [
                    {
                        name: "W Bangkok",
                        time: "早上出发",
                        kind: "stay",
                        lat: 13.72211, lng: 100.52892,
                        activities: [
                            { time: "早上", text: "从 W 出发" }
                        ],
                        note: "北沙吞路 106 号"
                    },
                    {
                        name: "大皇宫 · 玉佛寺",
                        time: "白天",
                        drive: "打车",
                        leg: "taxi",
                        kind: "highlight",
                        lat: 13.75150, lng: 100.49266,
                        activities: [

                        ]
                    },
                    {

                        time: "白天",
                        drive: "步行",
                        kind: "highlight",
                        lat: 13.74635, lng: 100.49274,
                        activities: [
                            { time: "白天", text: "看卧佛" }
                        ]
                    },
                    {
                        name: "郑王庙",
                        time: "白天",
                        drive: "贴贴码头坐船过河",
                        leg: "taxi",
                        kind: "highlight",
                        lat: 13.74390, lng: 100.48851,

                        ]
                    },
                    {

                        drive: "坐船回来",

                        lat: 13.74579, lng: 100.49040,
                        activities: [
                            { time: "出来之后", text: "庙里出来，路上吃东西" }
                        ]
                    }
                ]
            },
            {
                date: "12/31",
                weekday: "周六",
                title: "暹罗广场、四面佛，建兴酒家咖喱炒蟹，晚上跨年",
                meta: "BTS 到暹罗广场 · 四面佛 · 建兴酒家 · 跨年",
                color: "var(--route-3)",
                zoom: 15,
                stops: [
                    {
                        name: "W Bangkok",
                        time: "出发",
                        kind: "stay",
                        lat: 13.72211, lng: 100.52892,
                        activities: [

                        ],
                        note: "北沙吞路 106 号"
                    },
                    {

                        time: "下午",
                        drive: "BTS 席隆线到暹罗站",
                        leg: "metro",
                        kind: "highlight",
                        lat: 13.74460, lng: 100.53310,
                        activities: [
                            { time: "下午", text: "暹罗广场和附近商场" }
                        ]
                    },
                    {
                        name: "四面佛",
                        time: "下午",
                        drive: "天桥步行",
                        kind: "highlight",
                        lat: 13.74432, lng: 100.54042,
                        activities: [
                            { time: "下午", text: "四面佛" }
                        ],
                        note: "中央世界门口"
                    },
                    {
                        name: "建兴酒家",
                        time: "晚饭",
                        drive: "步行进商场",
                        kind: "highlight",
                        lat: 13.74658, lng: 100.53904,
                        activities: [
                            { time: "晚饭", text: "吃咖喱炒蟹" }
                        ]
                    },
                    {
                        name: "中央世界",
                        time: "晚上跨年",
                        drive: "走到商场前",
                        kind: "highlight",
                        lat: 13.74570, lng: 100.53980,
                        activities: [
                            { time: "晚上", text: "跨年" }
                        ]
                    }
                ]
            },
            {
                date: "1/1",
                weekday: "周日",
                title: "邦南蓬水上市场，下午 ZH9004 飞回深圳",
                meta: "邦南蓬水上市场 · 下午去素万那普 · ZH9004 回宝安",
                color: "var(--route-4)",
                zoom: 12,
                flightStat: "ZH9004 曼谷 → 深圳",
                stops: [
                    {
                        name: "W Bangkok",
                        time: "早上出发",
                        kind: "stay",
                        lat: 13.72211, lng: 100.52892,
                        activities: [
                            { time: "早上", text: "退房出发。当天没走远" }
                        ],
                        note: "北沙吞路 106 号"
                    },
                    {
                        name: "邦南蓬水上市场",
                        time: "上午",
                        drive: "打车",
                        leg: "taxi",
                        kind: "highlight",
                        lat: 13.68027, lng: 100.57606,
                        activities: [
                            { time: "上午", text: "邦南蓬水上市场逛一逛、吃东西" }
                        ],
                        note: "Phra Pradaeng。1 月 1 日是周日，市集开门"
                    },
                    {
                        name: "素万那普机场",
                        time: "下午",
                        drive: "打车",
                        leg: "taxi",
                        lat: 13.69162, lng: 100.75108,
                        activities: [
                            { time: "下午", text: "前往素万那普，乘坐 ZH9004" }
                        ]
                    },
                    {
                        name: "深圳宝安国际机场",
                        time: "抵达",
                        drive: "ZH9004",
                        leg: "flight",
                        lat: 22.6393, lng: 113.8107,
                        activities: [
                            { time: "抵达", text: "ZH9004 抵达宝安，行程结束" }
                        ]
                    }
                ]
            }
        ]);

        const map = TripRender.createMap("map", [13.73, 100.53], 12);

        const tabsEl = document.getElementById("dayTabs");
        const summaryEl = document.getElementById("daySummary");
        const glanceEl = document.getElementById("glance");
        const itineraryEl = document.getElementById("itinerary");
        const detailTitleEl = document.getElementById("detailTitle");
        const detailNoteEl = document.getElementById("detailNote");
        const routeStatEl = document.getElementById("routeStat");
        let routeLines = [];
        let markers = [];
        let activeDay = 0;

        TripRender.createDayTabs(tabsEl, days, renderDay);

        function focusStop(index, { scroll = false } = {}) {
            TripRender.focusStop({
                map,
                markers,
                itineraryEl,
                index,
                zoom: days[activeDay].zoom || 14,
                scroll
            });
        }

        TripRender.bindStopClicks([glanceEl, itineraryEl], focusStop);

        async function renderDay(dayIndex) {
            activeDay = dayIndex;
            const day = days[dayIndex];
            TripRender.selectDayTab(tabsEl, dayIndex);
            summaryEl.innerHTML = "";
            detailTitleEl.textContent = day.title || "";
            detailNoteEl.textContent = day.meta || "";
            glanceEl.innerHTML = "";
            itineraryEl.innerHTML = "";
            markers.forEach((marker) => marker.remove());
            markers = [];
            routeLines.forEach((line) => line.remove());
            routeLines = [];

            const coords = day.stops.map((stop) => [stop.lat, stop.lng]);

            markers = TripRender.renderStops({
                map,
                stops: day.stops,
                color: day.color,
                glanceEl,
                itineraryEl
            });

            const fallback = L.polyline(coords, {
                color: day.color,
                weight: 4,
                opacity: 0.82,
                dashArray: "8, 8"
            }).addTo(map);
            routeLines.push(fallback);
            map.fitBounds(fallback.getBounds().pad(0.18));
            await TripRouting.city({
                map,
                day,
                coords,
                lines: routeLines,
                fallback,
                isCurrent: () => activeDay === dayIndex,
                statEl: routeStatEl
            });
        }


        renderDay(0);
    </script>
    <script src="../../js/trip-chrome.js"></script>
</body>
</html>
