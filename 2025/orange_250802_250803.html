<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <title>澳大利亚 Orange 2025/08/02–2025/08/03</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <link rel="stylesheet" href="../css/tokens.css">
    <link rel="stylesheet" href="../css/trip.css">
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="../js/color.js"></script>
</head>
<body>
    <div class="page">
        <nav class="site-nav" aria-label="站点导航">
            <a class="back-home" href="../index.html">← 返回主页</a>
        </nav>
        <header class="trip-head">
            <p class="kicker">Australia · 2025</p>
            <h1>澳大利亚 Orange 2025/08/02–2025/08/03</h1>
            <p class="subtitle">🇦🇺 · 两天 · 自驾 · 山的那边</p>
            <div class="stats">
                <span class="stat">2 天 1 晚</span>
                <span class="stat">12 座 · 6 大 2 小</span>
                <span class="stat">Fire Festival</span>
            </div>
        </header>
        <section class="overview" aria-label="行程总览">
            <div class="card map-card">
                <div id="map" role="application" aria-label="Orange 两日自驾地图"></div>
            </div>
            <div class="card side">
                <div class="day-scroller">
                    <button type="button" class="day-arrow" data-dir="-1" aria-label="更早的日期" hidden>
                        <svg viewBox="0 0 12 12" aria-hidden="true"><path d="M7.6 2.2 4 6l3.6 3.8" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
                    </button>
                    <nav class="day-tabs" id="dayTabs" aria-label="选择日期"></nav>
                    <button type="button" class="day-arrow" data-dir="1" aria-label="更晚的日期" hidden>
                        <svg viewBox="0 0 12 12" aria-hidden="true"><path d="M4.4 2.2 8 6l-3.6 3.8" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
                    </button>
                </div>
                <div class="day-summary" id="daySummary"></div>
                <ol class="glance" id="glance"></ol>
                <p class="route-stat" id="routeStat">正在规划当日路线…</p>
            </div>
        </section>
        <section class="detail" aria-label="当日详细安排">
            <div class="detail-head">
                <div class="detail-heading">
                    <h2 id="detailTitle"></h2>
                    <p class="detail-note" id="detailNote"></p>
                </div>
                <button type="button" class="detail-expand" id="detailExpand" aria-expanded="false">展开</button>
            </div>
            <div class="detail-scroll">
                <ol class="timeline" id="itinerary"></ol>
                <p class="hint">St Leonards 取 12 座，行李放最后一排。驾驶时间按 OSRM 常规路况估算。Fire Festival 节目以当年手册为准；观星看当晚天气。热门餐厅建议提前订位。</p>
            </div>
        </section>
    </div>

    <script>
        const days = [
            {
                date: "8/2",
                weekday: "周六",
                title: "取车经 Blue Mountains、Bathurst，入住 Orange",
                meta: "St Leonards 出发 · Unique 午餐 · Bathurst 歇脚 · 晚上 Fire Festival 与日料",
                color: tokenColor("var(--route-1)"),
                stops: [
                    {
                        name: "St Leonards",
                        time: "08:30 取车 · 09:00 出发",
                        lat: -33.8247, lng: 151.1967,
                        activities: [
                            { time: "08:30", text: "取 12 座车，行李放最后一排" },
                            { time: "09:00", text: "出发前往 Blue Mountains，车程约 2 小时" }
                        ],
                        note: "50 Nicholson Street, St Leonards"
                    },
                    {
                        name: "Unique Patisserie",
                        time: "11:15–12:30",
                        drive: "开车约 2 小时",
                        kind: "highlight",
                        lat: -33.7161, lng: 150.3110,
                        activities: [
                            { time: "11:15", text: "Pryor Place Car Park 停车" },
                            { time: "11:30–12:30", text: "午餐：肉骨茶与点心" }
                        ],
                        note: "169 Katoomba Street, Katoomba"
                    },
                    {
                        name: "Bathurst",
                        time: "14:00–15:00",
                        drive: "开车约 1 小时 30 分",
                        lat: -33.4187, lng: 149.5774,
                        activities: [
                            { time: "14:00", text: "OILAH MEGA CARPARK 停车" },
                            { time: "14:15", text: "Country Coffee 喝咖啡 · 161 George St" },
                            { time: "14:30–15:00", text: "逛 Machattie Park" }
                        ]
                    },
                    {
                        name: "Airbnb · Orange",
                        time: "16:00 入住",
                        drive: "开车约 1 小时",
                        kind: "stay",
                        lat: -33.2689, lng: 149.0987,
                        activities: [
                            { time: "16:00", text: "办理入住，放下行李" },
                            { time: "21:30", text: "看天气情况，在民宿内观星" }
                        ],
                        note: "154 Matthews Ave, Orange NSW 2800 · 四房 1 厅 3 卫"
                    },
                    {
                        name: "Orange CBD",
                        time: "16:30–21:00",
                        lat: -33.2829, lng: 149.0968,
                        activities: [
                            { time: "16:30", text: "Fire Festival 集市、表演与小吃" },
                            { time: "18:00–19:30", text: "Raku Izakaya 日料晚餐 · 129 Summer St" },
                            { time: "19:30–21:00", text: "再逛 Fire Festival，之后回民宿" }
                        ]
                    }
                ]
            },
            {
                date: "8/3",
                weekday: "周日",
                title: "游乐场、Mayfield Garden，经 Three Sisters 回家",
                meta: "Orange 出发 · Oberon 花园 · Echo Point 观景 · Leura 韩料后回 Sydney",
                color: tokenColor("var(--route-2)"),
                stops: [
                    {
                        name: "Orange Adventure Playground",
                        time: "09:00–10:00",
                        lat: -33.2545, lng: 149.0969,
                        activities: [
                            { time: "09:00–10:00", text: "出门活动；附近咖啡店顺便解决早餐" }
                        ],
                        note: "Yellow Box Way, Bletchington"
                    },
                    {
                        name: "Mayfield Garden",
                        time: "11:30–15:00",
                        drive: "开车约 1 小时 30 分",
                        kind: "highlight",
                        lat: -33.6661, lng: 149.7792,
                        activities: [
                            { time: "11:30–12:00", text: "Mayfield Garden Cafe 西式简餐" },
                            { time: "12:00–15:00", text: "逛花园" }
                        ],
                        note: "530 Mayfield Road, Oberon"
                    },
                    {
                        name: "Echo Point Lookout",
                        time: "16:30–17:00",
                        drive: "开车约 1 小时 30 分",
                        kind: "highlight",
                        lat: -33.7310, lng: 150.3115,
                        activities: [
                            { time: "16:30", text: "Cliff Dr 停车" },
                            { time: "16:35–17:00", text: "Three Sisters 观景" }
                        ]
                    },
                    {
                        name: "Jiggle Korean BBQ",
                        time: "17:30–19:00",
                        drive: "开车约 10 分钟",
                        lat: -33.7141, lng: 150.3319,
                        activities: [
                            { time: "17:15", text: "Picklemouse Corner 停车 · 1/152 Megalong St" },
                            { time: "17:30–19:00", text: "韩式烤肉晚餐" }
                        ],
                        note: "Leura, Blue Mountains"
                    },
                    {
                        name: "St Leonards",
                        time: "21:00 行程结束",
                        drive: "开车约 2 小时",
                        lat: -33.8247, lng: 151.1967,
                        activities: [
                            { time: "19:00", text: "从 Leura 出发回 Sydney" },
                            { time: "21:00", text: "还车，行程结束" }
                        ]
                    }
                ]
            }
        ];

        const map = L.map("map", { zoomControl: true }).setView([-33.4, 150.3], 8);
        L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
            maxZoom: 19,
            attribution: "&copy; OpenStreetMap contributors"
        }).addTo(map);

        const tabsEl = document.getElementById("dayTabs");
        const summaryEl = document.getElementById("daySummary");
        const glanceEl = document.getElementById("glance");
        const itineraryEl = document.getElementById("itinerary");
        const detailTitleEl = document.getElementById("detailTitle");
        const detailNoteEl = document.getElementById("detailNote");
        const routeStatEl = document.getElementById("routeStat");
        let routeLines = [];
        let markers = [];
        let activeDay = 0;

        days.forEach((day, index) => {
            const button = document.createElement("button");
            button.type = "button";
            button.className = "day-tab";
            button.innerHTML = `${escapeHtml(day.date)}<br>${escapeHtml(day.weekday)}`;
            button.addEventListener("click", () => renderDay(index));
            tabsEl.appendChild(button);
        });

        function highlightStop(index) {
            document.querySelectorAll(".stop").forEach((el) => {
                el.classList.toggle("is-active", Number(el.dataset.index) === index);
            });
            document.querySelectorAll(".stop-card").forEach((card, i) => {
                card.classList.toggle("is-active", i === index);
            });
        }

        function focusStop(index, { scroll = false } = {}) {
            highlightStop(index);
            const zoom = days[activeDay].zoom || 12;
            map.flyTo(markers[index].getLatLng(), zoom, { duration: 0.7 });
            markers[index].openPopup();
            if (scroll) {
                itineraryEl.children[index].scrollIntoView({ behavior: "smooth", block: "center" });
            }
        }

        [glanceEl, itineraryEl].forEach((container) => {
            container.addEventListener("click", (event) => {
                const button = event.target.closest(".stop");
                if (!button) return;
                focusStop(Number(button.dataset.index), { scroll: container === glanceEl });
            });
        });

        function splitLegs(day, coords) {
            const groups = [];
            let current = { type: "drive", points: [coords[0]] };
            for (let i = 1; i < day.stops.length; i++) {
                const type = day.stops[i].leg === "flight" ? "flight" : "drive";
                if (type === current.type) {
                    current.points.push(coords[i]);
                } else {
                    groups.push(current);
                    current = { type, points: [coords[i - 1], coords[i]] };
                }
            }
            groups.push(current);
            return groups.filter((group) => group.points.length > 1);
        }

        async function renderDay(dayIndex) {
            activeDay = dayIndex;
            const day = days[dayIndex];
            document.querySelectorAll(".day-tab").forEach((tab, index) => {
                tab.classList.toggle("is-active", index === dayIndex);
                if (index === dayIndex) {
                    const tabsRect = tabsEl.getBoundingClientRect();
                    const tabRect = tab.getBoundingClientRect();
                    if (tabRect.left < tabsRect.left) {
                        tabsEl.scrollLeft -= tabsRect.left - tabRect.left;
                    } else if (tabRect.right > tabsRect.right) {
                        tabsEl.scrollLeft += tabRect.right - tabsRect.right;
                    }
                }
            });
            summaryEl.innerHTML = "";
            detailTitleEl.textContent = day.title || "";
            detailNoteEl.textContent = "";
            glanceEl.innerHTML = "";
            itineraryEl.innerHTML = "";
            markers.forEach((marker) => marker.remove());
            markers = [];
            routeLines.forEach((line) => line.remove());
            routeLines = [];

            const coords = day.stops.map((stop) => [stop.lat, stop.lng]);

            day.stops.forEach((stop, index) => {
                const number = index + 1;
                const kindClass = stop.kind ? ` is-${stop.kind}` : "";
                const label = stop.kind === "stay"
                    ? '<span class="tag tag--stay">住宿</span>'
                    : stop.kind === "highlight"
                        ? '<span class="tag">重点</span>'
                        : "";
                const activityRows = stop.activities.map((activity) => `
                    <li class="activity">
                        <span class="activity-time">${escapeHtml(activity.time)}</span>
                        <span class="activity-text">${escapeHtml(activity.text)}</span>
                    </li>`).join("");
                const meta = [stop.drive, stop.time].filter(Boolean).join(" · ");
                const note = stop.note ? `<span class="note">${escapeHtml(stop.note)}</span>` : "";

                const marker = L.marker([stop.lat, stop.lng], {
                    icon: L.divIcon({
                        className: "",
                        html: `<div class="num-marker${kindClass}" style="background:${kindClass ? "" : day.color}">${number}</div>`,
                        iconSize: [29, 29],
                        iconAnchor: [14, 14],
                        popupAnchor: [0, -16]
                    })
                }).addTo(map);
                marker.bindPopup(`
                    <p class="popup-title">${number}. ${escapeHtml(stop.name)}${label}</p>
                    <p class="popup-meta">${escapeHtml(meta)}</p>
                    ${note}
                    <ul class="activities activities--popup">${activityRows}</ul>`);
                marker.on("click", () => highlightStop(index));
                markers.push(marker);

                const badgeStyle = kindClass ? "" : ` style="background:${day.color}"`;
                const glanceItem = document.createElement("li");
                glanceItem.className = "glance-item";
                glanceItem.innerHTML = `
                    <button class="stop" type="button" data-index="${index}">
                        <span class="badge${kindClass}"${badgeStyle}>${number}</span>
                        <span>
                            <span class="stop-title">${escapeHtml(stop.name)}${label}</span>
                            <span class="stop-meta">${escapeHtml(stop.time || "")}</span>
                        </span>
                    </button>`;
                glanceEl.appendChild(glanceItem);

                const item = document.createElement("li");
                item.className = "timeline-item";
                item.innerHTML = `
                    ${stop.drive ? `<p class="leg-row">${escapeHtml(stop.drive)}</p>` : ""}
                    <article class="stop-card">
                        <button class="stop" type="button" data-index="${index}">
                            <span class="badge${kindClass}"${badgeStyle}>${number}</span>
                            <span>
                                <span class="stop-title">${escapeHtml(stop.name)}${label}</span>
                                <span class="stop-meta">${escapeHtml(stop.time || "")}</span>
                            </span>
                        </button>
                        <ul class="activities">${activityRows}</ul>
                        ${note}
                    </article>`;
                itineraryEl.appendChild(item);
            });

            const fallback = L.polyline(coords, {
                color: day.color,
                weight: 4,
                opacity: 0.82,
                dashArray: "8, 8"
            }).addTo(map);
            routeLines.push(fallback);
            map.fitBounds(fallback.getBounds().pad(0.18));
            await loadRoute(day, coords, dayIndex, fallback);
        }

        async function loadRoute(day, coords, expectedDay, fallback) {
            const groups = splitLegs(day, coords);
            const profile = day.mode === "foot" ? "foot" : "driving";
            const waiting = day.mode === "foot" ? "正在规划步行路线…" : "正在规划当日路线…";
            routeStatEl.textContent = waiting;

            let driveKm = 0;
            let driveMin = 0;
            let hasFlight = false;
            let routed = false;

            for (const group of groups) {
                if (group.type === "flight") {
                    hasFlight = true;
                    const line = L.polyline(group.points, {
                        color: day.color,
                        weight: 3,
                        opacity: 0.75,
                        dashArray: "8, 8"
                    }).addTo(map);
                    routeLines.push(line);
                    continue;
                }
                const path = group.points.map(([lat, lng]) => `${lng},${lat}`).join(";");
                const url = `https://router.project-osrm.org/route/v1/${profile}/${path}?overview=full&geometries=geojson`;
                try {
                    const response = await fetch(url);
                    if (!response.ok) throw new Error("route request failed");
                    const data = await response.json();
                    if (activeDay !== expectedDay) return;
                    const route = data.routes && data.routes[0];
                    if (!route) throw new Error("no route returned");
                    const line = L.polyline(
                        route.geometry.coordinates.map(([lng, lat]) => [lat, lng]),
                        { color: day.color, weight: 4, opacity: 0.85 }
                    ).addTo(map);
                    routeLines.push(line);
                    driveKm += route.distance / 1000;
                    driveMin += route.duration / 60;
                    routed = true;
                } catch (error) {
                    const line = L.polyline(group.points, {
                        color: day.color,
                        weight: 4,
                        opacity: 0.82,
                        dashArray: "8, 8"
                    }).addTo(map);
                    routeLines.push(line);
                }
            }

            if (activeDay !== expectedDay) return;
            if (fallback) {
                fallback.remove();
                routeLines = routeLines.filter((line) => line !== fallback);
            }

            const parts = [];
            if (hasFlight) parts.push(day.flightStat || "航班示意线");
            if (routed) {
                const km = profile === "foot" ? driveKm.toFixed(1) : Math.round(driveKm);
                const minutes = Math.round(driveMin);
                const time = minutes >= 60
                    ? `${Math.floor(minutes / 60)} 小时 ${minutes % 60} 分`
                    : `${minutes} 分`;
                const label = profile === "foot" ? "步行" : "自驾";
                parts.push(`${label}约 ${km} km · ${time}`);
            } else if (!hasFlight) {
                parts.push(profile === "foot" ? "步行路线暂不可用，显示直线示意" : "路线暂不可用，显示直线示意");
            }
            routeStatEl.textContent = parts.join(" · ");

            const bounds = routeLines.reduce((acc, line) => acc.extend(line.getBounds()), routeLines[0].getBounds());
            map.fitBounds(bounds.pad(0.15));
        }

        function escapeHtml(value) {
            return String(value)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;");
        }

        renderDay(0);
    </script>
    <script>
        (function () {
            const tabs = document.getElementById("dayTabs");
            const arrows = document.querySelectorAll(".day-arrow");
            if (tabs && arrows.length) {
                const updateArrows = function () {
                    const max = tabs.scrollWidth - tabs.clientWidth;
                    const overflow = max > 4;
                    arrows.forEach(function (arrow) {
                        arrow.hidden = !overflow;
                        const dir = Number(arrow.dataset.dir);
                        arrow.disabled = dir < 0 ? tabs.scrollLeft <= 2 : tabs.scrollLeft >= max - 2;
                    });
                };
                arrows.forEach(function (arrow) {
                    arrow.addEventListener("click", function () {
                        const amount = Math.max(tabs.clientWidth * 0.72, 96);
                        tabs.scrollBy({ left: Number(arrow.dataset.dir) * amount, behavior: "smooth" });
                    });
                });
                tabs.addEventListener("scroll", updateArrows, { passive: true });
                window.addEventListener("resize", updateArrows);
                updateArrows();
            }
            const root = document.documentElement;
            const button = document.getElementById("detailExpand");
            const detail = document.querySelector(".detail");
            if (!button || !detail) return;
            button.addEventListener("click", function () {
                const expanded = !root.classList.contains("is-page-scroll");
                root.classList.toggle("is-page-scroll", expanded);
                button.setAttribute("aria-expanded", expanded ? "true" : "false");
                button.textContent = expanded ? "收起" : "展开";
                if (expanded) {
                    requestAnimationFrame(function () {
                        detail.scrollIntoView({ behavior: "smooth", block: "start" });
                    });
                } else {
                    const timeline = document.querySelector(".timeline");
                    if (timeline) timeline.scrollTop = 0;
                    window.scrollTo(0, 0);
                }
                window.dispatchEvent(new Event("resize"));
            });
        })();
    </script>
</body>
</html>
