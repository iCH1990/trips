<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <title>法国 Paris 2025/01/17–2025/01/18</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        :root {
            --ink: #1c2b3a;
            --muted: #5a6a7a;
            --line: #dce5ec;
            --accent: #3d5a80;
            --accent-soft: #e8eef5;
            --warm: #b45f24;
            --warm-soft: #fff0df;
            --stay: #6b4ea0;
            --stay-soft: #f0eafa;
            --bg: #f4f7f9;
            --shadow: 0 1px 2px rgba(15, 35, 55, 0.05);
            --shadow-lift: 0 10px 28px rgba(15, 35, 55, 0.1);
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            background: var(--bg);
            color: var(--ink);
            font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
        }
        button { font: inherit; }
        .page { max-width: 1140px; margin: 0 auto; padding: 40px 24px 72px; }
        .card {
            border: 1px solid var(--line);
            border-radius: 16px;
            background: #fff;
            box-shadow: var(--shadow);
        }
        .kicker {
            margin: 0;
            color: var(--accent);
            font-size: 12px;
            font-weight: 650;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }
        h1 { margin: 8px 0 0; color: var(--ink); font-size: 30px; line-height: 1.25; }
        .subtitle { margin: 8px 0 0; color: var(--muted); font-size: 14px; line-height: 1.6; }
        .stats { display: flex; flex-wrap: wrap; gap: 8px; margin: 16px 0 0; }
        .stat {
            padding: 5px 11px;
            border: 1px solid var(--line);
            border-radius: 999px;
            background: #fff;
            color: var(--ink);
            font-size: 12px;
        }
        .overview {
            display: grid;
            grid-template-columns: minmax(0, 1fr) 316px;
            gap: 16px;
            margin: 24px 0 0;
        }
        .map-card { overflow: hidden; }
        #map { width: 100%; height: 100%; min-height: 520px; }
        .side {
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-height: 520px;
            padding: 16px;
        }
        .day-tabs {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(84px, 1fr));
            gap: 6px;
        }
        .day-tab {
            border: 1px solid var(--line);
            border-radius: 10px;
            padding: 8px 4px;
            background: #fff;
            color: var(--muted);
            cursor: pointer;
            font-size: 12px;
            line-height: 1.3;
        }
        .day-tab:hover, .day-tab:focus-visible { border-color: var(--accent); outline: none; }
        .day-tab.is-active { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); font-weight: 700; }
        .day-summary {
            padding: 10px 12px;
            border-left: 3px solid var(--accent);
            border-radius: 6px;
            background: #f5f9fb;
        }
        .day-title { margin: 0; color: var(--ink); font-size: 14px; font-weight: 700; }
        .day-meta { margin: 4px 0 0; color: var(--muted); font-size: 12px; line-height: 1.5; }
        .glance {
            flex: 1;
            overflow: auto;
            margin: 0;
            padding: 0;
            list-style: none;
        }
        .glance-item + .glance-item { border-top: 1px solid var(--line); }
        .stop {
            display: grid;
            grid-template-columns: 26px 1fr;
            gap: 10px;
            align-items: center;
            width: 100%;
            padding: 8px 6px;
            border: 0;
            border-radius: 8px;
            background: transparent;
            color: inherit;
            text-align: left;
            cursor: pointer;
        }
        .stop:hover, .stop:focus-visible, .stop.is-active { background: var(--accent-soft); outline: none; }
        .route-stat {
            margin: 0;
            padding-top: 10px;
            border-top: 1px solid var(--line);
            color: var(--muted);
            font-size: 12px;
            line-height: 1.5;
        }
        .badge, .num-marker {
            display: grid;
            place-items: center;
            border-radius: 50%;
            background: var(--accent);
            color: #fff;
            font-weight: 700;
        }
        .badge { width: 26px; height: 26px; margin-top: 1px; font-size: 12px; }
        .num-marker {
            width: 29px;
            height: 29px;
            border: 2px solid #fff;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.27);
            font-size: 12px;
        }
        .badge.is-stay, .num-marker.is-stay { background: var(--stay); }
        .badge.is-highlight, .num-marker.is-highlight { background: var(--warm); }
        .stop-title { color: var(--ink); font-size: 14px; font-weight: 650; }
        .stop-meta { display: block; margin-top: 2px; color: var(--muted); font-size: 12px; line-height: 1.4; }
        .tag {
            display: inline-block;
            margin-left: 6px;
            padding: 1px 6px;
            border-radius: 999px;
            background: var(--warm-soft);
            color: var(--warm);
            font-size: 10px;
            font-weight: 700;
            vertical-align: 1px;
        }
        .tag--stay { background: var(--stay-soft); color: var(--stay); }
        .detail { margin: 32px 0 0; }
        .detail-head {
            display: flex;
            flex-wrap: wrap;
            align-items: baseline;
            gap: 4px 12px;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--line);
        }
        .detail-head h2 { margin: 0; font-size: 20px; }
        .detail-note { margin: 0; color: var(--muted); font-size: 13px; }
        .timeline { display: grid; gap: 10px; margin: 18px 0 0; padding: 0; list-style: none; }
        .timeline-item { display: grid; gap: 10px; }
        .leg-row {
            display: flex;
            align-items: center;
            gap: 9px;
            padding-left: 18px;
            color: var(--muted);
            font-size: 12px;
        }
        .leg-row::before {
            content: "";
            width: 2px;
            height: 20px;
            border-radius: 2px;
            background: var(--line);
        }
        .stop-card {
            padding: 16px 18px;
            border: 1px solid var(--line);
            border-radius: 16px;
            background: #fff;
            box-shadow: var(--shadow);
            scroll-margin-top: 16px;
            transition: border-color 0.18s ease, box-shadow 0.18s ease;
        }
        .stop-card.is-active { border-color: var(--accent); box-shadow: var(--shadow-lift); }
        .stop-card .stop {
            grid-template-columns: 32px 1fr;
            gap: 12px;
            align-items: start;
            padding: 0;
        }
        .stop-card .stop:hover, .stop-card .stop:focus-visible, .stop-card .stop.is-active { background: transparent; }
        .stop-card .badge { width: 32px; height: 32px; margin-top: 0; font-size: 14px; }
        .stop-card .stop-title { font-size: 17px; font-weight: 700; }
        .stop-card .stop-meta { margin-top: 4px; font-size: 13px; }
        .activities {
            display: grid;
            gap: 8px;
            margin: 12px 0 0;
            padding: 12px 0 0;
            border-top: 1px dashed var(--line);
            list-style: none;
        }
        .activity {
            display: grid;
            grid-template-columns: 96px 1fr;
            gap: 12px;
            font-size: 13.5px;
            line-height: 1.6;
        }
        .activity-time { color: var(--accent); font-weight: 650; font-variant-numeric: tabular-nums; }
        .activity-text { color: var(--ink); }
        .note {
            display: block;
            margin-top: 10px;
            padding: 8px 10px;
            border-radius: 8px;
            background: var(--warm-soft);
            color: var(--warm);
            font-size: 12.5px;
            line-height: 1.5;
        }
        .hint { margin: 28px 0 0; color: #6c7d8e; font-size: 12px; line-height: 1.6; }
        .popup-title { margin: 0 0 4px; color: var(--ink); font-size: 14px; font-weight: 700; }
        .popup-meta { margin: 0; color: var(--muted); font-size: 12px; }
        .activities--popup { gap: 5px; margin-top: 8px; font-size: 12px; }
        .activities--popup .activity { grid-template-columns: 72px 1fr; gap: 8px; font-size: 12px; }
        .leaflet-popup-content { margin: 10px 13px; min-width: 235px; }
        @media (max-width: 880px) {
            .overview { grid-template-columns: minmax(0, 1fr); }
            #map { min-height: 380px; }
            .side { max-height: none; }
            .glance { overflow: visible; }
        }
        @media (max-width: 560px) {
            .page { padding: 28px 16px 56px; }
            h1 { font-size: 23px; }
            .stop-card { padding: 14px 15px; }
            .stop-card .stop-title { font-size: 16px; }
            .activity { grid-template-columns: 72px 1fr; gap: 8px; font-size: 13px; }
        }
    </style>
</head>
<body>
    <div class="page">
        <header class="trip-head">
            <p class="kicker">France · 2025</p>
            <h1>法国 Paris 2025/01/17–2025/01/18</h1>
            <p class="subtitle">🇫🇷 · 两天 · 步行</p>
            <div class="stats">
                <span class="stat">2 天 1 晚</span>
                <span class="stat">全天步行</span>
            </div>
        </header>
        <section class="overview" aria-label="行程总览">
            <div class="card map-card">
                <div id="map" role="application" aria-label="Paris 行程地图"></div>
            </div>
            <div class="card side">
                <nav class="day-tabs" id="dayTabs" aria-label="选择日期"></nav>
                <div class="day-summary" id="daySummary"></div>
                <ol class="glance" id="glance"></ol>
                <p class="route-stat" id="routeStat">正在规划当日路线…</p>
            </div>
        </section>
        <section class="detail" aria-label="当日详细安排">
            <div class="detail-head">
                <h2 id="detailTitle"></h2>
                <p class="detail-note" id="detailNote"></p>
            </div>
            <ol class="timeline" id="itinerary"></ol>
        </section>
        <p class="hint">17 日抵达入住。18 日从酒店出发，按实际步行顺序标点；下午在 La Grille Montorgueil 午餐后，从 Gare du Nord 搭 Eurostar 回 London。</p>
    </div>

    <script>
        const days = [
            {
                date: "1/17",
                weekday: "周五",
                title: "London → Paris，入住",
                meta: "Eurostar · 抵达后入住 Hôtel du Louvre - The Unbound Collection by Hyatt",
                color: "#3d5a80",
                mode: "eurostar",
                zoom: 8,
                stops: [
                    {
                        name: "London St Pancras",
                        time: "出发",
                        lat: 51.5308, lng: -0.1253,
                        activities: [
                            { time: "当天", text: "Eurostar 从 St Pancras 出发" }
                        ]
                    },
                    {
                        name: "Paris Gare du Nord",
                        time: "抵达",
                        drive: "Eurostar 约 2 小时 15 分",
                        lat: 48.8809, lng: 2.3553,
                        activities: [
                            { time: "抵达后", text: "出站，前往酒店" }
                        ]
                    },
                    {
                        name: "Hôtel du Louvre - The Unbound Collection by Hyatt",
                        time: "入住",
                        kind: "stay",
                        lat: 48.86278, lng: 2.33589,
                        activities: [
                            { time: "下午/傍晚", text: "办理入住，当晚不安排游览" }
                        ],
                        note: "Place André Malraux, 75001 Paris"
                    }
                ]
            },
            {
                date: "1/18",
                weekday: "周六",
                title: "步行一天，午餐后回 London",
                meta: "酒店出发 · 全天步行 · 午餐后 Gare du Nord 搭 Eurostar",
                color: "#b45f24",
                mode: "foot",
                zoom: 15,
                stops: [
                    {
                        name: "Hôtel du Louvre - The Unbound Collection by Hyatt",
                        time: "早晨出发",
                        kind: "stay",
                        lat: 48.86278, lng: 2.33589,
                        activities: [{ time: "早晨", text: "从酒店出发，开始步行" }],
                        note: "Place André Malraux, 75001 Paris"
                    },
                    {
                        name: "Musée du Louvre",
                        time: "上午",
                        kind: "highlight",
                        lat: 48.8606, lng: 2.3376,
                        activities: [{ time: "途经", text: "卢浮宫外墙看看" }]
                    },
                    {
                        name: "Palais de Justice de Paris",
                        time: "上午",
                        lat: 48.8557, lng: 2.3450,
                        activities: [{ time: "途经", text: "司法宫，Île de la Cité" }]
                    },
                    {
                        name: "Sainte-Chapelle",
                        time: "上午",
                        kind: "highlight",
                        lat: 48.8554, lng: 2.3450,
                        activities: [{ time: "途经", text: "圣礼拜堂" }]
                    },
                    {
                        name: "Notre-Dame Cathedral of Paris",
                        time: "上午",
                        kind: "highlight",
                        lat: 48.8530, lng: 2.3499,
                        activities: [{ time: "途经", text: "巴黎圣母院" }]
                    },
                    {
                        name: "Saint-Nicolas du Chardonnet",
                        time: "上午",
                        lat: 48.8491, lng: 2.3502,
                        activities: [{ time: "途经", text: "23 Rue des Bernardins" }]
                    },
                    {
                        name: "Panthéon",
                        time: "上午",
                        kind: "highlight",
                        lat: 48.8462, lng: 2.3460,
                        activities: [{ time: "途经", text: "先贤祠" }]
                    },
                    {
                        name: "Panthéon-Sorbonne University",
                        time: "上午",
                        lat: 48.8467, lng: 2.3444,
                        activities: [{ time: "途经", text: "Université Paris 1 · Place du Panthéon" }]
                    },
                    {
                        name: "Luxembourg Palace",
                        time: "上午",
                        lat: 48.8481, lng: 2.3372,
                        activities: [{ time: "途经", text: "卢森堡宫" }]
                    },
                    {
                        name: "Hôtel des Invalides",
                        time: "下午",
                        kind: "highlight",
                        lat: 48.8565, lng: 2.3126,
                        activities: [{ time: "途经", text: "荣军院" }]
                    },
                    {
                        name: "Military School",
                        time: "下午",
                        lat: 48.8528, lng: 2.3043,
                        activities: [{ time: "途经", text: "军事学院" }]
                    },
                    {
                        name: "Champ de Mars",
                        time: "下午",
                        lat: 48.8556, lng: 2.2986,
                        activities: [{ time: "途经", text: "战神广场" }]
                    },
                    {
                        name: "Eiffel Tower",
                        time: "下午",
                        kind: "highlight",
                        lat: 48.8584, lng: 2.2945,
                        activities: [{ time: "途经", text: "埃菲尔铁塔" }]
                    },
                    {
                        name: "Place du Trocadero",
                        time: "下午",
                        lat: 48.8630, lng: 2.2876,
                        activities: [{ time: "途经", text: "特罗卡德罗广场" }]
                    },
                    {
                        name: "Palais d'Iéna",
                        time: "下午",
                        lat: 48.8642, lng: 2.2944,
                        activities: [{ time: "途经", text: "耶拿宫" }]
                    },
                    {
                        name: "Musée national des arts asiatiques - Guimet",
                        time: "下午",
                        lat: 48.86528, lng: 2.29389,
                        activities: [{ time: "途经", text: "亚洲艺术博物馆 · 6 Place d'Iéna" }]
                    },
                    {
                        name: "Palais de Tokyo",
                        time: "下午",
                        lat: 48.8640, lng: 2.2972,
                        activities: [{ time: "途经", text: "东京宫" }]
                    },
                    {
                        name: "Square du Palais-Galliera",
                        time: "下午",
                        lat: 48.8664, lng: 2.2967,
                        activities: [{ time: "途经", text: "加列拉宫广场 · 10 Avenue Pierre 1er de Serbie" }]
                    },
                    {
                        name: "Arc de Triomphe",
                        time: "下午",
                        kind: "highlight",
                        lat: 48.8738, lng: 2.2950,
                        activities: [{ time: "途经", text: "凯旋门" }]
                    },
                    {
                        name: "Avenue des Champs-Élysées",
                        time: "下午",
                        lat: 48.8698, lng: 2.3078,
                        activities: [{ time: "途经", text: "沿 Champs-Élysées 向东走" }]
                    },
                    {
                        name: "Grand Palais",
                        time: "下午",
                        lat: 48.8661, lng: 2.3125,
                        activities: [{ time: "途经", text: "大皇宫" }]
                    },
                    {
                        name: "Petit Palais",
                        time: "下午",
                        lat: 48.8660, lng: 2.3146,
                        activities: [{ time: "途经", text: "小皇宫" }]
                    },
                    {
                        name: "Place de la Concorde",
                        time: "下午",
                        kind: "highlight",
                        lat: 48.8656, lng: 2.3212,
                        activities: [{ time: "途经", text: "协和广场" }]
                    },
                    {
                        name: "La Madeleine",
                        time: "下午",
                        lat: 48.8701, lng: 2.3244,
                        activities: [{ time: "途经", text: "玛德莱娜教堂" }]
                    },
                    {
                        name: "Palais Garnier",
                        time: "下午",
                        kind: "highlight",
                        lat: 48.8719, lng: 2.3316,
                        activities: [{ time: "途经", text: "歌剧院，之后去午餐" }]
                    },
                    {
                        name: "La Grille Montorgueil",
                        time: "下午午餐",
                        kind: "highlight",
                        lat: 48.8650, lng: 2.3473,
                        activities: [{ time: "下午", text: "午餐，吃完后前往 Gare du Nord 回 London" }],
                        note: "50 Rue Montorgueil, 75002 Paris"
                    },
                    {
                        name: "Paris Gare du Nord",
                        time: "返程",
                        lat: 48.8809, lng: 2.3553,
                        activities: [{ time: "午餐后", text: "前往 Gare du Nord，Eurostar 回 London" }]
                    }
                ]
            }
        ];

        const map = L.map("map", { zoomControl: true }).setView([48.863, 2.34], 14);
        L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
            maxZoom: 19,
            attribution: "&copy; OpenStreetMap contributors"
        }).addTo(map);

        const tabsEl = document.getElementById("dayTabs");
        const summaryEl = document.getElementById("daySummary");
        const glanceEl = document.getElementById("glance");
        const itineraryEl = document.getElementById("itinerary");
        const detailTitleEl = document.getElementById("detailTitle");
        const detailNoteEl = document.getElementById("detailNote");
        const routeStatEl = document.getElementById("routeStat");
        let routeLine = null;
        let markers = [];
        let activeDay = 0;

        days.forEach((day, index) => {
            const button = document.createElement("button");
            button.type = "button";
            button.className = "day-tab";
            button.innerHTML = `${escapeHtml(day.date)}<br>${escapeHtml(day.weekday)}`;
            button.addEventListener("click", () => renderDay(index));
            tabsEl.appendChild(button);
        });

        function highlightStop(index) {
            document.querySelectorAll(".stop").forEach((el) => {
                el.classList.toggle("is-active", Number(el.dataset.index) === index);
            });
            document.querySelectorAll(".stop-card").forEach((card, i) => {
                card.classList.toggle("is-active", i === index);
            });
        }

        function focusStop(index, { scroll = false } = {}) {
            highlightStop(index);
            const zoom = days[activeDay].zoom || 14;
            map.flyTo(markers[index].getLatLng(), zoom, { duration: 0.7 });
            markers[index].openPopup();
            if (scroll) {
                itineraryEl.children[index].scrollIntoView({ behavior: "smooth", block: "center" });
            }
        }

        [glanceEl, itineraryEl].forEach((container) => {
            container.addEventListener("click", (event) => {
                const button = event.target.closest(".stop");
                if (!button) return;
                focusStop(Number(button.dataset.index), { scroll: container === glanceEl });
            });
        });

        async function renderDay(dayIndex) {
            activeDay = dayIndex;
            const day = days[dayIndex];
            document.querySelectorAll(".day-tab").forEach((tab, index) => {
                tab.classList.toggle("is-active", index === dayIndex);
            });
            summaryEl.innerHTML = `
                <p class="day-title">${escapeHtml(day.date)} ${escapeHtml(day.weekday)}</p>
                <p class="day-meta">${escapeHtml(day.title)}</p>`;
            detailTitleEl.textContent = [`${day.date} ${day.weekday}`, day.title].filter(Boolean).join(" · ");
            detailNoteEl.textContent = [`${day.stops.length} 个地点`, day.meta].filter(Boolean).join(" · ");
            glanceEl.innerHTML = "";
            itineraryEl.innerHTML = "";
            markers.forEach((marker) => marker.remove());
            markers = [];
            if (routeLine) routeLine.remove();

            const coords = day.stops.map((stop) => [stop.lat, stop.lng]);
            routeLine = L.polyline(coords, {
                color: day.color,
                weight: 4,
                opacity: 0.82,
                dashArray: "8, 8"
            }).addTo(map);

            day.stops.forEach((stop, index) => {
                const number = index + 1;
                const kindClass = stop.kind ? ` is-${stop.kind}` : "";
                const label = stop.kind === "stay"
                    ? '<span class="tag tag--stay">住宿</span>'
                    : stop.kind === "highlight"
                        ? '<span class="tag">重点</span>'
                        : "";
                const activityRows = stop.activities.map((activity) => `
                    <li class="activity">
                        <span class="activity-time">${escapeHtml(activity.time)}</span>
                        <span class="activity-text">${escapeHtml(activity.text)}</span>
                    </li>`).join("");
                const meta = [stop.drive, stop.time].filter(Boolean).join(" · ");
                const note = stop.note ? `<span class="note">${escapeHtml(stop.note)}</span>` : "";

                const marker = L.marker([stop.lat, stop.lng], {
                    icon: L.divIcon({
                        className: "",
                        html: `<div class="num-marker${kindClass}" style="background:${kindClass ? "" : day.color}">${number}</div>`,
                        iconSize: [29, 29],
                        iconAnchor: [14, 14],
                        popupAnchor: [0, -16]
                    })
                }).addTo(map);
                marker.bindPopup(`
                    <p class="popup-title">${number}. ${escapeHtml(stop.name)}${label}</p>
                    <p class="popup-meta">${escapeHtml(meta)}</p>
                    ${note}
                    <ul class="activities activities--popup">${activityRows}</ul>`);
                marker.on("click", () => highlightStop(index));
                markers.push(marker);

                const badgeStyle = kindClass ? "" : ` style="background:${day.color}"`;
                const glanceItem = document.createElement("li");
                glanceItem.className = "glance-item";
                glanceItem.innerHTML = `
                    <button class="stop" type="button" data-index="${index}">
                        <span class="badge${kindClass}"${badgeStyle}>${number}</span>
                        <span>
                            <span class="stop-title">${escapeHtml(stop.name)}${label}</span>
                            <span class="stop-meta">${escapeHtml(stop.time || "")}</span>
                        </span>
                    </button>`;
                glanceEl.appendChild(glanceItem);

                const item = document.createElement("li");
                item.className = "timeline-item";
                item.innerHTML = `
                    ${stop.drive ? `<p class="leg-row">${escapeHtml(stop.drive)}</p>` : ""}
                    <article class="stop-card">
                        <button class="stop" type="button" data-index="${index}">
                            <span class="badge${kindClass}"${badgeStyle}>${number}</span>
                            <span>
                                <span class="stop-title">${escapeHtml(stop.name)}${label}</span>
                                <span class="stop-meta">${escapeHtml(stop.time || "")}</span>
                            </span>
                        </button>
                        <ul class="activities">${activityRows}</ul>
                        ${note}
                    </article>`;
                itineraryEl.appendChild(item);
            });

            map.fitBounds(routeLine.getBounds().pad(0.18));
            await loadRoute(day, coords, dayIndex);
        }

        async function loadRoute(day, coords, expectedDay) {
            if (day.mode === "eurostar") {
                routeStatEl.textContent = "Eurostar · 约 2 小时 15 分（示意线）";
                return;
            }
            routeStatEl.textContent = "正在规划步行路线…";
            const path = coords.map(([lat, lng]) => `${lng},${lat}`).join(";");
            const url = `https://router.project-osrm.org/route/v1/foot/${path}?overview=full&geometries=geojson`;
            try {
                const response = await fetch(url);
                if (!response.ok) throw new Error("route request failed");
                const data = await response.json();
                if (activeDay !== expectedDay) return;
                const route = data.routes && data.routes[0];
                if (!route) throw new Error("no route returned");
                routeLine.setLatLngs(route.geometry.coordinates.map(([lng, lat]) => [lat, lng]));
                routeLine.setStyle({ dashArray: null });
                const km = (route.distance / 1000).toFixed(1);
                const minutes = Math.round(route.duration / 60);
                routeStatEl.textContent = `步行约 ${km} km · ${minutes} 分`;
                map.fitBounds(routeLine.getBounds().pad(0.15));
            } catch (error) {
                if (activeDay === expectedDay) routeStatEl.textContent = "步行路线暂不可用，显示直线示意";
            }
        }

        function escapeHtml(value) {
            return String(value)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;");
        }

        renderDay(0);
    </script>
</body>
</html>
