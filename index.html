<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <title>Jason's Trip</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Jason 的自驾行程安排，公开分享给可能用得上的人。">
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <link rel="stylesheet" href="css/tokens.css">
    <link rel="stylesheet" href="css/home.css">
    <script src="js/color.js"></script>
    <noscript><link rel="stylesheet" href="css/home-noscript.css"></noscript>
</head>
<body>
    <main>
        <p class="kicker">Personal itineraries</p>
        <h1>Jason's Trip</h1>
        <section class="footprint" aria-labelledby="footprint-title">
            <h2 id="footprint-title">旅行足迹</h2>
            <div id="map"></div>
            <p class="map-legend">到访次数<i></i><i></i><i></i><i></i>少 → 多</p>
            <div class="stats" id="stats"></div>
            <ul class="places" id="places"></ul>
        </section>
        <nav class="year-tabs" id="yearTabs" role="tablist" aria-label="按年份查看行程"></nav>
        <div id="yearPanels"></div>
        <noscript><p class="year-title">开启 JavaScript 后可以按年份查看行程。</p></noscript>
    </main>
    <script>
        // 只保留最近去过的年份和次数，不放具体日期和行程。
        const places = [
            { name: "澳大利亚", iso: "AUS", flag: "🇦🇺", visits: 21, lastYear: 2026, lastDate: "2026-09-02", lat: -25.3, lng: 133.8 },
            { name: "日本", iso: "JPN", flag: "🇯🇵", visits: 5, lastYear: 2026, lastDate: "2026-08-14", lat: 36.2, lng: 138.3 },
            { name: "中国香港", iso: "HKG", flag: "🇭🇰", visits: 2, lastYear: 2026, lastDate: "2026-08-04", lat: 22.32, lng: 114.17 },
            { name: "中国", iso: "CHN", flag: "🇨🇳", visits: 22, lastYear: 2026, lastDate: "2026-08-03", lat: 35.0, lng: 105.0 },
            { name: "美国", iso: "USA", flag: "🇺🇸", visits: 3, lastYear: 2026, lastDate: "2026-02-13", lat: 39.5, lng: -98.35 },
            { name: "新加坡", iso: "SGP", flag: "🇸🇬", visits: 3, lastYear: 2026, lastDate: "2026-01-08", lat: 1.35, lng: 103.82 },
            { name: "马来西亚", iso: "MYS", flag: "🇲🇾", visits: 1, lastYear: 2026, lastDate: "2026-01-07", lat: 4.2, lng: 102.0 },
            { name: "英国", iso: "GBR", flag: "🇬🇧", visits: 4, lastYear: 2025, lastDate: "2025-12-23", lat: 54.0, lng: -2.0 },
            { name: "阿联酋", iso: "ARE", flag: "🇦🇪", visits: 1, lastYear: 2025, lastDate: "2025-02-11", lat: 24.0, lng: 54.0 },
            { name: "法国", iso: "FRA", flag: "🇫🇷", visits: 1, lastYear: 2025, lastDate: "2025-01-18", lat: 46.6, lng: 2.4 },
            { name: "泰国", iso: "THA", flag: "🇹🇭", visits: 2, lastYear: 2019, lastDate: "2019-12-23", lat: 15.0, lng: 101.0 }
        ];

        const sorted = [...places].sort((a, b) => b.lastDate.localeCompare(a.lastDate));
        const totalVisits = places.reduce((sum, place) => sum + place.visits, 0);
        const latestYear = Math.max(...places.map((place) => place.lastYear));

        const placeByIso = new Map(places.map((place) => [place.iso, place]));

        function visitOpacity(visits) {
            return visits >= 16 ? 0.88 : visits >= 6 ? 0.7 : visits >= 3 ? 0.52 : 0.36;
        }

        fetch("trips/data/countries.geo.json")
            .then((response) => response.json())
            .then((world) => {
                world.features = world.features.filter((feature) => feature.id !== "ATA");
                world.features.forEach((feature) => {
                    feature.properties.name = feature.id;
                });
                echarts.registerMap("travel-world", world);

                const outlined = new Set(world.features.map((feature) => feature.id));
                const regions = world.features.map((feature) => {
                    const place = placeByIso.get(feature.id);
                    return {
                        name: feature.id,
                        itemStyle: {
                            areaColor: place
                                ? `rgba(${tokenColor("--accent-rgb")}, ${visitOpacity(place.visits)})`
                                : tokenColor("--map-land")
                        }
                    };
                });
                const dots = places
                    .filter((place) => !outlined.has(place.iso))
                    .map((place) => ({
                        name: place.iso,
                        value: [place.lng, place.lat, place.visits],
                        place
                    }));

                const chart = echarts.init(document.getElementById("map"), null, { renderer: "svg" });
                chart.setOption({
                    animationDuration: 450,
                    tooltip: {
                        trigger: "item",
                        borderWidth: 1,
                        borderColor: tokenColor("--line"),
                        backgroundColor: "rgba(255, 255, 255, 0.97)",
                        textStyle: { color: tokenColor("--ink"), fontSize: 12 },
                        formatter: (params) => {
                            const place = params.data?.place || placeByIso.get(params.name);
                            if (!place) return "暂无旅行记录";
                            return `<b>${place.flag} ${place.name}</b><br>最近 ${place.lastYear} 年 · 去过 ${place.visits} 次`;
                        }
                    },
                    geo: {
                        map: "travel-world",
                        roam: true,
                        left: 4,
                        right: 4,
                        top: 4,
                        bottom: 4,
                        boundingCoords: [[-168, 78], [178, -56]],
                        itemStyle: {
                            areaColor: tokenColor("--map-land"),
                            borderColor: tokenColor("--surface"),
                            borderWidth: 0.8
                        },
                        emphasis: {
                            label: { show: false },
                            itemStyle: { areaColor: tokenColor("--map-hover"), borderColor: tokenColor("--ink"), borderWidth: 1.2 }
                        },
                        regions
                    },
                    series: [{
                        name: "微型地区",
                        type: "scatter",
                        coordinateSystem: "geo",
                        data: dots,
                        symbolSize: (value) => 7 + Math.sqrt(value[2]) * 2,
                        itemStyle: {
                            color: tokenColor("--accent"),
                            borderColor: tokenColor("--surface"),
                            borderWidth: 2,
                            opacity: 0.95
                        },
                        emphasis: { scale: 1.35 }
                    }]
                });

                const resizeObserver = new ResizeObserver(() => chart.resize());
                resizeObserver.observe(document.getElementById("map"));
            })
            .catch((error) => {
                document.getElementById("map").innerHTML =
                    `<p class="map-error">地图加载失败，请稍后重试。</p>`;
                console.error("Failed to load travel map:", error);
            });

        document.getElementById("stats").innerHTML = [
            [places.length, "个国家/地区"],
            [totalVisits, "次到访"],
            [latestYear, "最近一次"]
        ].map(([value, label]) => `<div><b>${value}</b><span>${label}</span></div>`).join("");

        document.getElementById("places").innerHTML = sorted.map((place) => `
            <li>
                <p class="place-name">${place.flag} ${place.name}</p>
                <p class="place-meta">最近 ${place.lastYear} 年 · ${place.visits} 次</p>
            </li>`).join("");

        function renderCatalog(catalog) {
            const tabsEl = document.getElementById("yearTabs");
            const panelsEl = document.getElementById("yearPanels");
            catalog.years.forEach((group) => {
                const published = group.trips.filter((trip) => trip.published);
                const button = document.createElement("button");
                button.type = "button";
                button.className = "year-tab";
                button.id = `tab-${group.year}`;
                button.dataset.year = String(group.year);
                button.setAttribute("role", "tab");
                button.setAttribute("aria-controls", `panel-${group.year}`);
                const yearLabel = document.createElement("b");
                yearLabel.textContent = String(group.year);
                const count = document.createElement("span");
                count.textContent = `${published.length} 段行程`;
                button.append(yearLabel, count);
                tabsEl.append(button);

                const panel = document.createElement("section");
                panel.className = "year";
                panel.id = `panel-${group.year}`;
                panel.setAttribute("role", "tabpanel");
                panel.setAttribute("aria-labelledby", button.id);
                const heading = document.createElement("h2");
                heading.className = "visually-hidden year-title";
                heading.textContent = String(group.year);
                const list = document.createElement("ul");
                list.className = "trips";
                published.forEach((trip) => {
                    const item = document.createElement("li");
                    const link = document.createElement("a");
                    link.className = "trip";
                    link.href = trip.href;
                    const tags = document.createElement("p");
                    tags.className = "trip-tags";
                    const flag = document.createElement("span");
                    flag.className = "trip-tag trip-tag--flag";
                    flag.textContent = trip.flag;
                    tags.append(flag);
                    trip.tags.forEach((tag) => {
                        const span = document.createElement("span");
                        span.className = "trip-tag";
                        span.textContent = tag;
                        tags.append(span);
                    });
                    const title = document.createElement("h3");
                    title.textContent = trip.title;
                    const summary = document.createElement("p");
                    summary.textContent = trip.summary;
                    link.append(tags, title, summary);
                    item.append(link);
                    list.append(item);
                });
                panel.append(heading, list);
                panelsEl.append(panel);
            });

            const yearTabs = Array.from(document.querySelectorAll(".year-tab"));
            const yearPanels = yearTabs.map((tab) => document.getElementById(tab.getAttribute("aria-controls")));

            function selectYear(index, { focus = false, updateHash = false } = {}) {
                yearTabs.forEach((tab, i) => {
                    const isActive = i === index;
                    tab.classList.toggle("is-active", isActive);
                    tab.setAttribute("aria-selected", String(isActive));
                    tab.tabIndex = isActive ? 0 : -1;
                    yearPanels[i].hidden = !isActive;
                });
                if (focus) yearTabs[index].focus();
                if (updateHash) history.replaceState(null, "", `#${yearTabs[index].dataset.year}`);
            }

            function indexFromHash() {
                const year = decodeURIComponent(window.location.hash.slice(1));
                return yearTabs.findIndex((tab) => tab.dataset.year === year);
            }

            yearTabs.forEach((tab, index) => {
                tab.addEventListener("click", () => selectYear(index, { updateHash: true }));
                tab.addEventListener("keydown", (event) => {
                    const step = event.key === "ArrowRight" ? 1 : event.key === "ArrowLeft" ? -1 : 0;
                    if (!step) return;
                    event.preventDefault();
                    selectYear((index + step + yearTabs.length) % yearTabs.length, { focus: true, updateHash: true });
                });
            });

            window.addEventListener("hashchange", () => {
                const index = indexFromHash();
                if (index >= 0) selectYear(index);
            });

            const initialYear = indexFromHash();
            selectYear(initialYear >= 0 ? initialYear : 0);
        }

        fetch("trips/data/trips.json")
            .then((response) => {
                if (!response.ok) throw new Error("trip list request failed");
                return response.json();
            })
            .then(renderCatalog)
            .catch((error) => {
                document.getElementById("yearPanels").textContent = "行程列表加载失败，请稍后重试。";
                console.error("Failed to load trip list:", error);
            });
    </script>
</body>
</html>
