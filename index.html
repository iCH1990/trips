<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <link rel="icon" href="favicon.png" type="image/png">
    <title>Jason's Trip</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Jason 的自驾行程安排，公开分享给可能用得上的人。">
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <link rel="stylesheet" href="css/tokens.css">
    <link rel="stylesheet" href="css/tags.css">
    <link rel="stylesheet" href="css/home.css">
    <script src="js/trip-route.js"></script>
    <script src="js/color.js"></script>
    <noscript><link rel="stylesheet" href="css/home-noscript.css"></noscript>
</head>
<body>
    <main>
        <h1>Jason's Trip</h1>
        <section class="footprint">
            <div id="map"></div>
            <p class="map-legend">到访次数<i></i><i></i><i></i><i></i>少 → 多</p>
            <div class="stats" id="stats"></div>
            <ul class="places" id="places"></ul>
        </section>
        <p id="routeStatus" class="route-status" hidden></p>
        <div class="filters" id="tripFilters" role="group" aria-label="筛选行程">
            <label class="filter">
                <span>时长</span>
                <select id="filterDuration" autocomplete="off">
                    <option value="">所有</option>
                    <option value="一日游">一日游</option>
                    <option value="两天一晚">两天一晚</option>
                    <option value="短途">短途</option>
                    <option value="旅居">旅居</option>
                </select>
            </label>
            <label class="filter">
                <span>类型</span>
                <select id="filterType" autocomplete="off">
                    <option value="">所有</option>
                    <option value="度假">度假</option>
                    <option value="旅行">旅行</option>
                    <option value="自驾">自驾</option>
                    <option value="露营">露营</option>
                </select>
            </label>
            <label class="filter">
                <span>年份</span>
                <select id="filterYear" autocomplete="off">
                    <option value="">所有</option>
                </select>
            </label>
            <label class="filter">
                <span>国家</span>
                <select id="filterCountry" autocomplete="off">
                    <option value="">所有</option>
                </select>
            </label>
        </div>
        <p id="tripCount" class="trip-count" aria-live="polite"></p>
        <ul class="trips" id="tripList"></ul>
        <button type="button" class="trip-more" id="tripMore" hidden>加载更多</button>
        <noscript><p class="year-title">开启 JavaScript 后可以筛选并查看行程。</p></noscript>
    </main>
    <p class="trip-loading">正在打开行程…</p>
    <iframe id="tripFrame" class="trip-frame" title="行程"></iframe>
    <script>
        // 只保留最近去过的年份和次数，不放具体日期和行程。
        const places = [
            { name: "澳大利亚", iso: "AUS", flag: "🇦🇺", visits: 21, lastYear: 2026, lastDate: "2026-09-02", lat: -25.3, lng: 133.8 },
            { name: "日本", iso: "JPN", flag: "🇯🇵", visits: 5, lastYear: 2026, lastDate: "2026-08-14", lat: 36.2, lng: 138.3 },
            { name: "中国香港", iso: "HKG", flag: "🇭🇰", visits: 2, lastYear: 2026, lastDate: "2026-08-04", lat: 22.32, lng: 114.17 },
            { name: "中国", iso: "CHN", flag: "🇨🇳", visits: 22, lastYear: 2026, lastDate: "2026-08-03", lat: 35.0, lng: 105.0 },
            { name: "美国", iso: "USA", flag: "🇺🇸", visits: 2, lastYear: 2026, lastDate: "2026-02-13", lat: 39.5, lng: -98.35 },
            { name: "新加坡", iso: "SGP", flag: "🇸🇬", visits: 3, lastYear: 2026, lastDate: "2026-01-08", lat: 1.35, lng: 103.82 },
            { name: "马来西亚", iso: "MYS", flag: "🇲🇾", visits: 1, lastYear: 2026, lastDate: "2026-01-07", lat: 4.2, lng: 102.0 },
            { name: "英国", iso: "GBR", flag: "🇬🇧", visits: 4, lastYear: 2025, lastDate: "2025-12-23", lat: 54.0, lng: -2.0 },
            { name: "阿联酋", iso: "ARE", flag: "🇦🇪", visits: 1, lastYear: 2025, lastDate: "2025-02-11", lat: 24.0, lng: 54.0 },
            { name: "法国", iso: "FRA", flag: "🇫🇷", visits: 1, lastYear: 2025, lastDate: "2025-01-18", lat: 46.6, lng: 2.4 },
            { name: "泰国", iso: "THA", flag: "🇹🇭", visits: 2, lastYear: 2019, lastDate: "2019-12-23", lat: 15.0, lng: 101.0 }
        ];

        const sorted = [...places].sort((a, b) => b.lastDate.localeCompare(a.lastDate));
        const totalVisits = places.reduce((sum, place) => sum + place.visits, 0);
        const latestYear = Math.max(...places.map((place) => place.lastYear));

        const placeByIso = new Map(places.map((place) => [place.iso, place]));

        function visitOpacity(visits) {
            return visits >= 16 ? 0.88 : visits >= 6 ? 0.7 : visits >= 3 ? 0.52 : 0.36;
        }

        fetch("trips/data/countries.geo.json")
            .then((response) => response.json())
            .then((world) => {
                world.features = world.features.filter((feature) => feature.id !== "ATA");
                world.features.forEach((feature) => {
                    feature.properties.name = feature.id;
                });
                echarts.registerMap("travel-world", world);

                const outlined = new Set(world.features.map((feature) => feature.id));
                const regions = world.features.map((feature) => {
                    const place = placeByIso.get(feature.id);
                    return {
                        name: feature.id,
                        itemStyle: {
                            areaColor: place
                                ? `rgba(${tokenColor("--accent-rgb")}, ${visitOpacity(place.visits)})`
                                : tokenColor("--map-land")
                        }
                    };
                });
                const dots = places
                    .filter((place) => !outlined.has(place.iso))
                    .map((place) => ({
                        name: place.iso,
                        value: [place.lng, place.lat, place.visits],
                        place
                    }));

                const chart = echarts.init(document.getElementById("map"), null, { renderer: "svg" });
                chart.setOption({
                    animationDuration: 450,
                    tooltip: {
                        trigger: "item",
                        borderWidth: 1,
                        borderColor: tokenColor("--line"),
                        backgroundColor: "rgba(255, 255, 255, 0.97)",
                        textStyle: { color: tokenColor("--ink"), fontSize: 12 },
                        formatter: (params) => {
                            const place = params.data?.place || placeByIso.get(params.name);
                            if (!place) return "暂无旅行记录";
                            return `<b>${place.flag} ${place.name}</b><br>最近 ${place.lastYear} 年 · 去过 ${place.visits} 次`;
                        }
                    },
                    geo: {
                        map: "travel-world",
                        roam: true,
                        left: 4,
                        right: 4,
                        top: 4,
                        bottom: 4,
                        boundingCoords: [[-168, 78], [178, -56]],
                        itemStyle: {
                            areaColor: tokenColor("--map-land"),
                            borderColor: tokenColor("--surface"),
                            borderWidth: 0.8
                        },
                        emphasis: {
                            label: { show: false },
                            itemStyle: { areaColor: tokenColor("--map-hover"), borderColor: tokenColor("--ink"), borderWidth: 1.2 }
                        },
                        regions
                    },
                    series: [{
                        name: "微型地区",
                        type: "scatter",
                        coordinateSystem: "geo",
                        data: dots,
                        symbolSize: (value) => 7 + Math.sqrt(value[2]) * 2,
                        itemStyle: {
                            color: tokenColor("--accent"),
                            borderColor: tokenColor("--surface"),
                            borderWidth: 2,
                            opacity: 0.95
                        },
                        emphasis: { scale: 1.35 }
                    }]
                });

                const resizeObserver = new ResizeObserver(() => chart.resize());
                resizeObserver.observe(document.getElementById("map"));
            })
            .catch((error) => {
                document.getElementById("map").innerHTML =
                    `<p class="map-error">地图加载失败，请稍后重试。</p>`;
                console.error("Failed to load travel map:", error);
            });

        document.getElementById("stats").innerHTML = [
            [places.length, "个国家/地区"],
            [totalVisits, "次到访"],
            [latestYear, "最近一次"]
        ].map(([value, label]) => `<div><b>${value}</b><span>${label}</span></div>`).join("");

        document.getElementById("places").innerHTML = sorted.map((place) => `
            <li>
                <p class="place-name">${place.flag} ${place.name}</p>
                <p class="place-meta">最近 ${place.lastYear} 年 · ${place.visits} 次</p>
            </li>`).join("");

        function renderCatalog(catalog) {
            const filtersEl = document.getElementById("tripFilters");
            const durationSelect = document.getElementById("filterDuration");
            const typeSelect = document.getElementById("filterType");
            const yearSelect = document.getElementById("filterYear");
            const countrySelect = document.getElementById("filterCountry");
            const listEl = document.getElementById("tripList");
            const moreBtn = document.getElementById("tripMore");
            const countEl = document.getElementById("tripCount");
            const routeStatus = document.getElementById("routeStatus");
            const frame = document.getElementById("tripFrame");
            const pageSize = 5;
            const trips = [];
            const years = [];
            const countries = [];
            const byId = new Map();

            catalog.years.forEach((group) => {
                let publishedCount = 0;
                group.trips.forEach((trip) => {
                    trip.year = group.year;
                    trip.routeId = TripRoute.idFromHref(trip.href);
                    byId.set(trip.routeId, trip);
                    if (!trip.published) return;
                    publishedCount += 1;
                    trips.push(trip);
                    if (!countries.includes(trip.country)) countries.push(trip.country);
                });
                if (publishedCount) years.push(group.year);
            });

            const durationOrder = ["一日游", "两天一晚", "短途", "旅居"];
            const typeOrder = ["度假", "旅行", "自驾", "露营"];
            const selects = [
                [durationSelect, "duration"],
                [typeSelect, "type"],
                [yearSelect, "year"],
                [countrySelect, "country"]
            ];

            let shown = pageSize;
            let filtered = trips;
            let armAuto = false;
            let frameSrc = "";

            function createCard(trip) {
                const item = document.createElement("li");
                const link = document.createElement("a");
                link.className = "trip";
                link.href = `#${trip.routeId}`;
                const tags = document.createElement("p");
                tags.className = "trip-tags";
                const flag = document.createElement("span");
                flag.className = "trip-tag trip-tag--flag";
                flag.textContent = trip.flag;
                tags.append(flag);
                [String(trip.year), trip.country, trip.duration, trip.type].forEach((tag) => {
                    const span = document.createElement("span");
                    span.className = "trip-tag";
                    span.textContent = tag;
                    tags.append(span);
                });
                const title = document.createElement("h3");
                title.textContent = trip.title;
                const summary = document.createElement("p");
                summary.textContent = trip.summary;
                link.append(tags, title, summary);
                item.append(link);
                return item;
            }

            function paint() {
                listEl.replaceChildren(...filtered.slice(0, shown).map(createCard));
                moreBtn.hidden = shown >= filtered.length;
                countEl.textContent = filtered.length ? `${filtered.length} 段行程` : "没有符合条件的行程。";
                filtersEl.querySelectorAll(".filter").forEach((filter) => {
                    filter.classList.toggle("is-set", filter.querySelector("select").value !== "");
                });
            }

            function matches(trip, ignored) {
                if (ignored !== "duration" && durationSelect.value && trip.duration !== durationSelect.value) return false;
                if (ignored !== "type" && typeSelect.value && trip.type !== typeSelect.value) return false;
                if (ignored !== "year" && yearSelect.value && String(trip.year) !== yearSelect.value) return false;
                if (ignored !== "country" && countrySelect.value && trip.country !== countrySelect.value) return false;
                return true;
            }

            function choices(key) {
                const pool = trips.filter((trip) => matches(trip, key));
                if (key === "duration") return durationOrder.filter((value) => pool.some((trip) => trip.duration === value));
                if (key === "type") return typeOrder.filter((value) => pool.some((trip) => trip.type === value));
                if (key === "year") return years.filter((year) => pool.some((trip) => trip.year === year)).map(String);
                return countries.filter((country) => pool.some((trip) => trip.country === country));
            }

            function fillSelect(select, values) {
                const current = select.value;
                const next = values.includes(current) ? current : "";
                const desired = ["", ...values];
                const existing = [...select.options].map((option) => option.value);
                const sameOptions = existing.length === desired.length && existing.every((value, index) => value === desired[index]);
                if (!sameOptions) {
                    const fragment = document.createDocumentFragment();
                    desired.forEach((value) => {
                        const option = document.createElement("option");
                        option.value = value;
                        option.textContent = value || "所有";
                        fragment.append(option);
                    });
                    select.replaceChildren(fragment);
                }
                if (select.value !== next) select.value = next;
                return current !== "" && next === "";
            }

            function syncOptions(keepKey) {
                let guard = 0;
                let cleared = true;
                while (cleared && guard < 5) {
                    cleared = false;
                    guard += 1;
                    selects.forEach(([select, key]) => {
                        if (key === keepKey) return;
                        if (fillSelect(select, choices(key))) cleared = true;
                    });
                }
                selects.forEach(([select, key]) => fillSelect(select, choices(key)));
            }

            function applyFilters() {
                filtered = trips.filter((trip) => matches(trip));
            }

            function syncYearHash() {
                const url = new URL(window.location.href);
                url.hash = yearSelect.value;
                if (url.href !== window.location.href) history.replaceState(null, "", url);
            }

            function refresh(keepKey, { syncHash = true } = {}) {
                shown = pageSize;
                armAuto = false;
                syncOptions(keepKey);
                if (syncHash) {
                    routeStatus.hidden = true;
                    routeStatus.textContent = "";
                    syncYearHash();
                }
                applyFilters();
                paint();
            }

            function loadMore() {
                if (shown >= filtered.length) return;
                shown = Math.min(shown + pageSize, filtered.length);
                paint();
            }

            function revealList() {
                const edge = filtersEl.getBoundingClientRect().bottom + 8;
                const target = listEl.firstElementChild || countEl;
                const listTop = target.getBoundingClientRect().top;
                if (listTop < edge || listTop > window.innerHeight - 40) {
                    window.scrollBy({ top: listTop - edge });
                }
            }

            function showTrip(trip) {
                const root = document.documentElement;
                root.classList.add("is-trip-route");
                root.classList.remove("is-trip-ready");
                document.title = trip.title;
                frame.title = trip.title;
                if (frameSrc !== trip.href) {
                    frameSrc = trip.href;
                    frame.src = trip.href;
                } else {
                    root.classList.add("is-trip-ready");
                    frame.focus();
                }
            }

            function showHome() {
                document.documentElement.classList.remove("is-trip-route", "is-trip-ready");
                document.title = "Jason's Trip";
                if (frameSrc) {
                    frameSrc = "";
                    frame.src = "about:blank";
                    frame.title = "行程";
                }
            }

            frame.addEventListener("load", () => {
                if (!frameSrc || !document.documentElement.classList.contains("is-trip-route")) return;
                document.documentElement.classList.add("is-trip-ready");
                frame.focus();
            });

            function applyRoute() {
                const raw = TripRoute.hashValue(window.location.hash);
                const trip = byId.get(raw);
                if (trip) {
                    routeStatus.hidden = true;
                    routeStatus.textContent = "";
                    showTrip(trip);
                    return;
                }
                showHome();
                const knownYear = years.some((year) => String(year) === raw);
                if (knownYear) {
                    routeStatus.hidden = true;
                    routeStatus.textContent = "";
                    if (![...yearSelect.options].some((option) => option.value === raw)) {
                        const option = document.createElement("option");
                        option.value = raw;
                        option.textContent = raw;
                        yearSelect.append(option);
                    }
                    yearSelect.value = raw;
                } else if (raw) {
                    routeStatus.hidden = false;
                    routeStatus.textContent = "没有找到这段行程。";
                    yearSelect.value = "";
                } else {
                    routeStatus.hidden = true;
                    routeStatus.textContent = "";
                    yearSelect.value = "";
                }
                refresh("year", { syncHash: false });
            }

            function maybeAutoLoad() {
                if (moreBtn.hidden || document.documentElement.classList.contains("is-trip-route")) {
                    armAuto = true;
                    return;
                }
                const rect = moreBtn.getBoundingClientRect();
                const near = rect.top <= window.innerHeight + 120 && rect.bottom >= 0;
                if (!near) {
                    armAuto = true;
                    return;
                }
                if (!armAuto) return;
                armAuto = false;
                loadMore();
            }

            selects.forEach(([select, key]) => {
                select.addEventListener("change", () => {
                    refresh(key);
                    revealList();
                });
            });
            moreBtn.addEventListener("click", () => {
                loadMore();
                armAuto = false;
            });
            window.addEventListener("scroll", maybeAutoLoad, { passive: true });
            window.addEventListener("hashchange", applyRoute);
            durationSelect.value = "";
            typeSelect.value = "";
            countrySelect.value = "";
            yearSelect.value = "";
            selects.forEach(([select, key]) => fillSelect(select, choices(key)));
            applyRoute();
        }

        fetch("trips/data/trips.json")
            .then((response) => {
                if (!response.ok) throw new Error("trip list request failed");
                return response.json();
            })
            .then(renderCatalog)
            .catch((error) => {
                document.documentElement.classList.remove("is-trip-route", "is-trip-ready");
                document.getElementById("tripCount").textContent = "行程列表加载失败，请稍后重试。";
                console.error("Failed to load trip list:", error);
            });
    </script>
</body>
</html>
